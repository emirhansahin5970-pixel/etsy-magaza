# main dalına her gönderimde uygulamayı derler, veri katmanı testlerini çalıştırır ve GitHub Pages'te yayınlar.
# Bir kez yapılması gereken ayar: GitHub › Settings › Pages › Build and deployment › Source: "GitHub Actions".
# Adres: https://emirhansahin5970-pixel.github.io/etsy-magaza/
name: Yayınla (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Derle
        run: node app/build.mjs
      - name: Veri katmanı testleri
        run: node --test tests/storage.test.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
