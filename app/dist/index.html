<!-- Tema, sayfa çizilmeden önce uygulanır (koyu tema seçiliyken beyaz parlamayı önler). Kayıtlı seçim yoksa cihaz teması kullanılır. -->
<script>(function(){try{var s=JSON.parse(window.localStorage.getItem("gx.ssc.settings.v1")||"{}");if(s&&(s.theme==="dark"||s.theme==="light")){document.documentElement.setAttribute("data-theme",s.theme);}}catch(e){}})();</script>

<!-- Yazı tipleri çizimi ENGELLEMEZ: media="print" ile indirilir, boot.js yüklenince etkinleştirir.
     Google Fonts'a ulaşılamazsa (ya da istek askıda kalırsa) sayfa sistem fontlarıyla açılır. -->
<link id="gx-fonts" rel="stylesheet" media="print" href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap">
<style>
/* Düzen: mobilde tek sütun, en az 16px kenar boşluğu; okuma metni ~34rem; geniş ekranda açılış ve alışkanlık iki sütun. */
:root {
  /* Renk: krem zemin, koyu metin, adaçayı (seçim ve yapı), turuncu yalnızca önemli eylem ve küçük işaret */
  --cream: #fbf6ec;
  --paper: #fffdf8;
  --ink: #1d231f;
  --ink-soft: #4d554f;
  --line: #e2d9c6;
  --line-strong: #cbc1ab;
  --field-border: #7f8780; /* form alanı ve seçenek kenarlığı: ≥ 3:1 */
  --sage: #4b6a54;        /* metin/ikon: kremde ~5.6:1 */
  --sage-deep: #34503d;   /* koyu yüzey: krem yazıyla ~8:1 */
  --sage-soft: #dde7da;
  --sage-wash: #eef3ea;
  --accent: #b4501c;      /* birincil eylem zemini: beyaz yazıyla ~5.7:1 */
  --accent-ink: #9a4417;  /* turuncu metin: kremde ~6:1 */
  --accent-mark: #d9692c; /* yalnızca küçük işaretler (tik, nokta) */
  --accent-soft: #f6e3d4;
  --danger: #9e2f22;       /* hata metni ve kenarlığı */
  --danger-solid: #9e2f22; /* hata düğmesi zemini (beyaz yazı) */
  --danger-soft: #f7dcd6;
  --danger-ink: #5c1a12;   /* hata kutusu metni */
  --focus: #1f5fbf;
  --field: #ffffff;        /* form alanı ve açık yüzeyler */
  --placeholder: #6c736d;
  --on-accent: #ffffff;    /* turuncu/kırmızı düğme üstündeki yazı */
  --cover-bg: #34503d;
  --cover-ink: #fffaf0;
  --cover-muted: #dde7da;
  --shadow: rgb(29 35 31 / 0.14);
  --shadow-strong: rgb(29 35 31 / 0.25);
  --backdrop: rgb(29 35 31 / 0.45);

  /* Yazı: iki aile. Başlık: karakterli serif. Metin ve arayüz: okunaklı sans. */
  --font-display: "Fraunces", "Iowan Old Style", Georgia, "Times New Roman", serif;
  --font-text: "Figtree", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;

  --step--1: 0.9rem;
  --step-0: 1.0625rem;
  --step-1: 1.1875rem;
  --step-2: 1.45rem;
  --step-3: 1.9rem;

  --measure: 34rem;
  --page: 40rem;
  --page-wide: 64rem;
  --gutter: max(1rem, env(safe-area-inset-left, 0px));
  --radius: 14px;
  --tap: 3rem;            /* 48px: 44px alt sınırın üstünde */
  --ease: cubic-bezier(.2, .7, .2, 1);
  --dur: 200ms;

  color-scheme: light;
}

/* Koyu tema: cihaz koyu temadaysa (kullanıcı "Açık" seçmediyse) ya da kullanıcı "Koyu" seçtiyse.
   İki blok aynı değerleri taşır; tests/contrast.mjs ikisinin eşit olduğunu ve kontrastları denetler. */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
  --cream: #191b1a;
  --paper: #222523;
  --ink: #ece7dc;
  --ink-soft: #bcb6a9;
  --line: #3a3f3b;
  --line-strong: #5b625d;
  --field-border: #8a928c;
  --sage: #9cc0a4;
  --sage-deep: #b5d3bb;
  --sage-soft: #32453a;
  --sage-wash: #232c26;
  --accent: #b4501c;
  --accent-ink: #f2a679;
  --accent-mark: #e8834a;
  --accent-soft: #3a2a20;
  --danger: #ff9a8b;
  --danger-solid: #b0392b;
  --danger-soft: #3d2320;
  --danger-ink: #ffc3b9;
  --focus: #8ab4ff;
  --field: #2a2e2b;
  --placeholder: #9aa09a;
  --on-accent: #ffffff;
  --cover-bg: #2b4033;
  --cover-ink: #f6f1e6;
  --cover-muted: #c4d6c8;
  --shadow: rgb(0 0 0 / 0.35);
  --shadow-strong: rgb(0 0 0 / 0.55);
  --backdrop: rgb(0 0 0 / 0.6);
  color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --cream: #191b1a;
  --paper: #222523;
  --ink: #ece7dc;
  --ink-soft: #bcb6a9;
  --line: #3a3f3b;
  --line-strong: #5b625d;
  --field-border: #8a928c;
  --sage: #9cc0a4;
  --sage-deep: #b5d3bb;
  --sage-soft: #32453a;
  --sage-wash: #232c26;
  --accent: #b4501c;
  --accent-ink: #f2a679;
  --accent-mark: #e8834a;
  --accent-soft: #3a2a20;
  --danger: #ff9a8b;
  --danger-solid: #b0392b;
  --danger-soft: #3d2320;
  --danger-ink: #ffc3b9;
  --focus: #8ab4ff;
  --field: #2a2e2b;
  --placeholder: #9aa09a;
  --on-accent: #ffffff;
  --cover-bg: #2b4033;
  --cover-ink: #f6f1e6;
  --cover-muted: #c4d6c8;
  --shadow: rgb(0 0 0 / 0.35);
  --shadow-strong: rgb(0 0 0 / 0.55);
  --backdrop: rgb(0 0 0 / 0.6);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
html, body { margin: 0; background: var(--cream); color: var(--ink); }
body {
  font-family: var(--font-text);
  font-size: var(--step-0);
  line-height: 1.55;
  /* Uzun Türkçe kelimeler büyük yazı boyutunda dar ekrana sığmazsa bölünebilsin */
  overflow-wrap: anywhere;
  -webkit-tap-highlight-color: transparent;
}
img, svg { max-width: 100%; }
button, input, textarea, select { font: inherit; color: inherit; }
[hidden] { display: none !important; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 6px; }

.skip {
  position: absolute; left: 0.5rem; top: -4rem; z-index: 50;
  background: var(--ink); color: var(--cream); padding: 0.6rem 1rem; border-radius: 8px;
}
.skip:focus { top: calc(0.5rem + env(safe-area-inset-top, 0px)); }
.visually-hidden {
  position: absolute !important; width: 1px; height: 1px; overflow: hidden;
  clip: rect(0 0 0 0); white-space: nowrap;
}

h1, h2, h3 { font-family: var(--font-display); font-weight: 600; line-height: 1.2; text-wrap: balance; margin: 0; }
h1 { font-size: var(--step-3); letter-spacing: -0.01em; }
h2 { font-size: var(--step-2); }
h3 { font-size: var(--step-1); }
p { margin: 0; }
.lead { font-size: var(--step-1); }
.muted { color: var(--ink-soft); }
.hint { font-size: var(--step--1); color: var(--ink-soft); }
.eyebrow { font-size: 0.8rem; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 700; color: var(--sage); }
.stack { display: grid; gap: 1rem; }
.stack-sm { display: grid; gap: 0.5rem; }
.stack-lg { display: grid; gap: 1.75rem; }
.stack > *, .stack-sm > *, .stack-lg > * { min-width: 0; }

/* ---------- Üst bölüm ve gezinme ---------- */
.topbar { padding-inline: var(--gutter); padding-block: 0.6rem 0; }
.topbar__inner, .tabs__list { max-width: var(--page-wide); margin-inline: auto; }
.topbar__inner { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 0.5rem 0.75rem; }
.brand { flex: 1 1 11rem; min-width: 0; min-height: 2.75rem; display: grid; align-content: center; color: inherit; text-decoration: none; padding-block: 0.2rem; }
.brand__studio { font-size: 0.72rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--sage); font-weight: 700; }
.brand__title { font-family: var(--font-display); font-weight: 600; font-size: 1rem; line-height: 1.25; }
.settings-btn {
  flex: 0 1 auto; max-width: 100%; min-width: 0; overflow-wrap: anywhere; text-align: left; min-height: 2.75rem; padding: 0.35rem 0.85rem 0.35rem 0.6rem;
  display: inline-flex; align-items: center; gap: 0.4rem;
  border: 1.5px solid var(--line-strong); background: var(--paper); border-radius: 999px; cursor: pointer; font-weight: 600; font-size: 0.95rem;
}
.topbar__actions { display: flex; flex-wrap: wrap; gap: 0.4rem; min-width: 0; max-width: 100%; }
.lang-top { padding-inline: 0.6rem 0.75rem; letter-spacing: 0.04em; }
.settings-btn svg { flex: none; width: 1.25rem; height: 1.25rem; stroke: var(--ink); fill: none; stroke-width: 1.8; stroke-linecap: round; }

.tabs { padding-inline: var(--gutter); border-bottom: 1px solid var(--line); }
.tabs__list { list-style: none; margin-block: 0; padding: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); }
.tab {
  width: 100%; min-height: var(--tap); padding: 0.55rem 0.25rem 0.5rem;
  border: 0; background: transparent; cursor: pointer;
  font-weight: 600; font-size: 1rem; line-height: 1.2; color: var(--ink-soft);
  border-bottom: 3px solid transparent; margin-bottom: -1px;
}
.tab[aria-current="page"] { color: var(--ink); border-bottom-color: var(--sage); }

/* ---------- Sayfa ---------- */
main { padding-inline: var(--gutter); padding-block: 1.5rem 4rem; }
main:focus { outline: none; }
.view { max-width: var(--page); margin-inline: auto; }
.view.is-wide { max-width: var(--page-wide); }
.view.is-entering { animation: view-in var(--dur) var(--ease); }
@keyframes view-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

.page-head { display: grid; gap: 0.35rem; }
.crumb {
  display: inline-flex; align-items: center; gap: 0.35rem; justify-self: start;
  min-height: var(--tap); padding: 0.25rem 0.5rem 0.25rem 0.25rem; margin-left: -0.25rem;
  border: 0; background: none; cursor: pointer; color: var(--sage-deep); font-weight: 600;
}
.crumb svg { width: 1.1rem; height: 1.1rem; stroke: currentColor; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- Düğmeler ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem;
  min-height: var(--tap); padding: 0.7rem 1.2rem;
  border-radius: 999px; border: 1.5px solid transparent;
  font-weight: 650; font-size: 1rem; line-height: 1.25; text-align: center; text-decoration: none; cursor: pointer;
  transition: background-color var(--dur) var(--ease), transform var(--dur) var(--ease);
}
.btn:active { transform: scale(0.98); }
.btn--primary { background: var(--accent); color: var(--on-accent); }
.btn--secondary { background: var(--paper); color: var(--ink); border-color: var(--sage); }
.btn--quiet {
  background: transparent; color: var(--sage-deep); padding-inline: 0.25rem; min-height: 2.75rem;
  text-decoration: underline; text-underline-offset: 3px; justify-content: flex-start; text-align: left;
}
.btn--danger { background: var(--danger-solid); color: var(--on-accent); }
.btn--danger-outline { background: var(--paper); color: var(--danger); border-color: var(--danger); }
.btn--block { width: 100%; }
.btn-row { display: flex; flex-wrap: wrap; gap: 0.6rem; }
.btn-row > .btn { flex: 1 1 11rem; }

/* ---------- Form ---------- */
.field { display: grid; gap: 0.3rem; min-width: 0; }
.field > label, .label { font-weight: 650; font-size: 1rem; }
.input, .textarea {
  width: 100%; min-height: var(--tap);
  border: 1.5px solid var(--field-border); border-radius: 10px; background: var(--field);
  padding: 0.65rem 0.75rem; font-size: 1.0625rem; line-height: 1.45; /* 16px üstü: iOS yakınlaştırmasını önler */
}
.textarea { resize: vertical; min-height: 6rem; }
.input:focus, .textarea:focus { border-color: var(--sage); outline: 3px solid var(--sage-soft); outline-offset: 0; }
.input:focus-visible, .textarea:focus-visible { outline: 3px solid var(--focus); outline-offset: 1px; }
.input::placeholder, .textarea::placeholder { color: var(--placeholder); opacity: 1; }
.input[aria-invalid="true"], .textarea[aria-invalid="true"] { border-color: var(--danger); }
.field-error { color: var(--danger); font-weight: 600; font-size: 0.95rem; }

.check {
  position: relative; width: var(--tap); height: var(--tap); flex: none;
  display: grid; place-items: center; cursor: pointer;
}
.check input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
.check__box {
  width: 1.75rem; height: 1.75rem; border-radius: 8px; border: 2px solid var(--sage);
  display: grid; place-items: center; background: var(--field);
  transition: background-color var(--dur) var(--ease), border-color var(--dur) var(--ease);
}
.check__box svg { width: 1.1rem; height: 1.1rem; stroke: var(--on-accent); fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; opacity: 0; }
.check input:checked + .check__box { background: var(--accent-mark); border-color: var(--accent-mark); }
.check input:checked + .check__box svg { opacity: 1; }
.check input:focus-visible + .check__box { outline: 3px solid var(--focus); outline-offset: 2px; }
.check.is-pop .check__box { animation: pop 300ms var(--ease); }
@keyframes pop { 0% { transform: scale(1); } 45% { transform: scale(1.16); } 100% { transform: scale(1); } }

.task { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 0.5rem; align-items: end; }
.task.is-done .input { text-decoration: line-through; text-decoration-color: var(--accent-mark); color: var(--ink-soft); }

/* Seçenek grupları (radyo düğmeleri): zaman seçimi, alışkanlık durumu, yazı boyutu, animasyon */
.choices { border: 0; margin: 0; padding: 0; display: grid; gap: 0.5rem; min-width: 0; }
.choices legend { padding: 0; margin-bottom: 0.4rem; font-weight: 650; }
.choices--row { grid-template-columns: repeat(auto-fit, minmax(min(9rem, 100%), 1fr)); }
.choices--seg { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0.35rem; }
/* Zaman seçimi: üç süre yan yana, "Kendim belirleyeceğim" tam satır (uzun kelime bölünmesin) */
.choices--time { grid-template-columns: repeat(auto-fit, minmax(min(100%, 6.2em), 1fr)); }
.choices--time .choice:last-of-type { grid-column: 1 / -1; }
.choices--time .choice span { padding-inline: 0.6rem; gap: 0.45rem; }
.choice { position: relative; display: block; }
.choice input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.choice span {
  display: flex; align-items: center; gap: 0.6rem; min-height: var(--tap);
  padding: 0.55rem 0.8rem; border: 1.5px solid var(--field-border); border-radius: 12px; background: var(--paper);
  font-weight: 600; line-height: 1.3; cursor: pointer;
  transition: background-color var(--dur) var(--ease), border-color var(--dur) var(--ease);
}
.choices--seg .choice span { justify-content: center; text-align: center; padding-inline: 0.35rem; font-size: 0.95rem; }
.choice input:checked + span { background: var(--sage-soft); border-color: var(--sage); }
.choice input:focus-visible + span { outline: 3px solid var(--focus); outline-offset: 2px; }
.choice .mark { flex: none; width: 1.1rem; height: 1.1rem; border-radius: 50%; border: 2px solid var(--sage); background: var(--field); }
.choice input:checked + span .mark { background: var(--sage-deep); box-shadow: inset 0 0 0 3px var(--field); }

/* ---------- Kutular: yalnızca uygulama, araştırma ve önemli eylem alanları ---------- */
.box { border-radius: var(--radius); padding: 1.1rem; display: grid; gap: 0.75rem; }
.box > * { min-width: 0; }
.box--action { background: var(--paper); border: 1.5px solid var(--line-strong); }
.box--exercise { background: var(--paper); border: 1.5px solid var(--sage); }
.box--research { background: var(--sage-wash); }
.box--note { background: var(--accent-soft); }
.box--error { background: var(--danger-soft); color: var(--danger-ink); }
.box__label { font-size: 0.8rem; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 700; color: var(--sage-deep); }

/* Açılır bölümler: kart değil, çizgiyle ayrılmış satırlar */
.disclosures { display: grid; border-top: 1px solid var(--line); }
.disclosure { border-bottom: 1px solid var(--line); }
.disclosure > summary {
  list-style: none; cursor: pointer;
  display: flex; align-items: center; gap: 0.75rem; min-height: 3.25rem; padding-block: 0.6rem;
  font-weight: 650; font-size: 1.05rem;
}
.disclosure > summary::-webkit-details-marker { display: none; }
.disclosure > summary .chev {
  flex: none; width: 1.75rem; height: 1.75rem; border-radius: 50%; display: grid; place-items: center; background: var(--sage-wash);
  transition: transform var(--dur) var(--ease);
}
.disclosure > summary .chev svg { width: 0.95rem; height: 0.95rem; stroke: var(--sage-deep); fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.disclosure[open] > summary .chev { transform: rotate(90deg); }
.disclosure > summary .sum-text { flex: 1; min-width: 0; }
.disclosure > summary .pill { flex: none; }
.disclosure__body { display: grid; gap: 1rem; padding-block: 0.25rem 1.25rem; }
.disclosure[open] > .disclosure__body { animation: reveal var(--dur) var(--ease); }
@keyframes reveal { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }

.pill {
  display: inline-block; font-size: 0.8rem; font-weight: 650; padding: 0.15rem 0.55rem; border-radius: 999px;
  background: var(--sage-wash); color: var(--sage-deep); line-height: 1.4;
}
.banner { border-radius: 12px; padding: 0.85rem 1rem; display: grid; gap: 0.6rem; background: var(--sage-wash); }
.banner--warn { background: var(--accent-soft); }
.banner .btn { justify-self: start; }

.save-status { min-height: 1.5rem; font-size: 0.95rem; color: var(--sage-deep); font-weight: 600; }
.save-status.is-error { min-height: 0; }

/* ---------- Açılış ---------- */
.home { display: grid; gap: 1.75rem; align-items: start; }
.cover {
  position: relative; overflow: hidden;
  background: var(--cover-bg); color: var(--cover-ink);
  border-radius: 6px 18px 18px 6px;
  padding: 1.5rem 1.4rem 1.25rem 1.9rem;
  display: grid; gap: 0.75rem; max-width: 26rem; width: 100%;
  box-shadow: inset 6px 0 0 rgb(0 0 0 / 0.18), 0 10px 24px var(--shadow);
}
.cover__brand { font-size: 0.75rem; letter-spacing: 0.16em; text-transform: uppercase; font-weight: 700; color: var(--cover-muted); }
.cover__title { font-family: var(--font-display); font-size: clamp(1.75rem, 7vw, 2.4rem); line-height: 1.08; font-weight: 600; color: var(--cover-ink); }
.cover__subtitle { color: var(--cover-muted); font-size: 0.98rem; }
.cover__art svg { display: block; width: 100%; height: auto; }
.cv-scribble { stroke: var(--cover-muted); stroke-width: 3; stroke-linecap: round; fill: none; opacity: 0.75; }
.cv-path { stroke: var(--cover-muted); stroke-width: 2.5; stroke-dasharray: 2 7; stroke-linecap: round; fill: none; }
.cv-step { fill: var(--cover-muted); }
.cv-step--far { opacity: 0.5; }
.cv-dot { fill: var(--accent-mark); }
.cv-sun { fill: none; stroke: var(--accent-mark); stroke-width: 3; }
.home__text { display: grid; gap: 1.1rem; }
.home__desc { font-size: var(--step-1); }
.home__continue { border-top: 1px solid var(--line); padding-top: 1rem; display: grid; gap: 0.5rem; }
.note-line { display: flex; gap: 0.55rem; align-items: flex-start; font-size: var(--step--1); color: var(--ink-soft); }
.note-line svg { flex: none; width: 1.15rem; height: 1.15rem; margin-top: 0.15rem; stroke: var(--sage); fill: none; stroke-width: 1.8; }
.lang-btn { gap: 0.45rem; justify-self: start; font-weight: 600; }
.lang-btn svg { flex: none; width: 1.15rem; height: 1.15rem; stroke: currentColor; fill: none; stroke-width: 1.6; }
@media (min-width: 56rem) {
  .home { grid-template-columns: minmax(0, 24rem) minmax(0, 1fr); gap: 3rem; align-items: center; }
}

/* ---------- İçindekiler ---------- */
.toc { list-style: none; margin: 0; padding: 0; display: grid; border-top: 1px solid var(--line); }
.toc__item { display: grid; gap: 0.3rem; padding-block: 1rem; border-bottom: 1px solid var(--line); }
.toc__meta { font-size: var(--step--1); color: var(--ink-soft); display: flex; flex-wrap: wrap; gap: 0.15rem 0.75rem; }
.toc__title { font-family: var(--font-display); font-size: var(--step-1); font-weight: 600; line-height: 1.25; }
.toc__item.is-locked .toc__title { color: var(--ink-soft); }
.toc__item .btn { justify-self: start; margin-top: 0.35rem; }

/* ---------- Okuma ---------- */
.readbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10;
  margin-inline: calc(-1 * var(--gutter)); padding: 0.5rem var(--gutter);
  background: var(--cream); border-bottom: 1px solid var(--line);
}
.readbar__inner { max-width: var(--measure); margin-inline: auto; display: grid; grid-template-columns: minmax(0, 1fr); gap: 0.35rem; }
.readbar__inner > * { min-width: 0; }
.readbar__row { display: flex; justify-content: space-between; gap: 0.75rem; font-size: 0.88rem; }
.readbar__title { font-weight: 650; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.readbar__pct { flex: none; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.readbar__track { height: 4px; border-radius: 99px; background: var(--sage-soft); overflow: hidden; }
.readbar__fill { height: 100%; background: var(--sage); width: 0; transition: width var(--dur) linear; }
@media (max-height: 30rem) and (orientation: landscape) { .readbar { position: static; } }

.reader { max-width: var(--measure); margin-inline: auto; font-size: 1.125rem; line-height: 1.7; }
.reader[data-size="large"] { font-size: 1.3rem; }
.reader[data-size="larger"] { font-size: 1.5rem; }
.reader__head { display: grid; gap: 0.5rem; padding-block: 1.25rem 0.5rem; }
.reader__tools { display: grid; gap: 0.35rem; font-size: 1rem; line-height: 1.4; }
.part { display: grid; gap: 1.1rem; padding-block: 1.75rem 0.5rem; scroll-margin-top: 4.5rem; }
.part + .part { border-top: 1px solid var(--line); }
.part__label { font-size: 0.8rem; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 700; color: var(--ink-soft); line-height: 1.4; }
.reader h2 { font-size: 1.35em; }
.reader [data-block] { scroll-margin-top: 4.5rem; }
.scene { font-style: italic; display: grid; gap: 0.85rem; padding-left: 1rem; border-left: 3px solid var(--sage-soft); }
.suggestion { display: grid; gap: 0.35rem; padding-left: 1rem; border-left: 3px solid var(--accent-mark); }
.suggestion__label { font-size: 0.8rem; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 700; color: var(--accent-ink); line-height: 1.4; }
.reader .box { font-size: 0.92em; line-height: 1.6; }
.research__limits { color: var(--ink-soft); }
.research__limits strong { color: var(--ink); }
.more > summary { cursor: pointer; font-weight: 650; color: var(--sage-deep); min-height: 2.75rem; display: flex; align-items: center; gap: 0.5rem; list-style: none; }
.more > summary::-webkit-details-marker { display: none; }
.more > summary::before { content: "+"; display: grid; place-items: center; width: 1.4rem; height: 1.4rem; border-radius: 50%; background: var(--field); font-weight: 700; flex: none; }
.more[open] > summary::before { content: "−"; }
.more__body { display: grid; gap: 0.5rem; padding-bottom: 0.25rem; }
.cite { font-size: 0.9em; color: var(--ink-soft); }
.cite a, .sources a { color: var(--sage-deep); overflow-wrap: anywhere; display: inline-flex; align-items: center; min-height: 2.75rem; }
.figure { margin: 0; display: grid; gap: 0.6rem; }
.figure__art { background: var(--paper); border-radius: var(--radius); padding: 1rem; border: 1px solid var(--line); }
.figure__art svg { display: block; width: 100%; height: auto; }
.figure figcaption { font-size: 0.85em; color: var(--ink-soft); }
.exercise ol { margin: 0; padding-left: 1.3rem; display: grid; gap: 0.45rem; }
.timer { display: grid; gap: 0.5rem; }
.timer__bar { height: 6px; border-radius: 99px; background: var(--sage-soft); overflow: hidden; }
.timer__fill { height: 100%; width: 100%; background: var(--sage); transform-origin: left; transform: scaleX(0); }
.timer__status { font-variant-numeric: tabular-nums; color: var(--ink-soft); font-size: 0.9em; min-height: 1.2em; }
.summary { font-family: var(--font-display); font-size: 1.15em; line-height: 1.45; border-top: 2px solid var(--ink); padding-top: 1rem; display: grid; gap: 0.35rem; }
.summary .eyebrow { font-family: var(--font-text); font-size: 0.75rem; }
.sources { font-size: 0.9rem; line-height: 1.5; color: var(--ink-soft); }
.sources ol { margin: 0; padding-left: 1.2rem; display: grid; gap: 0.6rem; }
.chapter-end { display: grid; gap: 0.75rem; padding-top: 1.75rem; font-size: 1rem; line-height: 1.5; }

/* ---------- Günüm ---------- */
.day-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: end; gap: 0.5rem 1rem; }
.day-head .btn--quiet { font-weight: 650; }
.date-line { font-size: var(--step--1); color: var(--ink-soft); font-weight: 650; }
.start-out { display: grid; gap: 0.35rem; background: var(--sage-wash); border-radius: 10px; padding: 0.8rem 0.9rem; }
.start-out dl { margin: 0; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 0.2rem 0.75rem; }
.start-out dt { font-weight: 650; color: var(--ink-soft); }
.start-out dd { margin: 0; }
.legacy { display: grid; gap: 0.6rem; }
.legacy blockquote { margin: 0; padding: 0.6rem 0.8rem; background: var(--field); border-radius: 8px; border: 1px solid var(--line); }

/* ---------- Geçmiş ---------- */
.days { list-style: none; margin: 0; padding: 0; display: grid; border-top: 1px solid var(--line); }
.days > li { border-bottom: 1px solid var(--line); }
.day-sum { display: grid; gap: 0.2rem; }
.day-sum__date { font-weight: 700; display: flex; flex-wrap: wrap; gap: 0.25rem 0.5rem; align-items: center; }
.day-sum__main { font-weight: 500; }
.day-sum__evening { font-size: var(--step--1); color: var(--ink-soft); }
.day-detail { margin: 0; display: grid; gap: 0.6rem; }
.day-detail dt { font-weight: 650; font-size: 0.9rem; color: var(--ink-soft); }
.day-detail dd { margin: 0; white-space: pre-wrap; }

/* ---------- Alışkanlık ---------- */
.habit-grid { display: grid; gap: 1.75rem; align-items: start; }
@media (min-width: 56rem) { .habit-grid { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 2.5rem; } }
.illus { color: var(--sage); }
.illus svg { display: block; width: 100%; max-width: 22rem; height: auto; }
.il-loop { stroke: var(--sage); stroke-width: 2.5; stroke-dasharray: 3 6; stroke-linecap: round; fill: none; }
.il-node { fill: var(--sage-wash); stroke: var(--sage); stroke-width: 2; }
.il-node--main { fill: var(--field); }
.il-clock { fill: var(--field); stroke: var(--ink); stroke-width: 2; }
.il-clock-hand { stroke: var(--ink); stroke-width: 2.4; stroke-linecap: round; fill: none; }
.wizard__progress { display: flex; gap: 0.3rem; }
.wizard__progress span { flex: 1; height: 4px; border-radius: 99px; background: var(--sage-soft); }
.wizard__progress span.is-on { background: var(--sage); }
.plan-sum { margin: 0; display: grid; gap: 0.5rem; }
.plan-sum div { display: grid; gap: 0.05rem; }
.plan-sum dt { font-size: 0.85rem; font-weight: 650; color: var(--ink-soft); }
.plan-sum dd { margin: 0; }
.plan-sentence { font-family: var(--font-display); font-size: 1.2rem; line-height: 1.4; }

.week-wrap { container-type: inline-size; }
.week { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 0.25rem; }
/* Dar ekranda (ör. 320px) yedi hücre 44px dokunma alanına sığmaz: iki satıra (4 + 3) geçer */
@container (max-width: 340px) { .week { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.week button {
  width: 100%; min-height: 4.5rem; padding: 0.35rem 0.1rem; border: 1.5px solid transparent; border-radius: 10px; background: transparent; cursor: pointer;
  display: grid; justify-items: center; gap: 0.25rem; font-size: 0.8rem; line-height: 1.15; color: var(--ink-soft);
}
.week button[aria-pressed="true"] { border-color: var(--sage); background: var(--paper); color: var(--ink); }
.week .wd { font-weight: 650; }
.dot { width: 1.4rem; height: 1.4rem; border-radius: 50%; display: block; flex: none; }
.dot--done { background: var(--sage); }
.dot--smaller { background: linear-gradient(90deg, var(--sage) 50%, var(--sage-soft) 50%); border: 2px solid var(--sage); }
.dot--skipped { background: var(--paper); border: 2px solid var(--line-strong); }
.dot--none { border: 2px dotted var(--line-strong); }
.dot--older { box-shadow: 0 0 0 2px var(--cream), 0 0 0 3.5px var(--ink-soft); }
.legend { display: flex; flex-wrap: wrap; gap: 0.4rem 1rem; font-size: 0.85rem; color: var(--ink-soft); margin: 0; padding: 0; list-style: none; }
.legend li { display: inline-flex; align-items: center; gap: 0.4rem; }
.legend .dot { width: 1rem; height: 1rem; }

/* ---------- Ayarlar ve onay pencereleri ---------- */
dialog {
  border: 0; padding: 0; background: var(--cream); color: var(--ink);
  width: min(36rem, calc(100vw - 1.5rem)); max-height: calc(100dvh - 1.5rem);
  border-radius: 18px; box-shadow: 0 20px 60px var(--shadow-strong);
}
dialog::backdrop { background: var(--backdrop); }
dialog[open] { animation: dialog-in var(--dur) var(--ease); }
@keyframes dialog-in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
.dialog__body { padding: 1.25rem; display: grid; gap: 1.25rem; overflow-y: auto; max-height: calc(100dvh - 1.5rem); }
.dialog__body > * { min-width: 0; }
.dialog__head { display: flex; justify-content: space-between; align-items: center; gap: 0.75rem; flex-wrap: wrap; }
.panel-section { display: grid; gap: 0.6rem; padding-top: 1.1rem; border-top: 1px solid var(--line); }
.panel-section > * { min-width: 0; }
.panel-section ul { margin: 0; padding-left: 1.2rem; display: grid; gap: 0.35rem; }
.file-pick { position: relative; overflow: hidden; }
.file-pick input[type="file"] { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer; font-size: 0; }
.file-pick:has(input:focus-visible) { outline: 3px solid var(--focus); outline-offset: 2px; }
.code-out { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 0.85rem; min-height: 8rem; }
.change-list { margin: 0; padding-left: 1.2rem; display: grid; gap: 0.3rem; font-size: 0.95rem; }

.toast-region {
  position: fixed; left: 0; right: 0; bottom: calc(1rem + env(safe-area-inset-bottom, 0px)); z-index: 60;
  display: grid; justify-items: center; pointer-events: none; padding-inline: 1rem;
}
.toast { background: var(--ink); color: var(--cream); border-radius: 12px; padding: 0.6rem 1rem; max-width: 30rem; font-size: 0.95rem; }

/* ---------- Görsel sınıfları (kitap SVG'leri) ---------- */
.il-soft { fill: var(--sage-wash); }
.il-line { stroke: var(--sage); stroke-width: 5; stroke-linecap: round; fill: none; opacity: 0.55; }
.il-arrow { stroke: var(--accent-mark); stroke-width: 3.5; stroke-linecap: round; fill: none; }
.il-arrow-head { stroke: var(--accent-mark); stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; fill: none; }
.il-step { fill: var(--sage); }
.il-step--far { opacity: 0.45; }
.il-dot { fill: var(--accent-mark); }
.il-ground { stroke: var(--ink); stroke-width: 2; stroke-linecap: round; opacity: 0.25; }
.il-scribble { stroke: var(--ink); stroke-width: 3; stroke-linecap: round; fill: none; opacity: 0.7; }
.il-ring { stroke: var(--sage-deep); stroke-width: 2.5; fill: none; }
.il-paper { fill: var(--field); stroke: var(--ink); stroke-width: 2; }
.il-rule { stroke: var(--sage); stroke-width: 4; stroke-linecap: round; fill: none; }
.il-box { fill: none; stroke: var(--sage-deep); stroke-width: 2; }
.il-check { stroke: var(--accent-mark); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; fill: none; }

/* ---------- Hareket: cihaz tercihi ve uygulama içi ayar ---------- */
@media (prefers-reduced-motion: reduce) {
  :root:not([data-motion="on"]) { --dur: 0ms; }
  :root:not([data-motion="on"]) *, :root:not([data-motion="on"]) *::before, :root:not([data-motion="on"]) *::after {
    animation: none !important; transition: none !important; scroll-behavior: auto !important;
  }
}
:root[data-motion="off"] { --dur: 0ms; }
:root[data-motion="off"] *, :root[data-motion="off"] *::before, :root[data-motion="off"] *::after {
  animation: none !important; transition: none !important; scroll-behavior: auto !important;
}

/* ---------- Başlangıç ekranı ve açılış hataları (JavaScript gerektirmez) ---------- */
.is-booting .tabs, .is-booting .topbar__actions,
.is-failed .tabs, .is-failed .topbar__actions { display: none; }
.boot-screen { display: grid; gap: 1rem; max-width: var(--measure); padding-block: 1rem 2rem; }
.boot-screen > * { min-width: 0; }
.boot-status { display: flex; align-items: center; gap: 0.6rem; font-weight: 600; color: var(--sage-deep); }
.boot-dot { width: 0.7rem; height: 0.7rem; border-radius: 50%; background: var(--accent-mark); flex: none; }
.boot-noscript { background: var(--accent-soft); border-radius: var(--radius); padding: 1rem 1.1rem; font-weight: 600; }
.boot-screen--error .btn { justify-self: start; }
.boot-details { display: grid; gap: 0.6rem; }
.boot-details > summary { cursor: pointer; font-weight: 650; color: var(--sage-deep); min-height: 2.75rem; display: flex; align-items: center; }
.boot-details .btn { justify-self: start; }

/* dialog.showModal desteklenmeyen tarayıcılar için yedek görünüm */
dialog.is-fallback[open] {
  position: fixed; inset: 0; margin: auto; z-index: 100; height: fit-content;
  box-shadow: 0 0 0 100vmax var(--backdrop), 0 20px 60px var(--shadow-strong);
}

/* ---------- Aylık takvim (Günüm'ün üstünde) ---------- */
.icon-btn {
  flex: none; width: var(--tap); height: var(--tap); display: inline-grid; place-items: center;
  border: 1.5px solid var(--field-border); border-radius: 50%; background: var(--paper); color: var(--ink); cursor: pointer;
}
.icon-btn svg { width: 1.2rem; height: 1.2rem; stroke: currentColor; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.cal-wrap { container: calwrap / inline-size; display: grid; gap: 1rem; border-bottom: 1px solid var(--line); padding-bottom: 0.25rem; }
/* Geniş ekran: takvim alanı günlük plan sütunundan taşarak ortalanır; takvim ve gün özeti yan yana durur */
@media (min-width: 60rem) {
  .cal-wrap { --calw: min(var(--page-wide), calc(100vw - 2 * var(--gutter) - 2rem)); width: var(--calw); margin-inline: calc((100% - var(--calw)) / 2); }
}
.cal-toggle {
  display: flex; align-items: center; gap: 0.75rem; width: 100%; min-height: 3.25rem; padding: 0.4rem 0;
  border: 0; border-top: 1px solid var(--line); background: transparent; color: var(--ink); text-align: left; cursor: pointer;
}
.cal-toggle .chev { flex: none; width: 1.75rem; height: 1.75rem; border-radius: 50%; display: grid; place-items: center; background: var(--sage-wash); transition: transform var(--dur) var(--ease); }
.cal-toggle .chev svg { width: 0.95rem; height: 0.95rem; stroke: var(--sage-deep); fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.cal-toggle[aria-expanded="true"] .chev { transform: rotate(90deg); }
.cal-toggle__text { display: grid; gap: 0.05rem; font-size: 1.05rem; }
.cal-panel { container: calpanel / inline-size; display: grid; gap: 1.25rem; padding-bottom: 1rem; }
.cal-panel > * { min-width: 0; }
@container calwrap (min-width: 600px) {
  .cal-panel { grid-template-columns: minmax(0, 24rem) minmax(0, 1fr); align-items: start; column-gap: 2rem; }
}
.cal { display: grid; gap: 0.6rem; }
.cal > * { min-width: 0; }
.cal__head { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 0.5rem; }
.cal__title { text-align: center; font-size: var(--step-1); }
.cal > .btn--quiet { justify-self: center; }
.cal__grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 3px; }
/* 320 px gibi dar ekranlarda takvim kenar boşluğunu kullanır: her gün düğmesi ≥ 44 px kalır */
@container calpanel (max-width: 330px) {
  .cal__grid { margin-inline: calc(var(--gutter) * -1 + 2px); gap: 1px; }
}
.cal__wd { text-align: center; font-size: 0.78rem; font-weight: 650; color: var(--ink-soft); padding-block: 0.2rem; }
.cal__blank { min-height: 3.25rem; }
.cal__day {
  min-width: 0; min-height: 3.25rem; padding: 0.3rem 0 0.25rem;
  display: grid; grid-template-rows: auto auto; align-content: start; justify-items: center; gap: 0.15rem;
  border: 2px solid transparent; border-radius: 10px; background: var(--paper); color: var(--ink); cursor: pointer;
  font-variant-numeric: tabular-nums;
}
.cal__num { font-weight: 650; font-size: 1rem; line-height: 1.15; }
.cal__marks { display: flex; align-items: center; justify-content: center; gap: 3px; min-height: 0.85rem; }
/* Bugün: belirgin çerçeve. Seçili gün: dolgu + alt çizgi (bugünden farklı işaret). */
.cal__day.is-today { border-color: var(--ink); }
.cal__day[aria-pressed="true"] { background: var(--sage-soft); box-shadow: inset 0 -4px 0 var(--sage-deep); }
.mk { display: inline-block; flex: none; }
.mk-plan { width: 0.5rem; height: 0.5rem; border-radius: 2px; background: var(--sage); }
.mk-habit { width: 0.55rem; height: 0.55rem; border-radius: 50%; border: 2px solid var(--accent-mark); }
.mk-rating { font-size: 0.75rem; font-weight: 750; line-height: 1; color: var(--ink-soft); }
.cal__legend { display: grid; gap: 0.4rem; }
.cal__legend .legend { gap: 0.35rem 1rem; }
.lg { display: inline-block; width: 1.1rem; height: 1.1rem; border-radius: 4px; background: var(--paper); flex: none; }
.lg-today { border: 2px solid var(--ink); }
.lg-selected { background: var(--sage-soft); box-shadow: inset 0 -3px 0 var(--sage-deep); }
.cal-summary h3 { font-family: var(--font-text); font-size: 1.05rem; font-weight: 700; }
.cal-summary .btn { justify-self: start; }

/* Dar ekranda sekme adları tek satırda kalsın ("Alışkanlığım" bölünmesin) */
@media (max-width: 360px) {
  .tabs { padding-inline: 0.25rem; }
  .tab { font-size: 0.875rem; padding-inline: 0.1rem; }
}

</style>
<!-- @artifact-head-end -->
</head>
<body>
<!-- @artifact-body-start -->
<!-- data-t ile işaretli metinler derleme sırasında i18n/en.js'ten doldurulur (data-t-lang varsa o dilden); JavaScript çalışmasa da görünürler.
     Kayıtlı dil tercihi başkaysa boot.js bu metinleri hemen o dile çevirir. -->
<div id="app-root" class="is-booting">
<a class="skip" href="#main" data-t="app.skipToContent">Skip to content</a>

<header class="topbar">
  <div class="topbar__inner">

      <span class="brand__title" data-t="app.title">Small Steps, Clear Days</span>
    </a>
    <div class="topbar__actions">

      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3z"/></svg>
      <span id="lang-code">EN</span>
    </button>
    <button type="button" class="settings-btn" id="open-settings" aria-haspopup="dialog">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2.8v2.4M12 18.8v2.4M4.6 4.6l1.7 1.7M17.7 17.7l1.7 1.7M2.8 12h2.4M18.8 12h2.4M4.6 19.4l1.7-1.7M17.7 6.3l1.7-1.7"/></svg>
      <span data-t="app.settingsButton">Settings</span>
    </button>
    </div>

<nav class="tabs" data-t-label="nav.label" aria-label="Main sections">
  <ul class="tabs__list">
    <li><button type="button" class="tab" data-nav="oku" data-t="nav.read">Read</button></li>
    <li><button type="button" class="tab" data-nav="gunum" data-t="nav.day">My Day</button></li>
    <li><button type="button" class="tab" data-nav="aliskanlik" data-t="nav.habit">My Habit</button></li>
  </ul>
</nav>

<main id="main" tabindex="-1">
  <div id="view" class="view">
    <!-- Başlangıç ekranı: JavaScript gerektirmez. Uygulama başlayınca yerine uygulama ekranı gelir. -->
    <section class="boot-screen" id="boot-screen" aria-labelledby="boot-title">
      <p class="eyebrow" data-t="app.brand">Genix Studio</p>

<script>
/*
 * Veri katmanı: günlük kayıtlar, alışkanlık planı, tercihler, yedek alma ve geri yükleme.

 * Şema geçmişi
 *   1 – Yalnızca günlük kayıtlar (gx.ssc.days.v1) ve tercihler (gx.ssc.settings.v1).
 *   2 – Günlük kayda isteğe bağlı zaman seçimi (time) eklendi; alışkanlık verisi (gx.ssc.habit.v1) eklendi;

 *   3 – Günlük kayda gün değerlendirmesi eklendi: rating (null ya da 1–5 tam sayı) ve ratingNote (metin).

 *

 *

 * varsayılan değer atanır (migrateDay). Eski "start.what" metni silinmez; arayüz bu metni gösterir ve
 * kullanıcıya ilk küçük adımla eşitleme seçeneği sunar. Hiçbir eski veri otomatik olarak silinmez.
 *

 */
(function (root) {

  var APP_ID = "genix-small-steps-clear-days";
  var SCHEMA_VERSION = 3;

  var SETTINGS_KEY = "gx.ssc.settings.v1";
  var HABIT_KEY = "gx.ssc.habit.v1";
  var META_KEY = "gx.ssc.meta";
  var SNAPSHOT_KEY = "gx.ssc.beforeRestore";

  var MAX_IMPORT_BYTES = 2 * 1024 * 1024;
  var MAX_TEXT = 4000;
  var MAX_BRAIN = 10000;

  var TIME_BUDGETS = ["", "5", "15", "30", "custom"];
  var HABIT_STATUSES = ["done", "smaller", "skipped"];
  var TEXT_SIZES = ["standard", "large", "larger"];
  var THEMES = ["system", "light", "dark"];
  // Eski yedeklerde bulunmayabilen gün alanları: yoksa geri yüklemede mevcut değer korunur
  var OPTIONAL_DAY_FIELDS = ["time", "rating", "ratingNote"];
  var MOTION_MODES = ["system", "on", "off"];

  var DATE_RE = /^(\d{4})-(\d{2})-(\d{2})$/;
  var ID_RE = /^[a-z0-9_-]{1,40}$/i;

  function pad(n) {
    return (n < 10 ? "0" : "") + n;
  }

  /** Yerel saate göre tarih anahtarı. toISOString() UTC kullandığı için gece yarısı yanlış güne yazabilir. */
  function dateKey(d) {
    d = d || new Date();
    return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
  }

  function isValidDateKey(key) {
    var m = DATE_RE.exec(key);
    if (!m) return false;
    var y = +m[1], mo = +m[2], da = +m[3];
    if (y < 2000 || y > 2100) return false;
    var d = new Date(y, mo - 1, da);
    return d.getFullYear() === y && d.getMonth() === mo - 1 && d.getDate() === da;
  }

  function keyToDate(key) {
    var m = DATE_RE.exec(key);
    return new Date(+m[1], +m[2] - 1, +m[3]);
  }

  function addDays(key, n) {
    var d = keyToDate(key);
    d.setDate(d.getDate() + n);
    return dateKey(d);
  }

  function newId() {
    return "p" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  }

  /* ---------------- Günlük kayıt ---------------- */

  function emptyDay() {
    return {
      brain: "",
      main: { text: "", step: "", done: false },
      extras: [
        { text: "", done: false },
        { text: "", done: false },
      ],
      start: { when: "", where: "", what: "" }, // what: şema 1'den kalan alan, yalnızca eski kayıtlarda dolu olabilir
      time: { budget: "", custom: "" },
      evening: { worked: "", easier: "" },
      rating: null, // gün değerlendirmesi: null ya da 1–5; varsayılan seçim yok
      ratingNote: "",
      updatedAt: null,
    };
  }

  function isDayEmpty(day) {
    if (!day) return true;
    var texts = [
      day.brain, day.main.text, day.main.step,
      day.extras[0].text, day.extras[1].text,
      day.start.when, day.start.where, day.start.what,
      day.time.budget, day.time.custom,
      day.evening.worked, day.evening.easier, day.ratingNote,
    ];
    if (day.rating !== null && day.rating !== undefined) return false; // yalnızca puan girilmiş gün de geçerli kayıttır
    for (var i = 0; i < texts.length; i++) if (texts[i] && String(texts[i]).trim()) return false;

  }

  /** İçerik karşılaştırması (güncellenme zamanı hariç): geri yüklemede "aynı" ile "değişecek"i ayırmak için. */
  function sameDay(a, b) {
    var x = JSON.parse(JSON.stringify(a)), y = JSON.parse(JSON.stringify(b));
    x.updatedAt = y.updatedAt = null;
    return JSON.stringify(x) === JSON.stringify(y);
  }

  /* ---------------- Doğrulama yardımcıları ---------------- */

  function ValidationError(code, params) {
    this.code = code;
    this.params = params || {};
  }

  function checkObject(v, key, field) {
    if (!v || typeof v !== "object" || Array.isArray(v)) throw new ValidationError("badField", { key: key, field: field });
    return v;
  }
  function optObject(v, key, field) {
    return v === undefined || v === null ? {} : checkObject(v, key, field);
  }
  function checkText(v, key, field, max) {
    if (v === undefined || v === null) return "";
    if (typeof v !== "string" || v.length > (max || MAX_TEXT)) throw new ValidationError("badField", { key: key, field: field });
    return v;
  }
  function checkBool(v, key, field) {
    if (v === undefined || v === null) return false;
    if (typeof v !== "boolean") throw new ValidationError("badField", { key: key, field: field });
    return v;
  }
  function checkEnum(v, list, key, field) {
    if (v === undefined || v === null) return list[0];
    if (list.indexOf(v) < 0) throw new ValidationError("badField", { key: key, field: field });
    return v;
  }
  function checkStamp(v, key, field) {
    if (v === undefined || v === null) return null;
    if (typeof v !== "string" || v.length > 40) throw new ValidationError("badField", { key: key, field: field });
    return v;
  }

  /**
   * Bir günü doğrular ve şema 2 biçimine getirir (geçiş burada yapılır).
   * Bilinmeyen alanlar atılır; tür hatasında ValidationError fırlatır.
   */
  function migrateDay(raw, key) {
    checkObject(raw, key, "gün");
    var main = optObject(raw.main, key, "main");
    var start = optObject(raw.start, key, "start");
    var time = optObject(raw.time, key, "time"); // şema 1'de yok → boş
    var evening = optObject(raw.evening, key, "evening");
    var extras = raw.extras === undefined ? [] : raw.extras;
    if (!Array.isArray(extras) || extras.length > 2) throw new ValidationError("badField", { key: key, field: "extras" });

    var day = emptyDay();
    day.brain = checkText(raw.brain, key, "brain", MAX_BRAIN);
    day.main.text = checkText(main.text, key, "main.text");
    day.main.step = checkText(main.step, key, "main.step");
    day.main.done = checkBool(main.done, key, "main.done");
    for (var i = 0; i < extras.length; i++) {
      var ex = checkObject(extras[i], key, "extras");
      day.extras[i].text = checkText(ex.text, key, "extras.text");
      day.extras[i].done = checkBool(ex.done, key, "extras.done");
    }
    day.start.when = checkText(start.when, key, "start.when");
    day.start.where = checkText(start.where, key, "start.where");
    day.start.what = checkText(start.what, key, "start.what");
    day.time.budget = checkEnum(time.budget === undefined ? "" : time.budget, TIME_BUDGETS, key, "time.budget");
    day.time.custom = checkText(time.custom, key, "time.custom", 40);
    day.evening.worked = checkText(evening.worked, key, "evening.worked");
    day.evening.easier = checkText(evening.easier, key, "evening.easier");
    if (raw.rating !== undefined && raw.rating !== null) {
      if (typeof raw.rating !== "number" || raw.rating % 1 !== 0 || raw.rating < 1 || raw.rating > 5) throw new ValidationError("badField", { key: key, field: "rating" });
      day.rating = raw.rating;
    }
    day.ratingNote = checkText(raw.ratingNote, key, "ratingNote", 2000);
    day.updatedAt = checkStamp(raw.updatedAt, key, "updatedAt");
    return day;
  }

  /** Ham kayıtta hiç bulunmayan isteğe bağlı alanlar (eski şema). Geri yüklemede bunlar mevcut veriyi ezmez. */
  function absentDayFields(raw) {
    var out = [];
    for (var i = 0; i < OPTIONAL_DAY_FIELDS.length; i++) {
      if (!raw || !Object.prototype.hasOwnProperty.call(raw, OPTIONAL_DAY_FIELDS[i])) out.push(OPTIONAL_DAY_FIELDS[i]);
    }
    return out;
  }

  /** Yedekteki günü, yedekte bulunmayan alanlar için mevcut değerle tamamlar. */
  function effectiveIncomingDay(current, incoming, absent) {
    if (!current || !absent || !absent.length) return incoming;
    var d = JSON.parse(JSON.stringify(incoming));
    absent.forEach(function (f) { d[f] = JSON.parse(JSON.stringify(current[f])); });
    return d;
  }

  /* ---------------- Alışkanlık ---------------- */

  var PLAN_FIELDS = ["goal", "start", "anchor", "place", "ease", "smaller"];

  function emptyHabit() {
    return { activePlanId: null, plans: {}, log: {}, reviews: {}, draft: null };
  }

  function emptyPlanFields() {
    return { goal: "", start: "", anchor: "", place: "", ease: "", smaller: "" };
  }

  function migratePlan(raw, id) {
    checkObject(raw, id, "plan");
    if (!ID_RE.test(id)) throw new ValidationError("badField", { key: id, field: "plan.id" });
    var p = { id: id };
    PLAN_FIELDS.forEach(function (f) { p[f] = checkText(raw[f], id, "plan." + f, 500); });
    if (!p.goal.trim()) throw new ValidationError("badField", { key: id, field: "plan.goal" });
    p.createdAt = checkStamp(raw.createdAt, id, "plan.createdAt");
    p.updatedAt = checkStamp(raw.updatedAt, id, "plan.updatedAt");
    p.archivedAt = checkStamp(raw.archivedAt, id, "plan.archivedAt");
    return p;
  }

  function migrateLogEntry(raw, key, plans) {
    checkObject(raw, key, "alışkanlık kaydı");
    var e = {
      status: checkEnum(raw.status, HABIT_STATUSES, key, "habit.status"),
      note: checkText(raw.note, key, "habit.note", 2000),
      planId: checkText(raw.planId, key, "habit.planId", 40),
      updatedAt: checkStamp(raw.updatedAt, key, "habit.updatedAt"),
    };

    if (!plans[e.planId]) throw new ValidationError("badField", { key: key, field: "habit.planId" });
    return e;
  }

  function migrateHabit(raw) {
    var h = emptyHabit();
    if (raw === undefined || raw === null) return h;
    checkObject(raw, "alışkanlık", "habit");
    var plans = optObject(raw.plans, "alışkanlık", "plans");
    Object.keys(plans).forEach(function (id) { h.plans[id] = migratePlan(plans[id], id); });
    var log = optObject(raw.log, "alışkanlık", "log");
    Object.keys(log).forEach(function (k) {
      if (!isValidDateKey(k)) throw new ValidationError("badDate", { key: k.slice(0, 40) });
      h.log[k] = migrateLogEntry(log[k], k, h.plans);
    });
    var reviews = optObject(raw.reviews, "alışkanlık", "reviews");
    Object.keys(reviews).forEach(function (id) {
      if (!h.plans[id]) throw new ValidationError("badField", { key: id, field: "reviews" });
      var r = checkObject(reviews[id], id, "reviews");
      h.reviews[id] = {

        context: checkText(r.context, id, "reviews.context", 2000),
        shrink: checkText(r.shrink, id, "reviews.shrink", 2000),
        updatedAt: checkStamp(r.updatedAt, id, "reviews.updatedAt"),
      };
    });
    if (raw.activePlanId !== undefined && raw.activePlanId !== null) {
      if (typeof raw.activePlanId !== "string" || !h.plans[raw.activePlanId]) throw new ValidationError("badField", { key: "alışkanlık", field: "activePlanId" });
      h.activePlanId = raw.activePlanId;

    if (raw.draft !== undefined && raw.draft !== null) {

      var draft = emptyPlanFields();
      PLAN_FIELDS.forEach(function (f) { draft[f] = checkText(d[f], "taslak", "draft." + f, 500); });
      draft.step = typeof d.step === "number" && d.step >= 0 && d.step < 10 ? Math.floor(d.step) : 0;
      draft.editingId = typeof d.editingId === "string" && h.plans[d.editingId] ? d.editingId : null;

  }

  function norm(s) {
    return String(s || "").trim().replace(/\s+/g, " ").toLocaleLowerCase("tr");
  }

  /**
   * Alışkanlık planını oluşturur ya da düzenler (yan etkisiz; yeni nesne döner).
   * Hedef (goal) değiştiyse ve eski planın kayıtları varsa: eski plan arşivlenir, yeni bir plan açılır.
   * Böylece geçmiş kayıtlar yeni hedefe aitmiş gibi görünmez.
   */
  function applyPlanEdit(habit, fields, editingId, nowIso) {
    var h = JSON.parse(JSON.stringify(habit));
    var now = nowIso || new Date().toISOString();
    var clean = emptyPlanFields();
    PLAN_FIELDS.forEach(function (f) { clean[f] = String(fields[f] || "").trim(); });
    var old = editingId ? h.plans[editingId] : null;

    if (old) {
      var hasLogs = Object.keys(h.log).some(function (k) { return h.log[k].planId === old.id; });
      if (norm(old.goal) !== norm(clean.goal) && hasLogs) {
        old.archivedAt = now;
        var id = newId();
        h.plans[id] = Object.assign({ id: id, createdAt: now, updatedAt: now, archivedAt: null }, clean);
        h.activePlanId = id;
        h.draft = null;
        return { habit: h, versioned: true, planId: id };
      }
      PLAN_FIELDS.forEach(function (f) { old[f] = clean[f]; });
      old.updatedAt = now;
      h.draft = null;
      return { habit: h, versioned: false, planId: old.id };
    }

    if (h.activePlanId && h.plans[h.activePlanId]) h.plans[h.activePlanId].archivedAt = now;
    var nid = newId();
    h.plans[nid] = Object.assign({ id: nid, createdAt: now, updatedAt: now, archivedAt: null }, clean);
    h.activePlanId = nid;
    h.draft = null;
    return { habit: h, versioned: false, planId: nid };
  }

  function isHabitEmpty(h) {
    return !h || (!Object.keys(h.plans).length && !Object.keys(h.log).length);
  }

  /* ---------------- Tercihler ---------------- */

  function migrateSettings(raw) {
    var s = raw && typeof raw === "object" && !Array.isArray(raw) ? raw : {};
    var out = {};
    if (MOTION_MODES.indexOf(s.motion) >= 0) out.motion = s.motion;
    if (TEXT_SIZES.indexOf(s.textSize) >= 0) out.textSize = s.textSize;
    if (THEMES.indexOf(s.theme) >= 0) out.theme = s.theme;
    if (s.calendarOpen === true) out.calendarOpen = true;
    if (s.welcomed === true) out.welcomed = true;
    if (typeof s.lang === "string" && /^[a-z]{2}$/.test(s.lang)) out.lang = s.lang; // arayüz dili: yalnızca bu cihazda, yedeğe girmez
    if (s.reading && typeof s.reading === "object" && typeof s.reading.chapterId === "string") {
      out.reading = { chapterId: s.reading.chapterId.slice(0, 40), blockId: typeof s.reading.blockId === "string" ? s.reading.blockId.slice(0, 40) : null };
    }
    if (typeof s.lastPlace === "string" && s.lastPlace.length < 60) out.lastPlace = s.lastPlace;
    return out;
  }

  /* ---------------- Yedek: ayrıştırma ve doğrulama (yan etkisiz) ---------------- */

  /**
   * Yedek metnini ayrıştırır. Sürüm 1 (yalnızca günler) ve sürüm 2 (günler + alışkanlık + tercihler) kabul edilir.
   * Başarılıysa { ok: true, version, days, habit|null, settings|null }, değilse { ok: false, code, params }.
   */
  function parseBackup(text) {
    try {
      if (typeof text !== "string") throw new ValidationError("notJson");
      if (text.length > MAX_IMPORT_BYTES) throw new ValidationError("tooLarge");

        data = JSON.parse(text.replace(/^﻿/, ""));
      } catch (e) {
        throw new ValidationError("notJson");
      }
      if (!data || typeof data !== "object" || Array.isArray(data)) throw new ValidationError("notJson");
      if (data.app !== APP_ID) throw new ValidationError("wrongApp");
      if (SUPPORTED_BACKUP_VERSIONS.indexOf(data.version) < 0) throw new ValidationError("wrongVersion");
      if (data.days === undefined && data.version === 2) data.days = {};
      if (!data.days || typeof data.days !== "object" || Array.isArray(data.days)) throw new ValidationError("badDays");

      var days = {};
      var absent = {};
      Object.keys(data.days).forEach(function (k) {
        if (!isValidDateKey(k)) throw new ValidationError("badDate", { key: k.slice(0, 40) });
        var day = migrateDay(data.days[k], k);
        if (!isDayEmpty(day)) {
          days[k] = day;
          var a = absentDayFields(data.days[k]);
          if (a.length) absent[k] = a;
        }
      });

      var habit = null, settings = null;
      if (data.version >= 2) {
        habit = migrateHabit(data.habit);
        habit.draft = null; // yarım kalmış kurulum taslağı geri yüklenmez
        if (isHabitEmpty(habit)) habit = null;
        settings = data.settings ? migrateSettings(data.settings) : null;
        if (settings) {
          // Yalnızca görünüm tercihleri taşınır; okuma konumu cihaza özeldir. Yedekte olmayan tercih değiştirilmez.
          settings = { motion: settings.motion, textSize: settings.textSize, theme: settings.theme };
          if (!settings.motion && !settings.textSize && !settings.theme) settings = null;
        }
      }
      if (!Object.keys(days).length && !habit) throw new ValidationError("empty");
      return { ok: true, version: data.version, days: days, absentFields: absent, habit: habit, settings: settings };
    } catch (err) {
      if (err instanceof ValidationError) return { ok: false, code: err.code, params: err.params };
      return { ok: false, code: "notJson", params: {} };
    }

  function buildBackup(days, habit, settings, now) {

  function openDialog(dlg) {
    if (dlg.open) return; // zaten açık (ör. dil değişince içerik yeniden çizildi)
    if (typeof dlg.showModal === "function") {
      try {
        dlg.showModal();
        return;
      } catch (e) { /* aşağıdaki yedeğe düş */ }
    }
    dlg.classList.add("is-fallback");
    dlg.setAttribute("open", "");
  }
  function closeDialog(dlg) {
    if (typeof dlg.close === "function" && !dlg.classList.contains("is-fallback")) {
      try { dlg.close(); } catch (e) { dlg.removeAttribute("open"); }
    } else {
      dlg.removeAttribute("open");
      dlg.classList.remove("is-fallback");
      try { dlg.dispatchEvent(new Event("close")); } catch (e) { /* eski tarayıcı */ }
    }
  }

  /* ---------- Onay penceresi (tarayıcının confirm() penceresi yerine) ---------- */

  function confirmDialog(opts) {
    var dlg = $("confirm");

      function finish(v) {

        if (dlg.hasAttribute("open")) closeDialog(dlg);
        resolve(v);

  function parseHash() {
    var hsh = decodeURIComponent((location.hash || "").replace(/^#/, ""));
    if (!hsh || hsh === "hosgeldin") return { view: "home" };
    if (hsh === "oku") return { view: "contents" };
    if (hsh.indexOf("oku-") === 0) return { view: "chapter", id: hsh.slice(4) };
    if (hsh === "gunum" || hsh === "planla") return { view: "day", date: STORE.dateKey(), today: true };
    if (hsh.indexOf("gun-") === 0 && STORE.isValidDateKey(hsh.slice(4))) return { view: "day", date: hsh.slice(4), today: hsh.slice(4) === STORE.dateKey() };
    if (hsh === "gecmis") return { view: "history" };
    if (hsh === "aliskanlik") return { view: "habit" };
    if (hsh === "aliskanlik-kur") return { view: "wizard" };
    return { view: "home" };
  }

  var TAB_OF = { contents: "oku", chapter: "oku", day: "gunum", history: "gunum", habit: "aliskanlik", wizard: "aliskanlik" };

  function route() {
    var r = parseHash();
    flushSave();
    cleanupFns.forEach(function (fn) { fn(); });
    cleanupFns = [];

    state.view = r.view;
    viewEl.textContent = "";
    viewEl.className = "view";

    var tab = TAB_OF[r.view];
    document.querySelectorAll("[data-nav]").forEach(function (b) {
      if (b.getAttribute("data-nav") === tab) b.setAttribute("aria-current", "page");
      else b.removeAttribute("aria-current");
    });

    try {
      if (r.view === "home") renderHome();
      else if (r.view === "contents") renderContents();
      else if (r.view === "chapter") renderChapter(r.id);
      else if (r.view === "day") renderDay(r.date, r.today);
      else if (r.view === "history") renderHistory();
      else if (r.view === "habit") renderHabit();
      else if (r.view === "wizard") renderWizard();
    } catch (err) {
      if (!BOOT.isStarted || !BOOT.isStarted()) throw err; // ilk açılışta init yakalar
      renderViewError(err, r.view);
    }

    // Açılıştaki "Kaldığın yerden devam et" için son bölüm
    var place = { chapter: "oku-" + (r.id || ""), day: r.today ? "gunum" : null, habit: "aliskanlik" }[r.view];
    if (place) store.setSettings({ lastPlace: place });

    if (motionAllowed()) {
      void viewEl.offsetWidth;
      viewEl.classList.add("is-entering");

    if (!state.pendingScroll) window.scrollTo(0, 0);
    state.pendingScroll = false;

  function renderTimer(seconds) {
    var fill = h("div", { class: "timer__fill" });

    var btn = h("button", { type: "button", class: "btn btn--secondary", text: t("reader.timerStart") });
    var handle = null, endAt = 0;

    function fmt(s) {
      var m = Math.floor(s / 60), r = s % 60;
      return m + ":" + (r < 10 ? "0" : "") + r;
    }
    function stop(finished) {
      clearInterval(handle);
      handle = null;
      btn.textContent = t("reader.timerStart");
      fill.style.transition = "none";
      fill.style.transform = "scaleX(" + (finished ? 1 : 0) + ")";
      status.textContent = finished ? t("reader.timerDone") : "";
    }
    function tick() {
      var left = Math.max(0, Math.round((endAt - Date.now()) / 1000));
      fill.style.transition = motionAllowed() ? "transform 1s linear" : "none";
      fill.style.transform = "scaleX(" + (1 - left / seconds) + ")";
      // Ekran okuyucuyu her saniye konuşturmamak için durum 30 saniyede bir güncellenir.
      if (left % 30 === 0 || left <= 5) status.textContent = t("reader.timerRemaining", { time: fmt(left) });
      if (left <= 0) stop(true);
    }
    btn.addEventListener("click", function () {
      if (handle) return stop(false);
      endAt = Date.now() + seconds * 1000;
      btn.textContent = t("reader.timerStop");
      status.textContent = t("reader.timerRemaining", { time: fmt(seconds) });
      fill.style.transition = "none";

    });

    if (ch.sources && ch.sources.length) {
      article.appendChild(h("details", { class: "more sources", id: "sources" }, [
        h("summary", { text: t("reader.sourcesTitle") }),
        h("ol", null, ch.sources.map(function (sid) { return h("li", null, [citation(sid)]); })),
      ]));
    }

    var next = BOOK.chapters[idx + 1];
    var end = h("div", { class: "chapter-end" });
    if (next && next.available) {
      end.appendChild(h("button", { type: "button", class: "btn btn--primary btn--block", text: t("reader.nextChapter", { title: next.title }), onclick: function () { state.resume = "top"; navigate("oku-" + next.id); } }));
    } else {
      end.appendChild(h("p", { class: "muted", text: t("reader.nextChapterSoon") }));
      end.appendChild(h("button", { type: "button", class: "btn btn--primary btn--block", text: t("reader.goToDay"), onclick: function () { navigate("gunum"); } }));
    }
    end.appendChild(h("button", { type: "button", class: "btn btn--secondary btn--block", text: t("reader.backToContents"), onclick: function () { navigate("oku"); } }));
    article.appendChild(end);

    viewEl.appendChild(readbar);
    viewEl.appendChild(article);

    var blockEls = Array.prototype.slice.call(article.querySelectorAll("[data-block]"));
    var weighted = Array.prototype.slice.call(article.querySelectorAll("[data-w]"));
    var total = weighted.reduce(function (a, el) { return a + (+el.getAttribute("data-w")); }, 0) || 1;
    var partEls = Array.prototype.slice.call(article.querySelectorAll(".part"));

    function barBottom() {
      return readbar.getBoundingClientRect().bottom;
    }
    function currentBlock() {
      var top = Math.max(barBottom(), 0) + 8;
      for (var i = 0; i < blockEls.length; i++) {
        if (blockEls[i].getBoundingClientRect().bottom > top) return blockEls[i];
      }
      return null;
    }

    /** Konuma dayalı yaklaşık ilerleme: yalnızca okuma metni sayılır (düğmeler ve kaynaklar hariç). */
    var lastPct = -1;
    function update() {
      var line = Math.max(barBottom(), 0) + (window.innerHeight - Math.max(barBottom(), 0)) * 0.3;
      var read = 0;
      weighted.forEach(function (el) {
        var r = el.getBoundingClientRect(), wgt = +el.getAttribute("data-w");
        if (r.bottom <= line) read += wgt;
        else if (r.top < line) read += wgt * ((line - r.top) / Math.max(r.height, 1));
      });
      var lastEl = weighted[weighted.length - 1];
      var pct = Math.round((100 * read) / total);
      if (lastEl && lastEl.getBoundingClientRect().bottom <= window.innerHeight + 2) pct = 100;
      pct = Math.max(0, Math.min(100, pct));

      var curPart = partEls[0];
      partEls.forEach(function (p) { if (p.getBoundingClientRect().top <= line) curPart = p; });
      partEl.textContent = (chapterLabel(ch) ? chapterLabel(ch) + " · " : "") + (curPart ? curPart.getAttribute("data-part-title") : ch.title);

      if (pct !== lastPct) {
        lastPct = pct;
        fillEl.style.width = pct + "%";
        pctEl.textContent = t("reader.progressShort", { p: pct });
        $("read-track").setAttribute("aria-valuenow", String(pct));
        $("read-track").setAttribute("aria-valuetext", t("reader.progress", { p: pct }));
      }
    }

    // Kaldığın yeri hatırla
    var saveTimer = null;
    function onScroll() {
      update();
      clearTimeout(saveTimer);
      saveTimer = setTimeout(function () {
        var b = currentBlock();
        if (b) store.setSettings({ reading: { chapterId: ch.id, blockId: b.getAttribute("data-block") } });
      }, 250);
    }
    window.addEventListener("scroll", onScroll, { passive: true });
    window.addEventListener("resize", update);
    cleanupFns.push(function () {
      window.removeEventListener("scroll", onScroll);
      window.removeEventListener("resize", update);
      clearTimeout(saveTimer);
    });

    // Konum: açıkça "baştan" denmediyse bu bölümde kalınan yer kullanılır
    var saved = store.getSettings().reading;
    if (!state.resume && saved && saved.chapterId === ch.id) state.resume = saved.blockId;
    if (state.resume === "top") state.resume = null;
    var target = state.resume && $("blk-" + state.resume);
    state.resume = null;
    if (target) {
      state.pendingScroll = true;
      requestAnimationFrame(function () {
        target.scrollIntoView({ block: "start" });
        update();
      });
    } else {
      store.setSettings({ reading: { chapterId: ch.id, blockId: ch.blocks[0] && ch.blocks[0].id } });
      requestAnimationFrame(update);
    }
  }

  /* ================= Günüm ================= */

  /** Puan dışındaki herhangi bir plan içeriği var mı? (takvimde "plan var" işareti için) */
  function hasPlanContent(d) {
    if (!d) return false;
    var c = JSON.parse(JSON.stringify(d));
    c.rating = null;
    c.ratingNote = "";
    return !STORE.isDayEmpty(c);
  }

  function ratingText(n) {
    return t("day.ratingOptions." + n);
  }

  /* ---------- Aylık takvim (Günüm'ün üstünde, açılıp kapanır) ---------- */

  function calendarPanel(openKey) {
    var today = STORE.dateKey();
    var open = !!store.getSettings().calendarOpen;
    var region = h("div", { id: "cal-region", class: "cal-panel", hidden: !open });

    var toggle = h("button", { type: "button", class: "cal-toggle", id: "cal-toggle", "aria-expanded": open ? "true" : "false", "aria-controls": "cal-region", onclick: function () {
      open = !open;
      store.setSettings({ calendarOpen: open });
      toggle.setAttribute("aria-expanded", open ? "true" : "false");
      region.hidden = !open;
      if (open) draw();
    } }, [
      h("span", { class: "chev", "aria-hidden": "true", html: ICON_CHEV }),
      h("span", { class: "cal-toggle__text" }, [h("strong", { text: t("calendar.toggle") }), h("span", { class: "hint", text: t("calendar.toggleHint") })]),
    ]);

    function draw(focusSel) {
      var days = store.getDays();
      var habit = store.getHabit();
      var y = state.calMonth.y, m = state.calMonth.m;
      var sel = state.calSelected;
      region.textContent = "";

      var title = h("h2", { class: "cal__title", id: "cal-title", "aria-live": "polite", text: t("calendar.monthTitle", { month: S.dates.months[m], year: y }) });
      function shift(delta, btnId) {
        var d = new Date(y, m + delta, 1);
        state.calMonth = { y: d.getFullYear(), m: d.getMonth() };
        draw(btnId);
      }
      var head = h("div", { class: "cal__head" }, [
        h("button", { type: "button", class: "icon-btn", id: "cal-prev", "aria-label": t("calendar.prevMonth"), html: ICON_BACK, onclick: function () { shift(-1, "cal-prev"); } }),
        title,
        h("button", { type: "button", class: "icon-btn", id: "cal-next", "aria-label": t("calendar.nextMonth"), html: ICON_CHEV, onclick: function () { shift(1, "cal-next"); } }),
      ]);
      var todayBtn = h("button", { type: "button", class: "btn btn--quiet", id: "cal-today", text: t("calendar.today"), onclick: function () {
        var d = STORE.keyToDate(today);
        state.calMonth = { y: d.getFullYear(), m: d.getMonth() };
        state.calSelected = today;
        draw("cal-day-" + today);
      } });

      var grid = h("div", { class: "cal__grid", role: "group", "aria-labelledby": "cal-title" });
      S.dates.weekdaysMondayFirst.forEach(function (w) { grid.appendChild(h("span", { class: "cal__wd", "aria-hidden": "true", text: w })); });
      STORE.monthGrid(y, m).forEach(function (k) {
        if (!k) { grid.appendChild(h("span", { class: "cal__blank", "aria-hidden": "true" })); return; }
        var d = days[k], e = habit.log[k];
        var marks = [];
        var label = [formatDate(k)];
        if (k === today) label.push(t("calendar.cellToday"));
        if (k === sel) label.push(t("calendar.cellSelected"));
        if (hasPlanContent(d)) { marks.push(h("i", { class: "mk mk-plan", "aria-hidden": "true" })); label.push(t("calendar.cellPlan")); }
        if (e && k <= today) { marks.push(h("i", { class: "mk mk-habit", "aria-hidden": "true" })); label.push(t("calendar.cellHabit", { status: t("habit.statusShort." + e.status) })); }
        if (d && d.rating) { marks.push(h("b", { class: "mk-rating", "aria-hidden": "true", text: String(d.rating) })); label.push(t("calendar.cellRating", { n: d.rating })); }
        if (!marks.length) label.push(t("calendar.cellEmpty"));
        grid.appendChild(h("button", {
          type: "button", class: "cal__day" + (k === today ? " is-today" : "") + (k > today ? " is-future" : ""),
          id: "cal-day-" + k, "data-cal": k, "aria-pressed": k === sel ? "true" : "false",
          "aria-current": k === today ? "date" : null, "aria-label": label.join(", "),
          onclick: function () { state.calSelected = k; draw("cal-day-" + k); },
        }, [h("span", { class: "cal__num", text: String(STORE.keyToDate(k).getDate()) }), h("span", { class: "cal__marks", "aria-hidden": "true" }, marks)]));
      });

      var legend = h("div", { class: "cal__legend" }, [
        h("p", { class: "label", text: t("calendar.legendTitle") }),
        h("ul", { class: "legend" }, [
          h("li", null, [h("span", { class: "lg lg-today", "aria-hidden": "true" }), t("calendar.legendToday")]),
          h("li", null, [h("span", { class: "lg lg-selected", "aria-hidden": "true" }), t("calendar.legendSelected")]),
          h("li", null, [h("i", { class: "mk mk-plan", "aria-hidden": "true" }), t("calendar.legendPlan")]),
          h("li", null, [h("i", { class: "mk mk-habit", "aria-hidden": "true" }), t("calendar.legendHabit")]),
          h("li", null, [h("b", { class: "mk-rating", "aria-hidden": "true", text: "3" }), t("calendar.legendRating")]),
        ]),
        h("p", { class: "hint", text: t("calendar.legendNote") }),
      ]);

      region.appendChild(h("div", { class: "cal" }, [head, todayBtn, grid, legend]));
      region.appendChild(daySummary(sel, openKey, days[sel], habit));
      if (focusSel && $(focusSel)) $(focusSel).focus({ preventScroll: true });
    }

    if (open) draw();
    // Kayıt yapılınca işaretler ve özet tazelenir (odak yerinde kalır)
    state.calRedraw = function () { if (open) draw(); };
    cleanupFns.push(function () { state.calRedraw = null; });
    return h("section", { class: "cal-wrap", "aria-label": t("calendar.toggle") }, [toggle, region]);
  }

  /** Takvimde seçilen günün özeti */
  function daySummary(k, openKey, d, habit) {
    var today = STORE.dateKey();
    var e = k <= today ? habit.log[k] : null;
    var box = h("section", { class: "box box--action cal-summary", id: "cal-summary", "aria-labelledby": "cal-summary-title", "aria-live": "polite" }, [
      h("h3", { id: "cal-summary-title", text: formatDate(k) }),
    ]);
    function go() {
      state.scrollToDay = true;
      navigate(k === today ? "gunum" : "gun-" + k);
    }
    if (k === openKey) box.appendChild(h("p", { class: "hint", id: "cal-open-here", text: t("calendar.openHere") }));
    if (!d && !e) {
      if (k > today) {
        box.appendChild(h("p", { text: t("calendar.emptyFuture") }));
        if (k !== openKey) box.appendChild(h("button", { type: "button", class: "btn btn--secondary", id: "cal-create", text: t("calendar.createFuture"), onclick: go }));
      } else {
        box.appendChild(h("p", { text: k === today ? t("calendar.emptyToday") : t("calendar.emptyPast") }));
        if (k !== openKey) box.appendChild(h("button", { type: "button", class: "btn btn--secondary", id: "cal-create", text: t("calendar.createPast"), onclick: go }));
      }
      return box;
    }
    var rows = [];
    function row(label, value) {
      if (!value) return;
      rows.push(h("div", null, [h("dt", { text: label }), h("dd", { text: value })]));
    }
    if (d) {
      row(t("calendar.mainLabel"), d.main.text.trim() || "—");
      var done = [d.main].concat(d.extras).filter(function (x) { return x.done && x.text.trim(); }).map(function (x) { return x.text.trim(); });
      row(t("calendar.doneLabel"), done.length ? done.join("\n") : t("calendar.noneDone"));
    }
    if (e) {
      var plan = habit.plans[e.planId];
      row(t("calendar.habitLabel"), t("calendar.habitLine", { status: t("habit.statuses." + e.status), goal: plan ? plan.goal : "" }) + (e.note ? "\n" + e.note : ""));
    }
    if (d && d.rating) row(t("calendar.ratingLabel"), ratingText(d.rating));
    if (d && d.ratingNote.trim()) row(t("calendar.ratingNoteLabel"), d.ratingNote.trim());
    if (d) row(t("calendar.eveningLabel"), [d.evening.worked.trim(), d.evening.easier.trim()].filter(Boolean).join("\n"));
    box.appendChild(h("dl", { class: "day-detail" }, rows));
    if (k !== openKey) box.appendChild(h("button", { type: "button", class: "btn btn--primary", id: "cal-open-day", text: t("calendar.openDay"), onclick: go }));
    return box;

  function renderDay(dateKey, openedAsToday) {
    var today = STORE.dateKey();
    var isPast = dateKey < today;
    var isFuture = dateKey > today;
    state.planDate = dateKey;
    state.planOpenedAsToday = !!openedAsToday;
    // Takvim: açık olan gün seçili ve görünür ay olur
    if (state.calFor !== dateKey) {
      var od = STORE.keyToDate(dateKey);
      state.calFor = dateKey;
      state.calSelected = dateKey;
      state.calMonth = { y: od.getFullYear(), m: od.getMonth() };
    }

    var day = store.getDay(dateKey);
    var legacyWhat = day.start.what.trim() && day.start.what.trim() !== day.main.step.trim() ? day.start.what : "";
    var keepWhat = day.start.what; // eski alan: kullanıcı karar verene kadar olduğu gibi saklanır
    var key = dateKey; // form bu tarihe sabitlenir; gece yarısı geçse de yazılanlar bu güne gider

    var banners = h("div", { class: "stack-sm", id: "day-banners" });
    if (!store.available) banners.appendChild(h("div", { class: "banner banner--warn", role: "alert", text: t("save.storageWarning") }));
    if (isPast || isFuture) {
      banners.appendChild(h("div", { class: "banner", id: isFuture ? "future-banner" : "past-banner" }, [
        h("p", { text: isFuture ? t("day.futureBanner") : t("day.pastBanner") }),
        h("button", { type: "button", class: "btn btn--secondary", text: t("day.backToToday"), onclick: function () { navigate("gunum"); } }),
      ]));
    }
    if (state.cameFromBook) {
      var back = state.cameFromBook;
      banners.appendChild(h("div", { class: "banner" }, [
        h("button", { type: "button", class: "btn btn--secondary", id: "back-to-book", text: t("day.backToBook"), onclick: function () {
          state.cameFromBook = null;
          state.resume = back.blockId;
          navigate("oku-" + back.chapterId);
        } }),
      ]));
    }

    // Ana iş ve ilk küçük adım: ilk bakışta yalnızca bunlar
    var mainBox = h("section", { class: "box box--action", "aria-label": t("day.mainLabel") }, [

        field("f-main", t("day.mainLabel"), { hint: t("day.mainHint"), placeholder: t("day.mainPlaceholder"), value: day.main.text }),
        checkbox("f-main-done", t("day.mainDoneLabel"), day.main.done),
      ]),
      field("f-step", t("day.stepLabel"), { hint: t("day.stepHint"), placeholder: t("day.stepPlaceholder"), value: day.main.step }),
    ]);

    var brainFilled = !!day.brain.trim();
    var brain = disclosure("d-brain", t("day.brainToggle"), [
      field("f-brain", t("day.brainLabel"), { hint: t("day.brainHint"), multiline: true, rows: 5, max: 10000, placeholder: t("day.brainPlaceholder"), value: day.brain }),
    ], brainFilled, brainFilled ? t("day.filled") : null);

    function extra(n) {
      var ex = day.extras[n - 1];
      return h("div", { class: "task", id: "task-extra" + n }, [
        field("f-extra" + n, t("day.extraLabel", { n: n }), { placeholder: t("day.extraPlaceholder"), value: ex.text }),
        checkbox("f-extra" + n + "-done", t("day.extraDoneLabel", { n: n }), ex.done),
      ]);
    }
    var extrasFilled = !!(day.extras[0].text.trim() || day.extras[1].text.trim());
    var extras = disclosure("d-extras", t("day.extrasToggle"), [h("p", { class: "hint", text: t("day.extrasHint") }), extra(1), extra(2)], extrasFilled, extrasFilled ? t("day.filled") : null);

    // Başlama planı: ilk küçük adım otomatik kullanılır; kullanıcı yalnızca zaman ve yeri yazar
    var startOut = h("div", { id: "start-out", "aria-live": "polite" });
    var legacyBox = null;
    if (legacyWhat) {

        h("strong", { text: t("day.legacyTitle") }),
        h("p", { text: t("day.legacyBody") }),
        h("blockquote", { text: legacyWhat }),
        h("p", { class: "hint", text: t("day.legacyUseStepHint") }),
        h("div", { class: "btn-row" }, [
          h("button", { type: "button", class: "btn btn--secondary", id: "legacy-use-step", text: t("day.legacyUseStep"), onclick: function () { resolveLegacy(false); } }),
          h("button", { type: "button", class: "btn btn--secondary", id: "legacy-move", text: t("day.legacyMoveToStep"), onclick: function () { resolveLegacy(true); } }),
