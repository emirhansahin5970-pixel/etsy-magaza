<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- Web uygulaması (yalnızca barındırılan sürümde; claude.ai Artifact sürümüne girmez) -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Small Steps">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<!-- @artifact-head-start -->
<title>Small Steps, Clear Days</title>
<meta name="description" content="Genix Studio: a short read, a clearer daily plan and a small habit trial.">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#fbf6ec" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#191b1a" media="(prefers-color-scheme: dark)">
<!-- Tema, sayfa çizilmeden önce uygulanır (koyu tema seçiliyken beyaz parlamayı önler). Kayıtlı seçim yoksa cihaz teması kullanılır. -->
<script>(function(){try{var s=JSON.parse(window.localStorage.getItem("gx.ssc.settings.v1")||"{}");if(s&&(s.theme==="dark"||s.theme==="light")){document.documentElement.setAttribute("data-theme",s.theme);}}catch(e){}})();</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Yazı tipleri çizimi ENGELLEMEZ: media="print" ile indirilir, boot.js yüklenince etkinleştirir.
     Google Fonts'a ulaşılamazsa (ya da istek askıda kalırsa) sayfa sistem fontlarıyla açılır. -->
<link id="gx-fonts" rel="stylesheet" media="print" href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap">
<link rel="stylesheet" href="styles.css">
<!-- @artifact-head-end -->
</head>
<body>
<!-- @artifact-body-start -->
<!-- data-t ile işaretli metinler derleme sırasında i18n/en.js'ten doldurulur (data-t-lang varsa o dilden); JavaScript çalışmasa da görünürler.
     Kayıtlı dil tercihi başkaysa boot.js bu metinleri hemen o dile çevirir. -->
<div id="app-root" class="is-booting">
<a class="skip" href="#main" data-t="app.skipToContent"></a>

<header class="topbar">
  <div class="topbar__inner">
    <a class="brand" href="#hosgeldin">
      <span class="brand__studio" data-t="app.brand"></span>
      <span class="brand__title" data-t="app.title"></span>
    </a>
    <div class="topbar__actions">
    <button type="button" class="settings-btn lang-top" id="open-language" aria-haspopup="dialog">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3z"/></svg>
      <span id="lang-code">EN</span>
    </button>
    <button type="button" class="settings-btn" id="open-settings" aria-haspopup="dialog">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2.8v2.4M12 18.8v2.4M4.6 4.6l1.7 1.7M17.7 17.7l1.7 1.7M2.8 12h2.4M18.8 12h2.4M4.6 19.4l1.7-1.7M17.7 6.3l1.7-1.7"/></svg>
      <span data-t="app.settingsButton"></span>
    </button>
    </div>
  </div>
</header>

<nav class="tabs" data-t-label="nav.label">
  <ul class="tabs__list">
    <li><button type="button" class="tab" data-nav="oku" data-t="nav.read"></button></li>
    <li><button type="button" class="tab" data-nav="gunum" data-t="nav.day"></button></li>
    <li><button type="button" class="tab" data-nav="aliskanlik" data-t="nav.habit"></button></li>
  </ul>
</nav>

<main id="main" tabindex="-1">
  <div id="view" class="view">
    <!-- Başlangıç ekranı: JavaScript gerektirmez. Uygulama başlayınca yerine uygulama ekranı gelir. -->
    <section class="boot-screen" id="boot-screen" aria-labelledby="boot-title">
      <p class="eyebrow" data-t="app.brand"></p>
      <h1 id="boot-title" data-t="app.title"></h1>
      <p class="lead" data-t="boot.description"></p>
      <p class="boot-status" id="boot-status" role="status"><span class="boot-dot" aria-hidden="true"></span><span data-t="boot.loading"></span></p>
      <noscript>
        <p class="boot-noscript" data-t="boot.noscript"></p>
        <p class="boot-noscript" lang="tr" data-t-lang="tr" data-t="boot.noscript"></p>
        <style>.boot-status, .boot-hint { display: none !important; }</style>
      </noscript>
      <p class="hint boot-hint" data-t="boot.slowHint"></p>
    </section>
  </div>
</main>

<dialog id="settings" aria-labelledby="settings-title"></dialog>
<dialog id="confirm" aria-labelledby="confirm-title"></dialog>

<div class="toast-region" aria-live="polite" aria-atomic="true" id="toast-region"></div>
</div>

<!-- Önce güvenlik ağı: sonraki betiklerdeki hataları yakalar. -->
<script src="boot.js"></script>
<script src="i18n/tr.js"></script>
<script src="i18n/en.js"></script>
<script src="i18n/de.js"></script>
<script src="i18n/fr.js"></script>
<script src="i18n/es.js"></script>
<script src="i18n/it.js"></script>
<script src="i18n/nl.js"></script>
<script src="content/book.tr.js"></script>
<script src="content/book.en.js"></script>
<script src="content/book.de.js"></script>
<script src="content/book.fr.js"></script>
<script src="content/book.es.js"></script>
<script src="content/book.it.js"></script>
<script src="content/book.nl.js"></script>
<script src="illustrations.js"></script>
<script src="storage.js"></script>
<script src="app.js"></script>
<!-- @artifact-body-end -->
</body>
</html>
