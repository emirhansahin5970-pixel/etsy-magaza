<title>Small Steps, Clear Days</title>
<meta name="description" content="Genix Studio: a short read, a clearer daily plan and a small habit trial.">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#fbf6ec" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#191b1a" media="(prefers-color-scheme: dark)">
<!-- Tema, sayfa çizilmeden önce uygulanır (koyu tema seçiliyken beyaz parlamayı önler). Kayıtlı seçim yoksa cihaz teması kullanılır. -->
<script>(function(){try{var s=JSON.parse(window.localStorage.getItem("gx.ssc.settings.v1")||"{}");if(s&&(s.theme==="dark"||s.theme==="light")){document.documentElement.setAttribute("data-theme",s.theme);}}catch(e){}})();</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Yazı tipleri çizimi ENGELLEMEZ: media="print" ile indirilir, boot.js yüklenince etkinleştirir.
     Google Fonts'a ulaşılamazsa (ya da istek askıda kalırsa) sayfa sistem fontlarıyla açılır. -->
<link id="gx-fonts" rel="stylesheet" media="print" href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap">
<style>
/* Düzen: mobilde tek sütun, en az 16px kenar boşluğu; okuma metni ~34rem; geniş ekranda açılış ve alışkanlık iki sütun. */
:root {
  /* Renk: krem zemin, koyu metin, adaçayı (seçim ve yapı), turuncu yalnızca önemli eylem ve küçük işaret */
  --cream: #fbf6ec;
  --paper: #fffdf8;
  --ink: #1d231f;
  --ink-soft: #4d554f;
  --line: #e2d9c6;
  --line-strong: #cbc1ab;
  --field-border: #7f8780; /* form alanı ve seçenek kenarlığı: ≥ 3:1 */
  --sage: #4b6a54;        /* metin/ikon: kremde ~5.6:1 */
  --sage-deep: #34503d;   /* koyu yüzey: krem yazıyla ~8:1 */
  --sage-soft: #dde7da;
  --sage-wash: #eef3ea;
  --accent: #b4501c;      /* birincil eylem zemini: beyaz yazıyla ~5.7:1 */
  --accent-ink: #9a4417;  /* turuncu metin: kremde ~6:1 */
  --accent-mark: #d9692c; /* yalnızca küçük işaretler (tik, nokta) */
  --accent-soft: #f6e3d4;
  --danger: #9e2f22;       /* hata metni ve kenarlığı */
  --danger-solid: #9e2f22; /* hata düğmesi zemini (beyaz yazı) */
  --danger-soft: #f7dcd6;
  --danger-ink: #5c1a12;   /* hata kutusu metni */
  --focus: #1f5fbf;
  --field: #ffffff;        /* form alanı ve açık yüzeyler */
  --placeholder: #6c736d;
  --on-accent: #ffffff;    /* turuncu/kırmızı düğme üstündeki yazı */
  --cover-bg: #34503d;
  --cover-ink: #fffaf0;
  --cover-muted: #dde7da;
  --shadow: rgb(29 35 31 / 0.14);
  --shadow-strong: rgb(29 35 31 / 0.25);
  --backdrop: rgb(29 35 31 / 0.45);

  /* Yazı: iki aile. Başlık: karakterli serif. Metin ve arayüz: okunaklı sans. */
  --font-display: "Fraunces", "Iowan Old Style", Georgia, "Times New Roman", serif;
  --font-text: "Figtree", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;

  --step--1: 0.9rem;
  --step-0: 1.0625rem;
  --step-1: 1.1875rem;
  --step-2: 1.45rem;
  --step-3: 1.9rem;

  --measure: 34rem;
  --page: 40rem;
  --page-wide: 64rem;
  --gutter: max(1rem, env(safe-area-inset-left, 0px));
  --radius: 14px;
  --tap: 3rem;            /* 48px: 44px alt sınırın üstünde */
  --ease: cubic-bezier(.2, .7, .2, 1);
  --dur: 200ms;

  color-scheme: light;
}

/* Koyu tema: cihaz koyu temadaysa (kullanıcı "Açık" seçmediyse) ya da kullanıcı "Koyu" seçtiyse.
   İki blok aynı değerleri taşır; tests/contrast.mjs ikisinin eşit olduğunu ve kontrastları denetler. */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
  --cream: #191b1a;
  --paper: #222523;
  --ink: #ece7dc;
  --ink-soft: #bcb6a9;
  --line: #3a3f3b;
  --line-strong: #5b625d;
  --field-border: #8a928c;
  --sage: #9cc0a4;
  --sage-deep: #b5d3bb;
  --sage-soft: #32453a;
  --sage-wash: #232c26;
  --accent: #b4501c;
  --accent-ink: #f2a679;
  --accent-mark: #e8834a;
  --accent-soft: #3a2a20;
  --danger: #ff9a8b;
  --danger-solid: #b0392b;
  --danger-soft: #3d2320;
  --danger-ink: #ffc3b9;
  --focus: #8ab4ff;
  --field: #2a2e2b;
  --placeholder: #9aa09a;
  --on-accent: #ffffff;
  --cover-bg: #2b4033;
  --cover-ink: #f6f1e6;
  --cover-muted: #c4d6c8;
  --shadow: rgb(0 0 0 / 0.35);
  --shadow-strong: rgb(0 0 0 / 0.55);
  --backdrop: rgb(0 0 0 / 0.6);
  color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --cream: #191b1a;
  --paper: #222523;
  --ink: #ece7dc;
  --ink-soft: #bcb6a9;
  --line: #3a3f3b;
  --line-strong: #5b625d;
  --field-border: #8a928c;
  --sage: #9cc0a4;
  --sage-deep: #b5d3bb;
  --sage-soft: #32453a;
  --sage-wash: #232c26;
  --accent: #b4501c;
  --accent-ink: #f2a679;
  --accent-mark: #e8834a;
  --accent-soft: #3a2a20;
  --danger: #ff9a8b;
  --danger-solid: #b0392b;
  --danger-soft: #3d2320;
  --danger-ink: #ffc3b9;
  --focus: #8ab4ff;
  --field: #2a2e2b;
  --placeholder: #9aa09a;
  --on-accent: #ffffff;
  --cover-bg: #2b4033;
  --cover-ink: #f6f1e6;
  --cover-muted: #c4d6c8;
  --shadow: rgb(0 0 0 / 0.35);
  --shadow-strong: rgb(0 0 0 / 0.55);
  --backdrop: rgb(0 0 0 / 0.6);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
html, body { margin: 0; background: var(--cream); color: var(--ink); }
body {
  font-family: var(--font-text);
  font-size: var(--step-0);
  line-height: 1.55;
  /* Uzun Türkçe kelimeler büyük yazı boyutunda dar ekrana sığmazsa bölünebilsin */
  overflow-wrap: anywhere;
  -webkit-tap-highlight-color: transparent;
}
img, svg { max-width: 100%; }
button, input, textarea, select { font: inherit; color: inherit; }
[hidden] { display: none !important; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 6px; }

.skip {
  position: absolute; left: 0.5rem; top: -4rem; z-index: 50;
  background: var(--ink); color: var(--cream); padding: 0.6rem 1rem; border-radius: 8px;
}
.skip:focus { top: calc(0.5rem + env(safe-area-inset-top, 0px)); }
.visually-hidden {
  position: absolute !important; width: 1px; height: 1px; overflow: hidden;
  clip: rect(0 0 0 0); white-space: nowrap;
}

h1, h2, h3 { font-family: var(--font-display); font-weight: 600; line-height: 1.2; text-wrap: balance; margin: 0; }
h1 { font-size: var(--step-3); letter-spacing: -0.01em; }
h2 { font-size: var(--step-2); }
h3 { font-size: var(--step-1); }
p { margin: 0; }
.lead { font-size: var(--step-1); }
.muted { color: var(--ink-soft); }
.hint { font-size: var(--step--1); color: var(--ink-soft); }
.eyebrow { font-size: 0.8rem; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 700; color: var(--sage); }
.stack { display: grid; gap: 1rem; }
.stack-sm { display: grid; gap: 0.5rem; }
.stack-lg { display: grid; gap: 1.75rem; }
.stack > *, .stack-sm > *, .stack-lg > * { min-width: 0; }

/* ---------- Üst bölüm ve gezinme ---------- */
.topbar { padding-inline: var(--gutter); padding-block: 0.6rem 0; }
.topbar__inner, .tabs__list { max-width: var(--page-wide); margin-inline: auto; }
.topbar__inner { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 0.5rem 0.75rem; }
.brand { flex: 1 1 11rem; min-width: 0; min-height: 2.75rem; display: grid; align-content: center; color: inherit; text-decoration: none; padding-block: 0.2rem; }
.brand__studio { font-size: 0.72rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--sage); font-weight: 700; }
.brand__title { font-family: var(--font-display); font-weight: 600; font-size: 1rem; line-height: 1.25; }
.settings-btn {
  flex: 0 1 auto; max-width: 100%; min-width: 0; overflow-wrap: anywhere; text-align: left; min-height: 2.75rem; padding: 0.35rem 0.85rem 0.35rem 0.6rem;
  display: inline-flex; align-items: center; gap: 0.4rem;
  border: 1.5px solid var(--line-strong); background: var(--paper); border-radius: 999px; cursor: pointer; font-weight: 600; font-size: 0.95rem;
}
.topbar__actions { display: flex; flex-wrap: wrap; gap: 0.4rem; min-width: 0; max-width: 100%; }
.lang-top { padding-inline: 0.6rem 0.75rem; letter-spacing: 0.04em; }
.settings-btn svg { flex: none; width: 1.25rem; height: 1.25rem; stroke: var(--ink); fill: none; stroke-width: 1.8; stroke-linecap: round; }

.tabs { padding-inline: var(--gutter); border-bottom: 1px solid var(--line); }
.tabs__list { list-style: none; margin-block: 0; padding: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); }
.tab {
  width: 100%; min-height: var(--tap); padding: 0.55rem 0.25rem 0.5rem;
  border: 0; background: transparent; cursor: pointer;
  font-weight: 600; font-size: 1rem; line-height: 1.2; color: var(--ink-soft);
  border-bottom: 3px solid transparent; margin-bottom: -1px;
}
.tab[aria-current="page"] { color: var(--ink); border-bottom-color: var(--sage); }

/* ---------- Sayfa ---------- */
main { padding-inline: var(--gutter); padding-block: 1.5rem 4rem; }
main:focus { outline: none; }
.view { max-width: var(--page); margin-inline: auto; }
.view.is-wide { max-width: var(--page-wide); }
.view.is-entering { animation: view-in var(--dur) var(--ease); }
@keyframes view-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

.page-head { display: grid; gap: 0.35rem; }
.crumb {
  display: inline-flex; align-items: center; gap: 0.35rem; justify-self: start;
  min-height: var(--tap); padding: 0.25rem 0.5rem 0.25rem 0.25rem; margin-left: -0.25rem;
  border: 0; background: none; cursor: pointer; color: var(--sage-deep); font-weight: 600;
}
.crumb svg { width: 1.1rem; height: 1.1rem; stroke: currentColor; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- Düğmeler ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem;
  min-height: var(--tap); padding: 0.7rem 1.2rem;
  border-radius: 999px; border: 1.5px solid transparent;
  font-weight: 650; font-size: 1rem; line-height: 1.25; text-align: center; text-decoration: none; cursor: pointer;
  transition: background-color var(--dur) var(--ease), transform var(--dur) var(--ease);
}
.btn:active { transform: scale(0.98); }
.btn--primary { background: var(--accent); color: var(--on-accent); }
.btn--secondary { background: var(--paper); color: var(--ink); border-color: var(--sage); }
.btn--quiet {
  background: transparent; color: var(--sage-deep); padding-inline: 0.25rem; min-height: 2.75rem;
  text-decoration: underline; text-underline-offset: 3px; justify-content: flex-start; text-align: left;
}
.btn--danger { background: var(--danger-solid); color: var(--on-accent); }
.btn--danger-outline { background: var(--paper); color: var(--danger); border-color: var(--danger); }
.btn--block { width: 100%; }
.btn-row { display: flex; flex-wrap: wrap; gap: 0.6rem; }
.btn-row > .btn { flex: 1 1 11rem; }

/* ---------- Form ---------- */
.field { display: grid; gap: 0.3rem; min-width: 0; }
.field > label, .label { font-weight: 650; font-size: 1rem; }
.input, .textarea {
  width: 100%; min-height: var(--tap);
  border: 1.5px solid var(--field-border); border-radius: 10px; background: var(--field);
  padding: 0.65rem 0.75rem; font-size: 1.0625rem; line-height: 1.45; /* 16px üstü: iOS yakınlaştırmasını önler */
}
.textarea { resize: vertical; min-height: 6rem; }
.input:focus, .textarea:focus { border-color: var(--sage); outline: 3px solid var(--sage-soft); outline-offset: 0; }
.input:focus-visible, .textarea:focus-visible { outline: 3px solid var(--focus); outline-offset: 1px; }
.input::placeholder, .textarea::placeholder { color: var(--placeholder); opacity: 1; }
.input[aria-invalid="true"], .textarea[aria-invalid="true"] { border-color: var(--danger); }
.field-error { color: var(--danger); font-weight: 600; font-size: 0.95rem; }

.check {
  position: relative; width: var(--tap); height: var(--tap); flex: none;
  display: grid; place-items: center; cursor: pointer;
}
.check input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
.check__box {
  width: 1.75rem; height: 1.75rem; border-radius: 8px; border: 2px solid var(--sage);
  display: grid; place-items: center; background: var(--field);
  transition: background-color var(--dur) var(--ease), border-color var(--dur) var(--ease);
}
.check__box svg { width: 1.1rem; height: 1.1rem; stroke: var(--on-accent); fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; opacity: 0; }
.check input:checked + .check__box { background: var(--accent-mark); border-color: var(--accent-mark); }
.check input:checked + .check__box svg { opacity: 1; }
.check input:focus-visible + .check__box { outline: 3px solid var(--focus); outline-offset: 2px; }
.check.is-pop .check__box { animation: pop 300ms var(--ease); }
@keyframes pop { 0% { transform: scale(1); } 45% { transform: scale(1.16); } 100% { transform: scale(1); } }

.task { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 0.5rem; align-items: end; }
.task.is-done .input { text-decoration: line-through; text-decoration-color: var(--accent-mark); color: var(--ink-soft); }

/* Seçenek grupları (radyo düğmeleri): zaman seçimi, alışkanlık durumu, yazı boyutu, animasyon */
.choices { border: 0; margin: 0; padding: 0; display: grid; gap: 0.5rem; min-width: 0; }
.choices legend { padding: 0; margin-bottom: 0.4rem; font-weight: 650; }
.choices--row { grid-template-columns: repeat(auto-fit, minmax(min(9rem, 100%), 1fr)); }
.choices--seg { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0.35rem; }
/* Zaman seçimi: üç süre yan yana, "Kendim belirleyeceğim" tam satır (uzun kelime bölünmesin) */
.choices--time { grid-template-columns: repeat(auto-fit, minmax(min(100%, 6.2em), 1fr)); }
.choices--time .choice:last-of-type { grid-column: 1 / -1; }
.choices--time .choice span { padding-inline: 0.6rem; gap: 0.45rem; }
.choice { position: relative; display: block; }
.choice input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.choice span {
  display: flex; align-items: center; gap: 0.6rem; min-height: var(--tap);
  padding: 0.55rem 0.8rem; border: 1.5px solid var(--field-border); border-radius: 12px; background: var(--paper);
  font-weight: 600; line-height: 1.3; cursor: pointer;
  transition: background-color var(--dur) var(--ease), border-color var(--dur) var(--ease);
}
.choices--seg .choice span { justify-content: center; text-align: center; padding-inline: 0.35rem; font-size: 0.95rem; }
.choice input:checked + span { background: var(--sage-soft); border-color: var(--sage); }
.choice input:focus-visible + span { outline: 3px solid var(--focus); outline-offset: 2px; }
.choice .mark { flex: none; width: 1.1rem; height: 1.1rem; border-radius: 50%; border: 2px solid var(--sage); background: var(--field); }
.choice input:checked + span .mark { background: var(--sage-deep); box-shadow: inset 0 0 0 3px var(--field); }

/* ---------- Kutular: yalnızca uygulama, araştırma ve önemli eylem alanları ---------- */
.box { border-radius: var(--radius); padding: 1.1rem; display: grid; gap: 0.75rem; }
.box > * { min-width: 0; }
.box--action { background: var(--paper); border: 1.5px solid var(--line-strong); }
.box--exercise { background: var(--paper); border: 1.5px solid var(--sage); }
.box--research { background: var(--sage-wash); }
.box--note { background: var(--accent-soft); }
.box--error { background: var(--danger-soft); color: var(--danger-ink); }
.box__label { font-size: 0.8rem; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 700; color: var(--sage-deep); }

/* Açılır bölümler: kart değil, çizgiyle ayrılmış satırlar */
.disclosures { display: grid; border-top: 1px solid var(--line); }
.disclosure { border-bottom: 1px solid var(--line); }
.disclosure > summary {
  list-style: none; cursor: pointer;
  display: flex; align-items: center; gap: 0.75rem; min-height: 3.25rem; padding-block: 0.6rem;
  font-weight: 650; font-size: 1.05rem;
}
.disclosure > summary::-webkit-details-marker { display: none; }
.disclosure > summary .chev {
  flex: none; width: 1.75rem; height: 1.75rem; border-radius: 50%; display: grid; place-items: center; background: var(--sage-wash);
  transition: transform var(--dur) var(--ease);
}
.disclosure > summary .chev svg { width: 0.95rem; height: 0.95rem; stroke: var(--sage-deep); fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.disclosure[open] > summary .chev { transform: rotate(90deg); }
.disclosure > summary .sum-text { flex: 1; min-width: 0; }
.disclosure > summary .pill { flex: none; }
.disclosure__body { display: grid; gap: 1rem; padding-block: 0.25rem 1.25rem; }
.disclosure[open] > .disclosure__body { animation: reveal var(--dur) var(--ease); }
@keyframes reveal { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }

.pill {
  display: inline-block; font-size: 0.8rem; font-weight: 650; padding: 0.15rem 0.55rem; border-radius: 999px;
  background: var(--sage-wash); color: var(--sage-deep); line-height: 1.4;
}
.banner { border-radius: 12px; padding: 0.85rem 1rem; display: grid; gap: 0.6rem; background: var(--sage-wash); }
.banner--warn { background: var(--accent-soft); }
.banner .btn { justify-self: start; }

.save-status { min-height: 1.5rem; font-size: 0.95rem; color: var(--sage-deep); font-weight: 600; }
.save-status.is-error { min-height: 0; }

/* ---------- Açılış ---------- */
.home { display: grid; gap: 1.75rem; align-items: start; }
.cover {
  position: relative; overflow: hidden;
  background: var(--cover-bg); color: var(--cover-ink);
  border-radius: 6px 18px 18px 6px;
  padding: 1.5rem 1.4rem 1.25rem 1.9rem;
  display: grid; gap: 0.75rem; max-width: 26rem; width: 100%;
  box-shadow: inset 6px 0 0 rgb(0 0 0 / 0.18), 0 10px 24px var(--shadow);
}
.cover__brand { font-size: 0.75rem; letter-spacing: 0.16em; text-transform: uppercase; font-weight: 700; color: var(--cover-muted); }
.cover__title { font-family: var(--font-display); font-size: clamp(1.75rem, 7vw, 2.4rem); line-height: 1.08; font-weight: 600; color: var(--cover-ink); }
.cover__subtitle { color: var(--cover-muted); font-size: 0.98rem; }
.cover__art svg { display: block; width: 100%; height: auto; }
.cv-scribble { stroke: var(--cover-muted); stroke-width: 3; stroke-linecap: round; fill: none; opacity: 0.75; }
.cv-path { stroke: var(--cover-muted); stroke-width: 2.5; stroke-dasharray: 2 7; stroke-linecap: round; fill: none; }
.cv-step { fill: var(--cover-muted); }
.cv-step--far { opacity: 0.5; }
.cv-dot { fill: var(--accent-mark); }
.cv-sun { fill: none; stroke: var(--accent-mark); stroke-width: 3; }
.home__text { display: grid; gap: 1.1rem; }
.home__desc { font-size: var(--step-1); }
.home__continue { border-top: 1px solid var(--line); padding-top: 1rem; display: grid; gap: 0.5rem; }
.note-line { display: flex; gap: 0.55rem; align-items: flex-start; font-size: var(--step--1); color: var(--ink-soft); }
.note-line svg { flex: none; width: 1.15rem; height: 1.15rem; margin-top: 0.15rem; stroke: var(--sage); fill: none; stroke-width: 1.8; }
.lang-btn { gap: 0.45rem; justify-self: start; font-weight: 600; }
.lang-btn svg { flex: none; width: 1.15rem; height: 1.15rem; stroke: currentColor; fill: none; stroke-width: 1.6; }
@media (min-width: 56rem) {
  .home { grid-template-columns: minmax(0, 24rem) minmax(0, 1fr); gap: 3rem; align-items: center; }
}

/* ---------- İçindekiler ---------- */
.toc { list-style: none; margin: 0; padding: 0; display: grid; border-top: 1px solid var(--line); }
.toc__item { display: grid; gap: 0.3rem; padding-block: 1rem; border-bottom: 1px solid var(--line); }
.toc__meta { font-size: var(--step--1); color: var(--ink-soft); display: flex; flex-wrap: wrap; gap: 0.15rem 0.75rem; }
.toc__title { font-family: var(--font-display); font-size: var(--step-1); font-weight: 600; line-height: 1.25; }

        { id: "b1-p5", type: "p", text: "A list on paper does three practical things. First, it lets you compare tasks. In your head they all look the same size; once they’re written down, you notice that some take two minutes and others take two weeks. Second, it eases the worry about forgetting, because now the paper does the remembering. Third, it makes the next step easier: deciding what to pick for today." },

        {
          id: "b1-gorsel",
          type: "figure",
          art: "thoughtsToPaper",
          alt: "On the left, short lines and loops of different sizes tangled together; from the middle, an arrow leads to a sheet of paper on the right with neat lines. The paper has a few lines of writing and a small check mark next to one of them.",
          caption: "In your head, everything gets tangled together. On paper, the same tasks line up and can be compared.",
        },

        {
          id: "b1-arastirma-2",
          type: "research",
          finding: "In a sleep lab study, young adults who spent five minutes before bed writing down what they had to do in the coming days fell asleep faster, on average, than those who wrote about what they had completed in the past few days.",
          limits: "A single night and a small group of 57 people without sleep problems. It doesn’t show that writing helps everyone sleep better.",
          details: "Those who wrote their to-do lists in more detail also fell asleep faster. This finding should be read as a hint that moving the list from your mind to paper may be calming, not as a firm conclusion.",
          refs: ["scullin2018"],
        },

        { id: "b1-h3", type: "h", text: "You don’t have to organize your whole life" },
        { id: "b1-p6", type: "p", text: "At this point, the first idea that comes up is usually a big cleanup: download a new app, sort everything into categories, add colors, tags, priority levels. A week later, the system has become one more thing that needs looking after." },
        { id: "b1-p7", type: "p", text: "There’s no need for that. The only thing you’ll do in this chapter is get what’s on your mind out of your head for a few minutes. No sorting, no ranking, no planning. We’ll get to that part in the second chapter, and even there we’ll choose one task, not twenty." },

        {
          id: "b1-oneri",
          type: "suggestion",
          text: "Keep the list in one place. If you write in your phone’s notes app one day, on a scrap of paper the next, and in a message draft the day after, your mind will just switch to trying to remember where the lists are. It doesn’t matter which place you choose; it matters that it’s the same place.",
        },

        { id: "b1-p8", type: "p", text: "It may also help to know this: your list is going to look messy. “Call Mom” will sit right above “Figure out what to do after graduation.” That’s normal. The list isn’t there to be tidy; it’s there to make the load in your head visible." },
        { id: "b1-h4", type: "h", text: "What if the list gets long?" },
        { id: "b1-p10", type: "p", text: "Many people who write everything down for the first time flinch a little when they look at the result. Fifteen, twenty lines. “I have this much to do?” But those tasks were already there; now they’re just countable." },
        { id: "b1-p11", type: "p", text: "A long list doesn’t mean you have to do it all today. Some lines are a single text message, some are things that will take months, and some aren’t really tasks at all but worries: “Will I ever find an internship?” You don’t need to do anything to separate them for now. Just seeing that they aren’t all the same kind of thing can lighten the load a little." },
        { id: "b1-p12", type: "p", text: "There may also be things that come to mind that you don’t want to write down. You don’t have to write everything. Nobody is going to see this list; it isn’t there to test you, just to free up a bit of room in your head." },
        { id: "b1-p13", type: "p", text: "You might also notice that some tasks shrink as soon as they’re written down. “Message the landlord” feels like a big conversation in your head, but on paper it turns into a two-sentence text. That doesn’t happen with every task, but when it does, it’s a relief." },
        { id: "b1-p9", type: "p", text: "After getting off the subway that morning, Sam spent three minutes typing everything that came to mind into the notes app. Fourteen lines. Sam didn’t do any of them right then. But after seeing the plan to call the friend at lunch and drop off the return package on the way home that evening, the rest got a little quieter." },

        {
          id: "b1-uygulama",
          type: "exercise",
          title: "The three-minute brain dump",
          planner: "brain",
          timerSeconds: 180,
          steps: [
            "Set a three-minute timer. You can also use the button below.",
            "Write down every task that comes to mind, short and in no particular order. Don’t sort big from small: “Rent message,” “Assignment,” “Dentist appointment.”",
            "Don’t write sentences that start with “I should…”; the name of the task is enough.",
            "Stop when the timer goes off. The list may be incomplete; anything missing can be added later.",
            "You don’t need to do anything with the list for now. Just know that it’s there.",
          ],
        },

        {
          id: "b1-ozet",
          type: "summary",
          text: "Writing down what’s on your mind doesn’t mean you have to do it right away; it just means you can stop carrying it all at once.",
        },
      ],
      sources: ["masicampo2011", "scullin2018"],
    },

    {
      id: "bolum-2",
      kind: "chapter",
      number: 2,
      title: "Give Today One Main Task",
      minutes: 7,
      available: true,
      blocks: [
        {
          id: "b2-sahne",
          type: "scene",
          paragraphs: [
            "Tuesday, 10:00 a.m. Sam is in the library, at a table by the window. Yesterday’s list is right there: fourteen lines.",
            "First, Sam opens the assignment file. A few minutes later, the internship form’s deadline comes to mind, so Sam opens the form. While looking for a document the form asks for, Sam remembers to check the deadline for the package return. Then it’s back to the assignment.",
            "By late morning, seven tabs are open on the screen. None of them is finished. Sam knows the whole morning was spent working, but there’s nothing to show for it.",
          ],
        },

        { id: "b2-h1", type: "h", text: "A list is not a plan" },
        { id: "b2-p1", type: "p", text: "In the first chapter, you wrote down what was on your mind. That lightens the load in your head, but it doesn’t tell you what to start with today. A list is an inventory. Look at fourteen lines at once, and you may start to feel that each one is more urgent than the next." },
        { id: "b2-p2", type: "p", text: "That’s how Sam’s morning went, too. Every task was legitimate, every switch made sense. But each time Sam jumped between tasks, it meant having to remember where things had been left off. The day filled up with half-finished starts." },
        { id: "b2-p3", type: "p", text: "What I suggest in this chapter is simple: choose one main task for each day. It doesn’t have to be the most important thing in your life. Here’s the test: if this task were done, or had moved forward, by this evening, would you feel relieved? If the answer is yes, that’s today’s main task." },
        { id: "b2-p4", type: "p", text: "The other tasks don’t disappear; they wait on the list. Choosing a main task doesn’t mean giving up on the others. It means deciding that when you’ll look at them can wait until later." },

        { id: "b2-h5", type: "h", text: "When choosing feels hard" },
        { id: "b2-p12", type: "p", text: "Some mornings, two or three tasks seem equally urgent. On days like that, a few questions can make the choice easier. Which one has the closer deadline? Which one, if it doesn’t get done, will hold up other things too? Which one sits heavier on your chest when you think about it?" },
        { id: "b2-p13", type: "p", text: "These questions don’t always have a clear answer. In that case, even flipping a coin can be better than not choosing at all. Picking the “wrong” main task is often less tiring than bouncing between three tasks all day, because at least one of them moves forward." },
        { id: "b2-p14", type: "p", text: "And one more thing: the main task doesn’t have to be a big one every day. On a day when you’re tired, just out of an exam or sick, the main task might be “Do the laundry.” You choose the main task based on what the day can hold, not on what the person you want to be could handle." },

        { id: "b2-h2", type: "h", text: "Turning the main task into a small step" },
        { id: "b2-p5", type: "p", text: "“Write the paper” can be a good main task, but it’s a bad starting point. It’s too big; you don’t know where to grab hold of it. What makes starting easier is the main task’s first small step: an action concrete enough to do in a few minutes." },
        { id: "b2-p6", type: "p", text: "A few examples: instead of “Write the paper,” try “Open the file and write three headings.” Instead of “Internship application,” try “Find the missing document and put it in the folder.” Instead of “Talk to the landlord,” try “Write the first sentence of the rent message.”" },
        { id: "b2-p7", type: "p", text: "The point of the first step isn’t to finish the task, it’s to get into it. Sometimes you keep going after the first step, and sometimes you don’t. Either is fine. But there’s a difference between waiting in front of a blank page and coming back to a page that already has three headings." },

        {
          id: "b2-gorsel",
          type: "figure",
          art: "smallSteps",
          alt: "On the left, a large box with a few lines inside it; an arrow leads to four small steps rising to the right. There is an orange dot on the first and lowest step.",
          caption: "You can’t clear a big task in one leap. The first step should be low enough to take today.",
        },

        { id: "b2-h3", type: "h", text: "When and where?" },
        { id: "b2-p8", type: "p", text: "Once you’ve chosen the first step, one more question remains: when and where will you do it? “Sometime today” often slips to the end of the day. “After lunch, on the top floor of the library” sits in your mind like an appointment." },

        {
          id: "b2-arastirma-1",
          type: "research",
          finding: "Plans that psychologist Peter Gollwitzer calls “implementation intentions” involve deciding in advance when, where and how you will act on a goal: “When situation X arises, I will do Y.” In a meta-analysis that brought together 94 independent tests, participants who made plans like this reached their goals at a noticeably higher rate, on average, than those who only set goals.",
          limits: "The size of the effect varied between studies, and some of the research was done in the lab or with students. An average effect doesn’t show that planning will work for everyone or for every task.",
          details: "According to the researchers, plans like these make it easier to start when the moment comes, because the “When should I start?” decision has already been made. In this book, the “Set my start time” section in My Day is based on this idea.",
          refs: ["gollwitzer1999", "gollwitzer2006"],
        },

        {
          id: "b2-oneri",
          type: "suggestion",
          text: "Instead of tying the time to the clock, try tying it to a moment that already happens in your day: “After my first class,” “Once I’ve poured my coffee,” “When I get home and drop my bag.” Clock times slip; moments like these still come around on most days.",
        },

        { id: "b2-h4", type: "h", text: "Extra tasks and what carries over to tomorrow" },
        { id: "b2-p9", type: "p", text: "Alongside the main task, there will also be small things that need doing during the day. In My Day, there are only two spots for these. That may look like a restriction; it’s really a gauge. If you need more than two lines, today may already be a full day, and it’s natural for some tasks to carry over to tomorrow." },
        { id: "b2-p10", type: "p", text: "A task that carries over to tomorrow isn’t a failure; it’s a decision. Keeping it on the list means it hasn’t been forgotten." },
        { id: "b2-p11", type: "p", text: "That day after lunch, Sam closed all the tabs. The main task was the assignment; the first step was to open the file and write three headings. Sam sat down at an empty table upstairs. The headings took ten minutes. Then Sam wrote a few more paragraphs under the first heading. The internship form and the package became the next day’s extra tasks." },

        {
          id: "b2-uygulama",
          type: "exercise",
          title: "Today’s main task",
          planner: "main",
          steps: [
            "Look at your list and ask yourself: which one, if it moved forward, would let me feel relieved this evening?",
            "Write that task down as today’s main task.",
            "Below it, write the first small step you could start in a few minutes.",
            "If you like, add when and where you’ll start, for example: “After lunch, at my desk.”",
            "The rest of the tasks can wait on the list. For today, this is enough.",
          ],
        },

        {
          id: "b2-ozet",
          type: "summary",
          text: "One main task for today and a small first step toward it is often easier than trying to get started by staring at a long list.",
        },
      ],
      sources: ["gollwitzer1999", "gollwitzer2006"],
    },

    {
      id: "bolum-3",
      kind: "chapter",
      number: 3,
      title: "Fit Your Plan to Your Life",
      minutes: 7,
      available: true,
      blocks: [
        {
          id: "b3-sahne",
          type: "scene",
          paragraphs: [
            "Thursday. Sam’s plan was clear: after lunch, the second section of the assignment, at the library.",
            "But the group meeting ran long. On the way out, it started to rain. By the time Sam got home, it was past six: wet, tired and a little annoyed.",
            "The thought that came up was a familiar one: “Today’s already ruined. I’ll start fresh tomorrow.”",
          ],
        },

        { id: "b3-h1", type: "h", text: "When the plan falls apart" },
        { id: "b3-p1", type: "p", text: "A plan made in the morning is a guess about how the day will go. Meetings run long, buses are late, energy runs out sooner than expected. A plan not working out isn’t a mistake on the part of the person who made it; that’s just the nature of guesses." },
        { id: "b3-p2", type: "p", text: "The problem is often not the broken plan but the “all or nothing” thinking that follows. If the plan can’t be carried out exactly, it feels as if it can’t be carried out at all. But on most days, there are three options." },
        { id: "b3-p3", type: "p", text: "The first is to shift the time: “The afternoon didn’t work, so half an hour after dinner.” The second is to shrink the step: “I can’t write the second section, but I can read through my notes once.” The third is to postpone on purpose: “I’m not doing it today; it’s the first thing tomorrow morning.” All three are decisions. The day that gets lost is the day no decision is made." },

        { id: "b3-h2", type: "h", text: "A smaller option for hard days" },
        { id: "b3-p4", type: "p", text: "On a day that’s going well, the first step is easy. A plan is really tested on the hard days. That’s why it can help to decide on a “smaller option” in advance: a backup small enough that you can do it even on a bad day." },
        { id: "b3-p5", type: "p", text: "For an assignment, that might be opening the file and writing a single sentence. For walking, stepping outside and strolling around the block for five minutes. For reading, one page. The smaller option isn’t there so the task counts as done; it’s there so you don’t lose touch with it." },

        {
          id: "b3-gorsel",
          type: "figure",
          art: "flexiblePlan",
          alt: "A dashed path running from left to right curves around an obstacle in the middle and continues. Below are seven small squares; most are filled, one is empty, and there is an orange dot next to the last one.",
          caption: "A plan can go around an obstacle. A gap on one of seven days doesn’t mean the road has ended.",
        },

        { id: "b3-h3", type: "h", text: "Missing a day" },
        { id: "b3-p6", type: "p", text: "When you’re trying out a new habit, skipping a day feels to many people as if they have to start all over again. Streak counters feed that feeling: a thirty-day chain resets in a single day." },

        {
          id: "b3-arastirma-1",
          type: "research",
          finding: "In a study in London, 96 volunteers each chose an eating, drinking or activity behavior to do in the same situation every day, and for 12 weeks rated each day for themselves how automatic that behavior had become. Missing a single opportunity did not noticeably disrupt the habit-forming process. How long it took for the behavior to become nearly automatic varied widely from person to person: between 18 and 254 days.",
          limits: "A small group of volunteers and simple daily behaviors. Automaticity was measured by the participants’ own ratings, and some participants’ data did not fit the model well. Results may be different for more complex behaviors.",
          details: "The median time in the study was 66 days, but this is neither an average nor a target. The finding suggests that fixed timeframes like “a habit in 21 days” don’t fit everyone, and that occasionally missing a day doesn’t reset the process.",
          refs: ["lally2010"],
        },

        {
          id: "b3-oneri",
          type: "suggestion",
          text: "When you try out a habit, start with a short seven-day trial. The goal isn’t to build the habit in seven days; it’s to see whether the time, place and step you chose actually suit you. Changing the plan at the end of the seven days is part of the experiment.",
        },

        { id: "b3-h5", type: "h", text: "If the plan doesn’t fit you" },
        { id: "b3-p10", type: "p", text: "Sometimes the problem isn’t a single bad day. If the same plan keeps not working several days in a row, it may be a sign that you’re trying to fit the plan rather than the plan fitting you. For someone who plans to run at 7 a.m. but switches off the alarm every morning, the real question may not be “Why can’t I do this?” but “Does this time actually work for me?”" },
        { id: "b3-p11", type: "p", text: "When you change a plan, you can look at three things: the time, the place and the size of the step. Changing just one is often enough. Evening instead of morning, the library instead of home, ten minutes instead of half an hour. The goal can stay the same; only the path to it changes." },
        { id: "b3-p12", type: "p", text: "While you make these changes, it can help to see yourself as someone running an experiment. Experiments don’t always give the expected result; that doesn’t mean the person running them has failed, it just shows what to change in the next attempt." },

        { id: "b3-h4", type: "h", text: "Two questions in the evening" },
        { id: "b3-p7", type: "p", text: "At the end of the day, instead of counting how much of your plan actually happened, try asking two questions: What worked today? What could I make easier tomorrow? The first helps you notice what’s working. The second adjusts tomorrow’s plan a little, based on today’s experience." },
        { id: "b3-p8", type: "p", text: "The answers can be small: “Putting my phone in another room helped.” “I’ll pack my bag the night before.” This is how plans come to fit your life: through small adjustments, day by day." },
        { id: "b3-p9", type: "p", text: "That Thursday evening, Sam opened the assignment file and wrote a single sentence for the second section. Then Sam went to bed. The next morning, when Sam opened the file, there was a sentence waiting instead of a blank page." },

        {
          id: "b3-uygulama",
          type: "exercise",
          title: "A small seven-day trial",
          planner: "habit",
          steps: [
            "Choose one habit you’d like to try.",
            "Write down the smallest workable way to start: small enough that you could do it even on a bad day.",
            "Tie it to a moment that already happens in your day, and decide where you’ll do it.",
            "Add a smaller option for hard days.",
            "For seven days, each evening, just mark one of these: I did it, I did a smaller version, or I didn’t do it. Then take another look at your plan.",
          ],
        },

        {
          id: "b3-ozet",
          type: "summary",
          text: "When a plan falls apart, instead of dropping it, you can often shift its time or shrink its step; and missing a day doesn’t mean the road has ended.",
        },
      ],
      sources: ["lally2010"],
    },

    {
      id: "kapanis",
      kind: "outro",
      title: "Closing",
      minutes: 2,
      available: true,
      blocks: [
        { id: "k1", type: "p", text: "This book had three small ideas: put what’s on your mind somewhere outside your head, choose one main task for today along with its first step, and let your plan change when your day does." },
        { id: "k2", type: "p", text: "None of these will make every day easy. Some days the list will stay long, the main task won’t move, the trial will stumble. That doesn’t mean the method has failed, or that you have. Tomorrow, you can choose a main task again." },
        { id: "k3", type: "p", text: "The planner and the habit section are still here after you finish the book. Some days you might open them just to write down today’s main task; other days you might not open them at all. Your entries are stored only on this device, so remember to make a backup now and then." },
        { id: "k4", type: "p", text: "Small steps don’t solve everything. But on most days, they can be enough to get started." },
      ],
    },
  ],
};

  lang: "de",

    {

      minutes: 2,
      available: true,
      blocks: [
        { id: "g1", type: "p", text: "Dieses kurze Buch ist für alle geschrieben, die versuchen, irgendwie durch den Tag zu kommen. Für alle, die Uni, Job, Haushalt und die endlosen Benachrichtigungen auf dem Handy gleichzeitig tragen und sich abends fragen: „Was habe ich heute eigentlich geschafft?“" },
        { id: "g2", type: "p", text: "Ein großes System findest du hier nicht. Keine farbcodierten Kalender, keine Morgenroutinen mit zwanzig Schritten und kein Versprechen, über Nacht alles zu ändern. Es gibt drei kleine Ideen: das, was dir im Kopf herumgeht, irgendwo ablegen; für heute eine einzige Hauptaufgabe wählen; und den Plan ändern dürfen, wenn sich der Tag ändert." },
        { id: "g3", type: "p", text: "Jedes Kapitel ist kurz genug für eine Busfahrt. Am Ende jedes Kapitels steht eine Übung, die ein paar Minuten dauert. Du kannst sie auf Papier machen oder im Planer dieser App." },
        { id: "g4", type: "p", text: "Ab und zu erwähne ich Studien. Lies sie bitte nicht als „Die Wissenschaft hat bewiesen …“, sondern als „Bei bestimmten Menschen, unter bestimmten Bedingungen hat man Folgendes beobachtet“. Was die Forschung sagt und was ich vorschlage, siehst du in getrennten Kästen. Zu wissen, was was ist, macht es leichter zu entscheiden, was du in dein eigenes Leben übernimmst." },
      ],

    {
      id: "bolum-1",
      kind: "chapter",
      number: 1,
      title: "Du musst nicht alles im Kopf behalten",
      minutes: 7,
      available: true,
      blocks: [
        {
          id: "b1-sahne",
          type: "scene",
          paragraphs: [
            "8:10 Uhr morgens. Lena steht in der U-Bahn an der Tür. Mit einer Hand hält sie sich an der Stange fest, mit der anderen scrollt sie auf dem Handy durch ihre E-Mails.",
            "Die Gedanken kommen nicht der Reihe nach. Die Hausarbeit, die am Freitag fällig ist. Die Nachricht an den Vermieter wegen der Miete. Das Rücksendepaket, das zur Post muss. Mamas Geburtstag nächste Woche. Das halb ausgefüllte Formular für die Praktikumsbewerbung. Und gestern Abend hatte sie einer Freundin gesagt: „Ich ruf dich morgen an.“ Wann eigentlich?",
            "Als die Bahn in die Station einfährt, meldet sich ein vertrautes Gefühl: Ich vergesse doch etwas – aber was? Der Tag hat noch nicht mal angefangen, und sie ist schon müde.",
          ],
        },

        { id: "b1-h1", type: "h", text: "Der Kopf erinnert gut, aber er lagert schlecht" },
        { id: "b1-p1", type: "p", text: "Lenas Problem ist weder Faulheit noch Chaos. Das Problem ist, dass alle Aufgaben gleichzeitig am selben Ort liegen: in ihrem Kopf." },
        { id: "b1-p2", type: "p", text: "Eine unerledigte Aufgabe meldet sich immer wieder, solange sie nirgends notiert ist. In der Vorlesung fällt dir das Rücksendepaket ein, beim Essen die Hausarbeit. Manchmal sind diese Erinnerungen nützlich. Aber sie suchen sich weder Reihenfolge noch Zeitpunkt aus. Eine wichtige und eine unwichtige Aufgabe rufen gleich laut." },
        { id: "b1-p3", type: "p", text: "Am Ende hast du zwanzig halbe Gedanken und kannst keinen davon zu Ende denken. Das könnte ein Grund sein, warum man sich den ganzen Tag beschäftigt fühlt und abends trotzdem das Gefühl hat, nichts geschafft zu haben." },

        {
          id: "b1-arastirma-1",
          type: "research",
          finding: "In einer Reihe von Experimenten schweiften Teilnehmende, die an ein unerledigtes Ziel erinnert worden waren, während einer Lesetätigkeit, die damit nichts zu tun hatte, häufiger zu diesem Ziel ab. Durften sie für dasselbe Ziel einen konkreten Plan machen, verschwand dieser Effekt.",
          limits: "Die Experimente fanden im Labor statt, überwiegend mit Studierenden. Im Alltag muss sich bei allen nicht dasselbe Ergebnis zeigen.",
          details: "Laut den Forschenden machte nicht das bloße Erinnern an die Aufgabe den Unterschied, sondern ein konkreter Plan dafür. In diesem Buch ist das Aufschreiben der erste Schritt; der Plan ist Thema des zweiten Kapitels.",
          refs: ["masicampo2011"],
        },

        { id: "b1-h2", type: "h", text: "Wozu das Aufschreiben ganz praktisch gut ist" },
        { id: "b1-p4", type: "p", text: "Aufzuschreiben, was dir im Kopf herumgeht, ist kein Versprechen, das alles auch zu erledigen. Es ist eher so, als würdest du es irgendwo parken. Wenn dein Auto auf dem Parkplatz steht, musst du nicht ständig daran denken; es reicht zu wissen, wo es steht." },
        { id: "b1-p5", type: "p", text: "Eine Liste auf Papier leistet drei ganz konkrete Dinge. Erstens kannst du Aufgaben vergleichen. Im Kopf wirken alle gleich groß; auf dem Papier merkst du, dass manche zwei Minuten dauern und andere zwei Wochen. Zweitens lässt die Sorge nach, etwas zu vergessen, denn das Erinnern übernimmt jetzt das Papier. Drittens fällt der nächste Schritt leichter: die Entscheidung, was du dir für heute aussuchst." },

        {
          id: "b1-gorsel",
          type: "figure",
          art: "thoughtsToPaper",
          alt: "Links kurze, ineinander verknäuelte Linien und Kringel in verschiedenen Größen; von der Mitte führt ein Pfeil zu einem Blatt Papier rechts mit ordentlichen Zeilen. Auf dem Blatt stehen einige Zeilen, neben einer davon ein kleines Häkchen.",
          caption: "Im Kopf verheddert sich alles. Auf dem Papier stellen sich dieselben Aufgaben in eine Reihe und lassen sich vergleichen.",
        },

        {
          id: "b1-arastirma-2",
          type: "research",
          finding: "In einer Studie in einem Schlaflabor schliefen junge Erwachsene, die vor dem Zubettgehen fünf Minuten lang aufschrieben, was sie in den nächsten Tagen erledigen wollten, im Durchschnitt schneller ein als diejenigen, die aufschrieben, was sie in den letzten Tagen erledigt hatten.",
          limits: "Eine einzige Nacht, eine kleine Gruppe von 57 Personen ohne Schlafprobleme. Das zeigt nicht, dass Schreiben jedem beim Schlafen hilft.",
          details: "Wer seine Aufgaben ausführlicher aufschrieb, schlief ebenfalls schneller ein. Dieser Befund ist als Hinweis zu lesen, dass es entlasten kann, die Liste vom Kopf aufs Papier zu bringen – nicht als sicheres Ergebnis.",
          refs: ["scullin2018"],
        },

        { id: "b1-h3", type: "h", text: "Du musst nicht dein ganzes Leben ordnen" },
        { id: "b1-p6", type: "p", text: "An dieser Stelle denkt man meistens zuerst an einen großen Aufräumtag: eine neue App herunterladen, alles in Kategorien einteilen, Farben, Labels, Prioritätsstufen. Eine Woche später ist das System selbst eine weitere Aufgabe, die gepflegt werden will." },
        { id: "b1-p7", type: "p", text: "Das brauchst du nicht. In diesem Kapitel tust du nur eins: ein paar Minuten lang rausholen, was dir im Kopf herumgeht. Kein Sortieren, kein Ordnen, kein Plan. Dazu kommen wir im zweiten Kapitel, und auch dort wählen wir nur eine einzige Aufgabe aus, nicht zwanzig." },

        {
          id: "b1-oneri",
          type: "suggestion",
          text: "Führe die Liste an einem einzigen Ort. Wenn du heute in die Notizen-App schreibst, morgen auf einen Zettel und übermorgen in einen Nachrichtenentwurf, versucht dein Kopf als Nächstes, sich zu merken, wo die Listen sind. Welcher Ort es ist, ist egal; wichtig ist, dass es immer derselbe ist.",
        },

        { id: "b1-p8", type: "p", text: "Und noch etwas, das dir helfen kann: Deine Liste wird unordentlich aussehen. „Mama anrufen“ steht direkt über „Überlegen, was ich nach dem Abschluss mache“. Das ist normal. Die Liste ist nicht dazu da, ordentlich zu sein, sondern um sichtbar zu machen, was dich im Kopf belastet." },
        { id: "b1-h4", type: "h", text: "Und wenn die Liste lang wird?" },
        { id: "b1-p10", type: "p", text: "Viele, die zum ersten Mal alles aufschreiben, schrecken beim Blick auf die fertige Liste kurz zurück. Fünfzehn, zwanzig Zeilen. „So viel habe ich zu tun?“ Dabei waren diese Aufgaben die ganze Zeit schon da; jetzt kann man sie nur zählen." },
        { id: "b1-p11", type: "p", text: "Eine lange Liste heißt nicht, dass du alles heute erledigen musst. Manche Zeilen sind mit einer Nachricht erledigt, manche sind Themen, die dich monatelang begleiten, und manche sind eigentlich gar keine Aufgabe, sondern eine Sorge: „Finde ich überhaupt ein Praktikum?“ Um das auseinanderzuhalten, musst du gerade nichts tun. Schon zu sehen, dass nicht alles von derselben Art ist, kann die Last ein bisschen leichter machen." },
        { id: "b1-p12", type: "p", text: "Beim Schreiben fallen dir vielleicht auch Dinge ein, die du nicht aufschreiben willst. Du musst nicht alles aufschreiben. Diese Liste bekommt niemand zu sehen; sie soll dich nicht prüfen, sondern in deinem Kopf ein bisschen Platz schaffen." },
        { id: "b1-p13", type: "p", text: "Vielleicht fällt dir auch auf, dass manche Aufgaben kleiner werden, sobald sie aufgeschrieben sind. „Nachricht an den Vermieter“ wirkt im Kopf wie ein großes Gespräch und wird auf dem Papier zu einer Nachricht mit zwei Sätzen. Das passiert nicht bei jeder Aufgabe, aber wenn es passiert, tut es gut." },
        { id: "b1-p9", type: "p", text: "Als Lena an diesem Morgen aus der U-Bahn stieg, schrieb sie drei Minuten lang alles in ihre Handy-Notizen, was ihr einfiel. Es wurden vierzehn Zeilen. Nichts davon erledigte sie sofort. Aber als sie sah, dass sie ihre Freundin in der Mittagspause anrufen und das Rücksendepaket auf dem Heimweg zur Post bringen würde, wurde der Rest ein bisschen leiser." },

        {
          id: "b1-uygulama",
          type: "exercise",
          title: "Drei Minuten Kopf leeren",
          planner: "brain",
          timerSeconds: 180,
          steps: [
            "Stell dir einen Timer auf drei Minuten. Du kannst auch den Button unten verwenden.",
            "Schreib jede Aufgabe auf, die dir einfällt, kurz und ohne Reihenfolge. Unterscheide nicht zwischen groß und klein: „Nachricht wegen Miete“, „Hausarbeit“, „Zahnarzttermin“.",
            "Formuliere keine Sätze, die mit „Ich muss …“ anfangen; der Name der Aufgabe reicht.",
            "Hör auf, wenn der Timer abläuft. Die Liste darf unvollständig bleiben; was fehlt, kannst du später ergänzen.",
            "Mit der Liste musst du jetzt noch nichts machen. Es reicht zu wissen, dass sie da ist.",
          ],
        },

        {
          id: "b1-ozet",
          type: "summary",
          text: "Wenn du aufschreibst, was dir im Kopf herumgeht, musst du es nicht sofort erledigen – du hörst nur auf, alles gleichzeitig mit dir herumzutragen.",
        },
      ],
      sources: ["masicampo2011", "scullin2018"],
    },

    {
      id: "bolum-2",
      kind: "chapter",
      number: 2,
      title: "Gib dem Tag eine Hauptaufgabe",
      minutes: 7,
      available: true,
      blocks: [
        {
          id: "b2-sahne",
          type: "scene",
          paragraphs: [
            "Dienstagmorgen, 10:00 Uhr. Lena sitzt in der Bibliothek am Tisch beim Fenster. Vor ihr liegt die Liste von gestern: vierzehn Zeilen.",
            "Zuerst öffnet sie die Datei mit der Hausarbeit. Ein paar Minuten später fällt ihr die Frist für das Praktikumsformular ein, und sie öffnet das Formular. Während sie das geforderte Dokument sucht, kommt ihr der Gedanke, nachzusehen, bis wann das Paket zurückgeschickt werden muss. Dann geht sie wieder zur Hausarbeit.",
            "Gegen Mittag sind sieben Tabs offen. Nichts davon ist fertig. Lena weiß, dass sie den ganzen Vormittag gearbeitet hat, aber sie hat nichts, was sie vorzeigen könnte.",
          ],
        },

        { id: "b2-h1", type: "h", text: "Eine Liste ist noch kein Plan" },
        { id: "b2-p1", type: "p", text: "Im ersten Kapitel hast du aufgeschrieben, was dir im Kopf herumgeht. Das nimmt Last von dir, sagt dir aber nicht, womit du heute anfangen sollst. Eine Liste ist eine Bestandsaufnahme. Wer auf vierzehn Zeilen gleichzeitig schaut, fängt leicht an zu glauben, dass jede dringender ist als die andere." },
        { id: "b2-p2", type: "p", text: "Genau so lief Lenas Vormittag. Jede Aufgabe war berechtigt, jeder Wechsel ergab Sinn. Aber bei jedem Hin und Her musste sie sich erst wieder erinnern, wo sie stehen geblieben war. Der Tag füllte sich mit halben Anfängen." },
        { id: "b2-p3", type: "p", text: "Was ich in diesem Kapitel vorschlage, ist einfach: Such dir für jeden Tag eine Hauptaufgabe aus. Es muss nicht die wichtigste Aufgabe deines Lebens sein. Der Maßstab ist: Wärst du am Abend erleichtert, wenn diese Aufgabe erledigt oder ein Stück vorangekommen ist? Wenn ja, ist sie die Hauptaufgabe für heute." },
        { id: "b2-p4", type: "p", text: "Die anderen Aufgaben verschwinden nicht; sie warten auf der Liste. Eine Hauptaufgabe zu wählen heißt nicht, auf die anderen zu verzichten, sondern zu entscheiden, dich später um sie zu kümmern." },

        { id: "b2-h5", type: "h", text: "Wenn die Wahl schwerfällt" },
        { id: "b2-p12", type: "p", text: "An manchen Morgen wirken zwei oder drei Aufgaben gleich dringend. An solchen Tagen können ein paar Fragen die Wahl erleichtern. Welche hat die nähere Frist? Welche hält andere Dinge auf, wenn sie nicht fertig wird? Bei welcher spürst du mehr Druck auf der Brust, wenn du an sie denkst?" },
        { id: "b2-p13", type: "p", text: "Nicht immer gibt es auf diese Fragen eine klare Antwort. Dann kann sogar eine Münze besser sein, als gar nicht zu wählen. Die „falsche“ Hauptaufgabe zu wählen ist oft weniger anstrengend, als den ganzen Tag zwischen drei Aufgaben hin- und herzuspringen; denn so kommt wenigstens eine voran." },
        { id: "b2-p14", type: "p", text: "Und noch etwas: Die Hauptaufgabe muss nicht jeden Tag groß sein. An einem Tag, an dem du müde bist, gerade eine Prüfung hinter dir hast oder krank bist, kann die Hauptaufgabe „Wäsche waschen“ sein. Die Hauptaufgabe richtet sich danach, was der Tag hergibt – nicht danach, was die Person schaffen würde, die du gern wärst." },

        { id: "b2-h2", type: "h", text: "Aus der Hauptaufgabe einen kleinen Schritt machen" },
        { id: "b2-p5", type: "p", text: "„Hausarbeit schreiben“ kann eine gute Hauptaufgabe sein, ist aber ein schlechter Anfang. Sie ist zu groß; du weißt nicht, wo du sie anpacken sollst. Was den Anfang erleichtert, ist der erste kleine Schritt: eine Handlung, so konkret, dass sie in ein paar Minuten erledigt ist." },
        { id: "b2-p6", type: "p", text: "Ein paar Beispiele: statt „Hausarbeit schreiben“ lieber „Die Datei öffnen und drei Überschriften notieren“. Statt „Praktikumsbewerbung“ lieber „Das fehlende Dokument für das Formular suchen und in den Ordner legen“. Statt „Mit dem Vermieter reden“ lieber „Den ersten Satz der Nachricht wegen der Miete schreiben“." },
        { id: "b2-p7", type: "p", text: "Der erste Schritt soll die Aufgabe nicht erledigen, sondern dich in sie hineinbringen. Manchmal machst du nach dem ersten Schritt weiter, manchmal nicht. Beides ist in Ordnung. Aber es ist ein Unterschied, ob du vor einer leeren Seite wartest oder zu einer Seite zurückkommst, auf der schon drei Überschriften stehen." },

        {
          id: "b2-gorsel",
          type: "figure",
          art: "smallSteps",
          alt: "Links ein großer Kasten mit einigen Zeilen darin; ein Pfeil führt zu vier kleinen Stufen, die nach rechts ansteigen. Auf der ersten und niedrigsten Stufe liegt ein orangefarbener Punkt.",
          caption: "Über eine große Aufgabe springt man nicht in einem Satz. Die erste Stufe sollte so niedrig sein, dass du sie heute nehmen kannst.",
        },

        { id: "b2-h3", type: "h", text: "Wann und wo?" },
        { id: "b2-p8", type: "p", text: "Wenn du den ersten Schritt gewählt hast, bleibt noch eine Frage: Wann und wo wirst du ihn machen? „Irgendwann heute“ rutscht oft ans Ende des Tages. „Nach dem Mittagessen, im oberen Stock der Bibliothek“ steht dagegen in deinem Kopf wie ein Termin." },

        {
          id: "b2-arastirma-1",
          type: "research",
          finding: "Pläne, die der Psychologe Peter Gollwitzer „Durchführungsintentionen“ (implementation intentions) nennt, legen im Voraus fest, wann, wo und wie man ein Ziel umsetzt: „Wenn Situation X eintritt, dann tue ich Y.“ In einer Metaanalyse, die 94 unabhängige Tests zusammenfasste, erreichten Teilnehmende, die solche Pläne machten, ihre Ziele im Durchschnitt deutlich häufiger als diejenigen, die sich nur ein Ziel gesetzt hatten.",
          limits: "Die Größe des Effekts schwankte zwischen den Studien, und ein Teil der Untersuchungen fand im Labor oder mit Studierenden statt. Ein durchschnittlicher Effekt zeigt nicht, dass der Plan bei allen und für jede Aufgabe funktioniert.",
          details: "Laut den Forschenden erleichtern solche Pläne den Start, weil die Entscheidung „Wann fange ich an?“ schon vorher getroffen ist und man im entscheidenden Moment einfach loslegen kann. In diesem Buch beruht der Bereich „Meine Startzeit festlegen“ in „Mein Tag“ auf dieser Idee.",
          refs: ["gollwitzer1999", "gollwitzer2006"],
        },

        {
          id: "b2-oneri",
          type: "suggestion",
          text: "Versuch, den Zeitpunkt nicht an eine Uhrzeit zu knüpfen, sondern an einen Moment, den es in deinem Tag sowieso gibt: „Nach der ersten Vorlesung“, „Wenn ich mir Kaffee eingeschenkt habe“, „Wenn ich nach Hause komme und die Tasche abstelle“. Uhrzeiten verschieben sich; solche Momente kommen an den meisten Tagen trotzdem.",
        },

        { id: "b2-h4", type: "h", text: "Nebenaufgaben und was auf morgen wartet" },
        { id: "b2-p9", type: "p", text: "Neben der Hauptaufgabe gibt es im Laufe des Tages auch kleinere Dinge zu erledigen. In „Mein Tag“ ist dafür nur Platz für zwei. Das wirkt vielleicht wie eine Einschränkung; eigentlich ist es ein Maß. Wenn du mehr als zwei Zeilen brauchst, ist der Tag vielleicht ohnehin schon voll, und es ist ganz natürlich, dass manches auf morgen wartet." },
        { id: "b2-p10", type: "p", text: "Eine Aufgabe, die auf morgen wartet, ist kein Scheitern, sondern eine Entscheidung. Dass sie auf der Liste bleibt, heißt, dass sie nicht vergessen ist." },
        { id: "b2-p11", type: "p", text: "An diesem Tag schloss Lena nach dem Mittagessen alle Tabs. Ihre Hauptaufgabe war die Hausarbeit; der erste Schritt: die Datei öffnen und drei Überschriften notieren. Sie setzte sich oben an einen freien Tisch. Die Überschriften dauerten zehn Minuten. Danach schrieb sie unter die erste Überschrift noch ein paar Absätze. Das Praktikumsformular und das Paket wurden zu den Nebenaufgaben für den nächsten Tag." },

        {
          id: "b2-uygulama",
          type: "exercise",
          title: "Die Hauptaufgabe für heute",
          planner: "main",
          steps: [
            "Schau auf deine Liste und frag dich: Bei welcher Aufgabe wäre ich heute Abend erleichtert, wenn sie vorangekommen ist?",
            "Schreib diese Aufgabe als Hauptaufgabe für heute auf.",
            "Schreib darunter den ersten kleinen Schritt, mit dem du in ein paar Minuten anfangen kannst.",
            "Wenn du magst, ergänze, wann und wo du anfängst, zum Beispiel: „Nach dem Mittagessen, an meinem Schreibtisch“.",
            "Alles andere kann auf der Liste warten. Für heute reicht das.",
          ],
        },

        {
          id: "b2-ozet",
          type: "summary",
          text: "Eine einzige Hauptaufgabe für heute und ein kleiner erster Schritt dazu sind meistens leichter als der Versuch, mit einem Blick auf eine lange Liste anzufangen.",
        },
      ],
      sources: ["gollwitzer1999", "gollwitzer2006"],
    },

    {
      id: "bolum-3",
      kind: "chapter",
      number: 3,
      title: "Pass deinen Plan an dein Leben an",
      minutes: 7,
      available: true,
      blocks: [
        {
          id: "b3-sahne",
          type: "scene",
          paragraphs: [
            "Donnerstag. Lenas Plan stand fest: nach dem Mittagessen in der Bibliothek den zweiten Teil der Hausarbeit schreiben.",
            "Aber das Gruppentreffen zog sich in die Länge. Beim Rausgehen fing es an zu regnen. Als sie zu Hause ankam, war es schon nach sechs; sie war nass, müde und ein bisschen gereizt.",
            "Der Satz in ihrem Kopf war ihr vertraut: „Heute ist eh schon alles im Eimer. Morgen fange ich richtig an.“",
          ],
        },

        { id: "b3-h1", type: "h", text: "Wenn der Plan nicht aufgeht" },
        { id: "b3-p1", type: "p", text: "Ein Plan vom Morgen ist eine Schätzung, wie der Tag laufen wird. Besprechungen ziehen sich, Busse kommen zu spät, die Energie ist früher aufgebraucht als gedacht. Dass ein Plan nicht aufgeht, ist kein Fehler der Person, die ihn gemacht hat; so sind Schätzungen eben." },
        { id: "b3-p2", type: "p", text: "Das Problem ist oft nicht der geplatzte Plan, sondern das „Alles oder nichts“-Denken, das danach kommt. Wenn sich der Plan nicht genau so umsetzen lässt, fühlt es sich an, als ginge gar nichts. Dabei gibt es an den meisten Tagen drei Möglichkeiten." },
        { id: "b3-p3", type: "p", text: "Erstens: die Zeit verschieben. „Am Nachmittag hat es nicht geklappt, also eine halbe Stunde nach dem Abendessen.“ Zweitens: den Schritt verkleinern. „Den zweiten Teil schaffe ich nicht, aber ich kann meine Notizen einmal durchlesen.“ Drittens: bewusst verschieben. „Heute mache ich es nicht; morgen früh ist es das Erste.“ Alle drei sind Entscheidungen. Ein verlorener Tag ist ein Tag, an dem keine Entscheidung fällt." },

        { id: "b3-h2", type: "h", text: "Eine kleinere Variante für schwere Tage" },
        { id: "b3-p4", type: "p", text: "An einem guten Tag ist der erste Schritt leicht. Auf die Probe gestellt wird ein Plan an den schweren Tagen. Deshalb kann es helfen, vorher eine „kleinere Variante“ festzulegen: eine Notlösung, so klein, dass du sie auch an einem schlechten Tag schaffst." },
        { id: "b3-p5", type: "p", text: "Bei der Hausarbeit kann das heißen, die Datei zu öffnen und einen einzigen Satz zu schreiben. Beim Spazierengehen: vor die Tür gehen und fünf Minuten um den Block laufen. Beim Lesen: eine Seite. Die kleine Variante ist nicht dafür da, dass die Aufgabe als erledigt gilt, sondern dafür, dass der Faden nicht reißt." },

        {
          id: "b3-gorsel",
          type: "figure",
          art: "flexiblePlan",
          alt: "Ein gestrichelter Weg verläuft von links nach rechts und biegt in der Mitte um ein Hindernis herum. Darunter sieben kleine Quadrate; die meisten sind gefüllt, eines ist leer, neben dem letzten ein orangefarbener Punkt.",
          caption: "Ein Plan kann um ein Hindernis herumführen. Eine Lücke an einem von sieben Tagen heißt nicht, dass der Weg zu Ende ist.",
        },

        { id: "b3-h3", type: "h", text: "Einen Tag auslassen" },
        { id: "b3-p6", type: "p", text: "Wer eine neue Gewohnheit ausprobiert und einen Tag auslässt, hat oft das Gefühl, wieder ganz von vorn anfangen zu müssen. Serienzähler verstärken dieses Gefühl noch: Eine Kette von dreißig Tagen steht an einem einzigen Tag wieder auf null." },

        {
          id: "b3-arastirma-1",
          type: "research",
          finding: "In einer Studie in London wählten 96 Freiwillige ein Ess-, Trink- oder Bewegungsverhalten, das sie jeden Tag in derselben Situation ausführen wollten, und schätzten 12 Wochen lang täglich selbst ein, wie automatisch dieses Verhalten geworden war. Eine einzelne verpasste Gelegenheit beeinträchtigte die Gewohnheitsbildung nicht nennenswert. Bis das Verhalten nahezu automatisch ablief, dauerte es von Person zu Person sehr unterschiedlich lange: zwischen 18 und 254 Tagen.",
          limits: "Eine kleine Gruppe von Freiwilligen und einfache Alltagshandlungen. Die Automatik wurde über die Selbsteinschätzung der Teilnehmenden gemessen, und die Daten einiger Teilnehmender passten nicht gut zum Modell. Bei komplexeren Verhaltensweisen können die Ergebnisse anders ausfallen.",
          details: "Der Median lag in der Studie bei 66 Tagen; das ist aber weder ein Durchschnitt noch ein Ziel. Der Befund legt nahe, dass feste Zeiträume wie „In 21 Tagen zur Gewohnheit“ nicht für alle passen und dass ein gelegentlich verpasster Tag den Prozess nicht auf null setzt.",
          refs: ["lally2010"],
        },

        {
          id: "b3-oneri",
          type: "suggestion",
          text: "Wenn du eine Gewohnheit ausprobierst, mach zuerst einen kurzen Versuch über sieben Tage. Es geht nicht darum, in sieben Tagen eine Gewohnheit aufzubauen, sondern herauszufinden, ob die Zeit, der Ort und der Schritt, die du gewählt hast, zu dir passen. Den Plan nach den sieben Tagen zu ändern, gehört zum Versuch dazu.",
        },

        { id: "b3-h5", type: "h", text: "Wenn der Plan nicht zu dir passt" },
        { id: "b3-p10", type: "p", text: "Manchmal liegt es nicht an einem einzelnen schlechten Tag. Wenn derselbe Plan mehrere Tage hintereinander nicht klappt, kann das ein Zeichen sein, dass nicht der Plan sich nach dir richtet, sondern du dich nach dem Plan. Wer sich vornimmt, um sieben Uhr morgens laufen zu gehen, aber jeden Morgen den Wecker ausmacht, für den lautet die eigentliche Frage vielleicht nicht „Warum schaffe ich das nicht?“, sondern „Passt diese Uhrzeit wirklich zu mir?“" },
        { id: "b3-p11", type: "p", text: "Wenn du den Plan änderst, kannst du auf drei Dinge schauen: die Zeit, den Ort und die Größe des Schritts. Oft reicht es, eins davon zu ändern. Abends statt morgens, Bibliothek statt Zuhause, zehn Minuten statt einer halben Stunde. Das Ziel kann gleich bleiben; nur der Weg dorthin ändert sich." },
        { id: "b3-p12", type: "p", text: "Bei solchen Änderungen kann es helfen, dich selbst wie jemanden zu sehen, der ein Experiment durchführt. Experimente liefern nicht immer das erwartete Ergebnis; das heißt nicht, dass die Person, die sie durchführt, gescheitert ist, sondern nur, was sie beim nächsten Versuch ändern kann." },

        { id: "b3-h4", type: "h", text: "Zwei Fragen am Abend" },
        { id: "b3-p7", type: "p", text: "Statt am Ende des Tages zu zählen, wie viel vom Plan geklappt hat, versuch es mit zwei Fragen: Was hat heute geholfen? Was kann ich mir für morgen leichter machen? Die erste lässt dich bemerken, was funktioniert. Die zweite passt den Plan für morgen ein wenig an das an, was du heute erlebt hast." },
        { id: "b3-p8", type: "p", text: "Die Antworten dürfen klein sein: „Das Handy in ein anderes Zimmer zu legen hat geholfen.“ „Morgen packe ich meine Tasche schon am Abend vorher.“ So passen sich Pläne nach und nach dem Leben an, mit kleinen Korrekturen von Tag zu Tag." },
        { id: "b3-p9", type: "p", text: "An diesem Donnerstagabend öffnete Lena die Datei mit der Hausarbeit und schrieb einen einzigen Satz für den zweiten Teil. Dann ging sie schlafen. Als sie die Datei am nächsten Morgen öffnete, wartete statt einer leeren Seite ein Satz auf sie." },

        {
          id: "b3-uygulama",
          type: "exercise",
          title: "Ein kleiner Versuch über sieben Tage",
          planner: "habit",
          steps: [
            "Such dir eine einzige Gewohnheit aus, die du ausprobieren möchtest.",
            "Schreib den kleinsten machbaren Anfang auf: so klein, dass du ihn auch an einem schlechten Tag schaffst.",
            "Knüpf ihn an einen Moment, den es in deinem Tag sowieso gibt, und leg fest, wo du ihn machst.",
            "Ergänze eine kleinere Variante für schwere Tage.",
            "Markiere sieben Tage lang jeden Abend nur: gemacht, kleinere Variante gemacht oder nicht gemacht. Schau dir danach deinen Plan noch einmal an.",
          ],
        },

        {
          id: "b3-ozet",
          type: "summary",
          text: "Wenn ein Plan nicht aufgeht, kannst du ihn meistens zeitlich verschieben oder den Schritt verkleinern, statt ihn aufzugeben – und ein verpasster Tag heißt nicht, dass der Weg zu Ende ist.",
        },
      ],
      sources: ["lally2010"],
    },

    {
      id: "kapanis",
      kind: "outro",
      title: "Zum Schluss",
      minutes: 2,
      available: true,
      blocks: [
        { id: "k1", type: "p", text: "In diesem Buch ging es um drei kleine Ideen: das, was dir im Kopf herumgeht, irgendwo ablegen; für heute eine einzige Hauptaufgabe und ihren ersten Schritt wählen; und den Plan ändern dürfen, wenn sich der Tag ändert." },

        { id: "b3-p3", type: "p", text: "La première : décaler le moment. « Cet après-midi, ça n’a pas marché ; une demi-heure après le dîner. » La deuxième : réduire le pas. « Je ne peux pas écrire la deuxième partie, mais je peux relire mes notes une fois. » La troisième : reporter en connaissance de cause. « Aujourd’hui, je ne le fais pas ; demain matin, c’est la première chose que je fais. » Ce sont trois décisions. La journée perdue, elle, c’est celle où l’on ne décide rien." },

        { id: "b3-p4", type: "p", text: "Un jour où tout va bien, le premier pas est facile. C’est dans les jours difficiles que le plan est vraiment mis à l’épreuve. C’est pourquoi il peut être utile de prévoir à l’avance une « option plus petite » : une solution de secours assez petite pour que tu puisses la faire même un mauvais jour." },
        { id: "b3-p5", type: "p", text: "Pour le devoir, ce peut être ouvrir le fichier et écrire une seule phrase. Pour la marche, sortir devant chez toi et faire un tour de cinq minutes. Pour la lecture, une page. L’option plus petite n’est pas là pour que la tâche compte comme faite, mais pour ne pas perdre le lien avec elle." },

        {
          id: "b3-arastirma-1",
          type: "research",

          id: "b3-oneri",

          text: "Quand tu essaies une habitude, commence par un court essai de sept jours. Le but n’est pas d’acquérir l’habitude en sept jours ; c’est de voir si le moment, le lieu et le pas que tu as choisis te conviennent. Modifier le plan au bout des sept jours fait partie de l’essai.",

        { id: "b3-h5", type: "h", text: "Si le plan ne te convient pas" },
        { id: "b3-p10", type: "p", text: "Parfois, le problème n’est pas un seul mauvais jour. Si le même plan ne tient pas plusieurs jours de suite, c’est peut-être le signe que ce n’est pas le plan qui s’adapte à toi, mais toi qui essaies de t’adapter au plan. Pour quelqu’un qui prévoit d’aller courir à 7 h mais qui éteint son réveil tous les matins, la vraie question n’est peut-être pas « Pourquoi je n’y arrive pas ? », mais « Est-ce que cette heure me convient vraiment ? »" },
        { id: "b3-p11", type: "p", text: "Pour modifier ton plan, tu peux regarder trois choses : le moment, le lieu et la taille du pas. Souvent, en changer une seule suffit. Le soir au lieu du matin, la bibliothèque au lieu de la maison, dix minutes au lieu d’une demi-heure. L’objectif peut rester le même ; seul le chemin pour y arriver change." },
        { id: "b3-p12", type: "p", text: "En faisant ces changements, il peut être utile de te voir comme quelqu’un qui mène une expérience. Une expérience ne donne pas toujours le résultat attendu ; cela ne veut pas dire que la personne qui la mène a échoué, seulement que cela montre ce qu’il faut changer au prochain essai." },

        { id: "b3-h4", type: "h", text: "Deux questions le soir" },
        { id: "b3-p7", type: "p", text: "En fin de journée, au lieu de compter quelle part de ton plan s’est réalisée, essaie de te poser deux questions : qu’est-ce qui a marché aujourd’hui ? Qu’est-ce que je peux me faciliter pour demain ? La première t’aide à remarquer ce qui fonctionne. La seconde ajuste un peu le plan du lendemain en fonction de ce que tu as vécu aujourd’hui." },
        { id: "b3-p8", type: "p", text: "Les réponses peuvent être toutes petites : « Mettre le téléphone dans une autre pièce, ça a marché. » « Demain, je prépare mon sac la veille. » C’est comme ça que les plans s’adaptent à la vie, par de petits ajustements, jour après jour." },
        { id: "b3-p9", type: "p", text: "Ce jeudi soir-là, Camille a ouvert le fichier de son devoir et a écrit une seule phrase pour la deuxième partie. Puis elle est allée se coucher. Le lendemain matin, en ouvrant le fichier, ce n’est pas une page blanche qui l’attendait, mais une phrase." },

        { id: "g1", type: "p", text: "Este libro breve está escrito para quien intenta sacar el día adelante. Para quien carga a la vez con las clases, el trabajo, la casa y las notificaciones interminables del móvil, y al llegar la noche se pregunta: “¿Pero qué he hecho hoy?”." },
        { id: "g2", type: "p", text: "Aquí no vas a encontrar un gran sistema. No hay agendas con códigos de colores, ni rutinas matutinas de veinte pasos, ni la promesa de cambiarlo todo de la noche a la mañana. Hay tres ideas pequeñas: dejar en algún sitio lo que tienes en la cabeza, elegir una sola tarea principal para hoy y poder cambiar el plan cuando cambia el día." },
        { id: "g3", type: "p", text: "Cada capítulo es lo bastante corto como para leerlo en un trayecto en autobús. Al final de cada uno hay un ejercicio de pocos minutos. Puedes hacerlo en papel o en el planificador de esta aplicación, como prefieras." },
        { id: "g4", type: "p", text: "De vez en cuando hablaré de investigaciones. Me gustaría que no las leyeras como “la ciencia lo ha demostrado”, sino como “con ciertas personas, en ciertas condiciones, se observó esto”. Lo que dice la investigación y lo que te sugiero yo aparecerán en recuadros distintos. Saber cuál es cuál te ayudará a decidir qué quieres llevarte a tu propia vida." },

    {
      id: "bolum-1",
      kind: "chapter",
      number: 1,
      title: "No tienes que llevarlo todo en la cabeza",

      available: true,
      blocks: [
        {
          id: "b1-sahne",
          type: "scene",
          paragraphs: [
            "Son las 8:10 de la mañana. Lucía va de pie en el metro, junto a la puerta. Con una mano se agarra a la barra; con la otra revisa el correo en el móvil.",
            "Lo que le pasa por la cabeza no llega en orden. El trabajo que tiene que entregar el viernes. El mensaje que debe escribirle al casero sobre el alquiler. El paquete de devolución que tiene que llevar a la oficina de envíos. El cumpleaños de su madre, la semana que viene. El formulario a medio rellenar de la solicitud de prácticas. Y anoche le dijo a una amiga: “Mañana te llamo”. ¿Cuándo pensaba llamarla?",
            "Mientras el metro se acerca a la estación, aparece una sensación conocida: se me está olvidando algo, pero ¿qué? Y el día ni siquiera ha empezado y ya está cansada.",
          ],
        },

        { id: "b1-h1", type: "h", text: "La mente recuerda bien, pero guarda mal" },
        { id: "b1-p1", type: "p", text: "El problema de Lucía no es la pereza ni el desorden. El problema es que todas sus tareas están a la vez en el mismo lugar: dentro de su cabeza." },
        { id: "b1-p2", type: "p", text: "Una tarea sin terminar, mientras no se anote en algún sitio, vuelve a recordarse de vez en cuando. Te acuerdas del paquete en mitad de una clase y del trabajo mientras comes. A veces estos recordatorios sirven. Pero no eligen ni su orden ni su momento. Una tarea importante y una sin importancia te llaman con la misma voz." },
        { id: "b1-p3", type: "p", text: "Al final tienes veinte pensamientos a medias y no puedes pensar a fondo en ninguno. Esa puede ser una de las razones por las que pasas el día sin parar y, por la noche, tienes la impresión de no haber hecho nada." },

        {

          limits: "Los experimentos se hicieron en laboratorio, sobre todo con estudiantes universitarios. En la vida diaria puede que no tenga el mismo resultado en todo el mundo.",
          details: "Según los investigadores, lo que marcó la diferencia no fue solo recordar la tarea, sino armar un plan concreto para ella. En este libro, escribir es el primer paso; el plan es el tema del segundo capítulo.",

        { id: "b1-h2", type: "h", text: "Para qué sirve escribir" },
        { id: "b1-p4", type: "p", text: "Escribir lo que tienes en la cabeza no es prometer que vas a hacerlo todo. Se parece más a aparcarlo en algún sitio. Mientras el coche está en el aparcamiento, no necesitas seguir pensando en él; te basta con saber dónde está." },
        { id: "b1-p5", type: "p", text: "Una lista en papel cumple tres funciones concretas. La primera: te permite comparar las tareas. En tu cabeza todas parecen del mismo tamaño; al escribirlas, te das cuenta de que unas son de dos minutos y otras de dos semanas. La segunda: reduce el miedo a olvidar, porque ahora el papel se encarga de recordar. La tercera: facilita el siguiente paso, es decir, decidir qué vas a elegir hoy." },

        {

          type: "figure",

        {
