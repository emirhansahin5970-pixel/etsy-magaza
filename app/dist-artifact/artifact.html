          details: "Quienes escribieron sus tareas pendientes con más detalle también se durmieron antes. Este hallazgo debe leerse como una pista de que pasar la lista de la cabeza al papel puede resultar tranquilizador, no como una conclusión definitiva.",
          refs: ["scullin2018"],
        },

        { id: "b1-h3", type: "h", text: "No necesitas organizar toda tu vida" },
        { id: "b1-p6", type: "p", text: "En este punto, lo primero que se le suele ocurrir a uno es hacer una gran limpieza: descargar una aplicación nueva, dividirlo todo en categorías, colores, etiquetas, niveles de prioridad. Una semana después, el sistema se ha convertido en una tarea más que hay que mantener." },
        { id: "b1-p7", type: "p", text: "No hace falta. Lo único que vas a hacer en este capítulo es sacar de tu cabeza, durante unos minutos, lo que tienes dentro. Sin clasificar, sin ordenar, sin planificar. A esa parte llegaremos en el segundo capítulo, y allí también elegiremos una sola tarea, no veinte." },

        {
          id: "b1-oneri",
          type: "suggestion",
          text: "Ten la lista en un solo lugar. Si un día escribes en las notas del móvil, al día siguiente en un papel y al otro en el borrador de un mensaje, tu mente pasará a intentar recordar dónde están las listas. No importa qué lugar sea; importa que sea siempre el mismo.",
        },

        { id: "b1-p8", type: "p", text: "Y algo que te puede venir bien saber: tu lista se va a ver desordenada. “Llamar a mamá” estará justo encima de “Pensar qué hacer después de graduarme”. Es normal. La lista no está para ser ordenada, sino para hacer visible la carga que llevas en la cabeza." },
        { id: "b1-h4", type: "h", text: "¿Y si la lista se alarga?" },
        { id: "b1-p10", type: "p", text: "Mucha gente que lo escribe todo por primera vez se echa un poco atrás al ver la lista que sale. Quince, veinte líneas. “¿De verdad tengo tantas cosas que hacer?”. En realidad, esas tareas ya estaban ahí; solo que ahora se pueden contar." },
        { id: "b1-p11", type: "p", text: "Una lista larga no significa que tengas que hacerlo todo hoy. Algunas líneas son cosa de un mensaje, otras son asuntos que durarán meses y otras, en realidad, no son tareas sino preocupaciones: “¿Encontraré unas prácticas?”. Por ahora no tienes que hacer nada para separarlas. Solo ver que no todas son del mismo tipo ya puede aligerar un poco la carga." },
        { id: "b1-p12", type: "p", text: "Puede que, mientras escribes, se te ocurran cosas que no quieres poner por escrito. No tienes por qué escribirlo todo. Esta lista no se la vas a enseñar a nadie; su propósito no es ponerte a prueba, sino hacerte un poco de sitio en la cabeza." },
        { id: "b1-p13", type: "p", text: "También puede que notes algo: algunas tareas se encogen en cuanto las escribes. “Mensaje al casero”, que en tu cabeza parecía una gran conversación, en el papel se convierte en un mensaje de dos frases. No pasa con todas, pero cuando pasa, sienta bien." },
        { id: "b1-p9", type: "p", text: "Esa mañana, al bajarse del metro, Lucía pasó tres minutos escribiendo en las notas del móvil todo lo que se le ocurría. Le salieron catorce líneas. No hizo ninguna en ese momento. Pero al ver que llamaría a su amiga a la hora de comer y que dejaría el paquete de devolución en la oficina de envíos de camino a casa, el resto se quedó un poco más en silencio." },

        {

            "Primero abre el archivo del trabajo. A los pocos minutos se acuerda del plazo del formulario de prácticas y lo abre. Mientras busca el documento que le piden, se le ocurre mirar cuánto tiempo le queda para devolver el paquete. Luego vuelve al trabajo.",

        { id: "b2-h1", type: "h", text: "Una lista no es un plan" },
        { id: "b2-p1", type: "p", text: "En el primer capítulo escribiste en algún sitio lo que tenías en la cabeza. Eso aligera la carga, pero no te dice por dónde empezar hoy. Una lista es un inventario. Quien mira catorce líneas a la vez puede empezar a pensar que cada una es más urgente que la anterior." },
        { id: "b2-p2", type: "p", text: "Así fue la mañana de Lucía. Cada tarea tenía sentido; cada cambio era lógico. Pero al saltar de una tarea a otra, cada vez tenía que volver a recordar dónde se había quedado. El día se llenó de comienzos a medias." },
        { id: "b2-p3", type: "p", text: "Lo que te propongo en este capítulo es sencillo: elige una tarea principal para cada día. No tiene que ser la tarea más importante de tu vida. La medida es esta: si al llegar la noche esta tarea está terminada o ha avanzado, ¿sentirás alivio? Si la respuesta es sí, esa es la tarea principal de hoy." },
        { id: "b2-p4", type: "p", text: "Las demás tareas no desaparecen; esperan en la lista. Elegir una tarea principal no es renunciar a las demás, sino dejar para más tarde la decisión de cuándo ocuparte de ellas hoy." },

        { id: "b2-h5", type: "h", text: "Cuando cuesta elegir" },
        { id: "b2-p12", type: "p", text: "Algunas mañanas, dos o tres tareas parecen igual de urgentes. Esos días hay unas cuantas preguntas que pueden ayudarte a elegir. ¿Cuál tiene la fecha límite más cercana? ¿Cuál, si no se termina, deja otras tareas en espera? ¿Cuál te pesa más en el pecho cuando piensas en ella?" },
        { id: "b2-p13", type: "p", text: "Estas preguntas no siempre tienen una respuesta clara. En ese caso, hasta echarlo a cara o cruz puede ser mejor que no elegir. Elegir la tarea principal equivocada suele cansar menos que pasarse el día saltando entre tres tareas, porque al menos una avanza." },
        { id: "b2-p14", type: "p", text: "Y algo más: la tarea principal no tiene que ser cada día algo grande. Un día en que no te quedan fuerzas, acabas de salir de un examen o te encuentras mal, la tarea principal puede ser “Poner la lavadora”. La tarea principal se elige según lo que da de sí el día, no según lo que daría de sí la persona que te gustaría ser." },

        { id: "b2-h2", type: "h", text: "Convertir la tarea principal en un paso pequeño" },
        { id: "b2-p5", type: "p", text: "“Escribir el trabajo” puede ser una buena tarea principal, pero es un mal comienzo. Es demasiado grande; no sabes por dónde agarrarla. Lo que facilita empezar es el primer paso pequeño de la tarea principal: una acción lo bastante concreta como para hacerla en unos minutos." },
        { id: "b2-p6", type: "p", text: "Algunos ejemplos: en lugar de “Escribir el trabajo”, “Abrir el archivo del trabajo y escribir tres títulos”. En lugar de “Solicitud de prácticas”, “Buscar el documento que falta para el formulario y guardarlo en la carpeta”. En lugar de “Hablar con el casero”, “Escribir la primera frase del mensaje sobre el alquiler”." },
        { id: "b2-p7", type: "p", text: "El objetivo del primer paso no es terminar la tarea, sino meterte en ella. A veces, después del primer paso, sigues; a veces, no. Las dos cosas están bien. Pero no es lo mismo esperar delante de una página en blanco que volver a una página que ya tiene tres títulos escritos." },

        {
          id: "b2-gorsel",

      number: 2,
      title: "Dai a oggi un'attività principale",
      minutes: 7,
      available: true,
      blocks: [
        {
          id: "b2-sahne",
          type: "scene",
          paragraphs: [
            "Martedì mattina, le 10:00. Giulia è in biblioteca, al tavolo vicino alla finestra. Davanti a sé ha la lista di ieri: quattordici righe.",
            "Prima apre il file della consegna. Dopo qualche minuto si ricorda della scadenza del modulo per il tirocinio e apre il modulo. Mentre cerca il documento richiesto, le viene in mente di controllare entro quando va fatto il reso. Poi torna alla consegna.",
            "Verso mezzogiorno sullo schermo ci sono sette schede aperte. Nessuna cosa è finita. Giulia sa di aver lavorato tutta la mattina, ma non ha niente da mostrare.",
          ],
        },

        { id: "b2-h1", type: "h", text: "Una lista non è un piano" },
        { id: "b2-p1", type: "p", text: "Nel primo capitolo hai scritto da qualche parte quello che avevi in testa. Questo alleggerisce il carico; ma non ti dice da cosa cominciare oggi. Una lista è un inventario. Chi guarda quattordici righe tutte insieme può cominciare a pensare che ognuna sia più urgente dell'altra." },
        { id: "b2-p2", type: "p", text: "La mattina di Giulia è andata proprio così. Ogni cosa era valida, ogni passaggio aveva senso. Ma passando da una cosa all'altra, ogni volta ha dovuto ricordarsi di nuovo dove era rimasta. La giornata si è riempita di inizi lasciati a metà." },
        { id: "b2-p3", type: "p", text: "Quello che ti propongo in questo capitolo è semplice: per ogni giornata scegli un'attività principale. Non deve essere la cosa più importante della tua vita. Il criterio è questo: se stasera questa cosa sarà finita o andata avanti, sarà un sollievo per te? Se la risposta è sì, quella è l'attività principale di oggi." },
        { id: "b2-p4", type: "p", text: "Le altre cose non spariscono; aspettano nella lista. Scegliere un'attività principale non significa rinunciare alle altre, ma rimandare la decisione su quando occupartene." },

        { id: "b2-h5", type: "h", text: "Quando scegliere è difficile" },
        { id: "b2-p12", type: "p", text: "Certe mattine due o tre cose sembrano urgenti allo stesso modo. In giornate così, alcune domande possono rendere la scelta più facile. Quale ha la scadenza più vicina? Quale, se non viene finita, blocca anche altre cose? A quale pensi e senti più peso sul petto?" },
        { id: "b2-p13", type: "p", text: "Queste domande non sempre hanno una risposta chiara. Allora anche tirare una moneta può essere meglio che non scegliere affatto. Scegliere l'attività principale sbagliata spesso stanca meno che passare tutto il giorno avanti e indietro tra tre cose, perché almeno una va avanti." },
        { id: "b2-p14", type: "p", text: "E poi c'è questo: l'attività principale non deve essere ogni giorno una cosa grande. In una giornata di stanchezza, appena dopo un esame o quando non stai bene, l'attività principale può essere «Fare il bucato». L'attività principale si sceglie in base alle forze della giornata, non a quelle della persona che vorresti essere." },

        { id: "b2-h2", type: "h", text: "Trasformare l'attività principale in un piccolo passo" },
        { id: "b2-p5", type: "p", text: "«Scrivere la relazione» può essere una buona attività principale, ma è un pessimo punto di partenza. È troppo grande; non sai da che parte prenderla. Quello che rende più facile cominciare è il primo piccolo passo dell'attività principale: un gesto abbastanza concreto da poterlo fare in pochi minuti." },
        { id: "b2-p6", type: "p", text: "Qualche esempio: invece di «Scrivere la relazione», «Aprire il file e scrivere tre titoli». Invece di «Candidatura per il tirocinio», «Trovare il documento che manca nel modulo e metterlo nella cartella». Invece di «Parlare con il padrone di casa», «Scrivere la prima frase del messaggio sull'affitto»." },
        { id: "b2-p7", type: "p", text: "Lo scopo del primo passo non è finire la cosa, ma entrarci dentro. A volte, finito il primo passo, vai avanti; a volte no. Vanno bene entrambe le cose. Ma c'è differenza tra restare davanti a una pagina bianca e tornare a una pagina con tre titoli già scritti." },

        {
          id: "b2-gorsel",
          type: "figure",
          art: "smallSteps",
          alt: "A sinistra, un grande riquadro con alcune righe all'interno; una freccia porta a quattro piccoli gradini che salgono verso destra. Sopra il primo gradino, il più basso, c'è un punto arancione.",
          caption: "Una cosa grande non si supera con un salto solo. Il primo gradino deve essere abbastanza basso da poterlo salire oggi.",
        },

        { id: "b2-h3", type: "h", text: "Quando e dove?" },
        { id: "b2-p8", type: "p", text: "Dopo aver scelto il primo passo resta ancora una domanda: quando e dove lo farai? «Oggi, prima o poi» spesso scivola fino a fine giornata. «Dopo pranzo, al piano di sopra della biblioteca», invece, nella tua testa diventa come un appuntamento." },

        {
          id: "b2-arastirma-1",
          type: "research",
          finding: "I piani che lo psicologo Peter Gollwitzer ha chiamato «intenzioni di implementazione» consistono nello stabilire in anticipo quando, dove e come mettere in pratica un obiettivo: «Quando si verifica la situazione X, farò Y». In una meta-analisi che ha riunito 94 test indipendenti, la percentuale di partecipanti che raggiungevano i propri obiettivi era, in media, nettamente più alta tra chi aveva fatto questo tipo di piano rispetto a chi si era limitato a fissare un obiettivo.",
          limits: "L'entità dell'effetto variava da uno studio all'altro, e una parte delle ricerche è stata condotta in laboratorio o con studenti. Un effetto medio non dimostra che il piano funzioni per tutti e per ogni cosa.",
          details: "Secondo i ricercatori, piani di questo tipo rendono più facile cominciare quando arriva il momento, perché la decisione «quando comincio?» è già stata presa in anticipo. In questo libro, la sezione «Scegli quando iniziare» in «Giornata» si basa su questa idea.",
          refs: ["gollwitzer1999", "gollwitzer2006"],
        },

        {
          id: "b2-oneri",
          type: "suggestion",
          text: "Prova a legare il momento non a un orario, ma a qualcosa che succede già nella tua giornata: «Dopo la prima lezione», «Dopo aver preparato il caffè», «Quando torno a casa e poso lo zaino». Gli orari slittano; momenti come questi, invece, nella maggior parte dei giorni arrivano comunque.",
        },

        { id: "b2-h4", type: "h", text: "Attività extra e cose che restano per domani" },
        { id: "b2-p9", type: "p", text: "Oltre all'attività principale, durante la giornata ci saranno anche piccole cose da fare. In «Giornata» per queste ci sono solo due spazi. Può sembrare un limite; in realtà è una misura. Se ti servono più di due righe, forse oggi è già una giornata piena, ed è naturale che qualcosa resti per domani." },
        { id: "b2-p10", type: "p", text: "Una cosa che resta per domani non è un fallimento, è una decisione. Il fatto che resti nella lista significa che non è stata dimenticata." },
        { id: "b2-p11", type: "p", text: "Quel giorno, dopo pranzo, Giulia ha chiuso tutte le schede. La sua attività principale era la consegna; il primo passo era aprire il file e scrivere tre titoli. Si è seduta a un tavolo libero al piano di sopra. I titoli le hanno preso dieci minuti. Poi, sotto il primo titolo, ha scritto ancora qualche paragrafo. Il modulo del tirocinio e il reso sono diventati le attività extra del giorno dopo." },

        {
          id: "b2-uygulama",
          type: "exercise",
          title: "L'attività principale di oggi",
          planner: "main",
          steps: [
            "Guarda la tua lista e chiediti: quale di queste cose, se stasera fosse andata avanti, mi darebbe sollievo?",
            "Scrivi quella cosa come attività principale di oggi.",
            "Sotto, scrivi il primo piccolo passo con cui puoi cominciare in pochi minuti.",
            "Se vuoi, aggiungi anche quando e dove comincerai: per esempio «Dopo pranzo, alla mia scrivania».",
            "Le altre cose possono aspettare nella lista. Per oggi basta così.",
          ],
        },

        {
          id: "b2-ozet",
          type: "summary",
          text: "Una sola attività principale per oggi e un suo piccolo primo passo spesso rendono più facile cominciare che provarci guardando una lunga lista.",
        },
      ],
      sources: ["gollwitzer1999", "gollwitzer2006"],
    },

    {
      id: "bolum-3",
      kind: "chapter",
      number: 3,
      title: "Adatta il piano alla tua vita",
      minutes: 7,
      available: true,
      blocks: [
        {
          id: "b3-sahne",
          type: "scene",
          paragraphs: [
            "Giovedì. Il piano di Giulia era chiaro: dopo pranzo, in biblioteca, la seconda parte della consegna.",
            "Ma la riunione del gruppo è andata per le lunghe. All'uscita ha cominciato a piovere. Quando è arrivata a casa erano passate le sei; bagnata, stanca e anche un po' nervosa.",
            "La frase che le è passata per la testa era familiare: «Ormai oggi è andata. Domani comincio come si deve.»",
          ],
        },

        { id: "b3-h1", type: "h", text: "Quando il piano salta" },
        { id: "b3-p1", type: "p", text: "Il piano fatto al mattino è una previsione su come andrà la giornata. Le riunioni si allungano, gli autobus fanno ritardo, l'energia finisce prima del previsto. Se il piano non regge, non è un errore di chi l'ha fatto; le previsioni sono fatte così." },
        { id: "b3-p2", type: "p", text: "Spesso il problema non è il piano saltato, ma il pensiero «tutto o niente» che arriva subito dopo. Se il piano non si può seguire alla lettera, sembra che non si possa seguire per niente. Eppure, nella maggior parte delle giornate, le possibilità sono tre." },
        { id: "b3-p3", type: "p", text: "La prima è spostare il momento: «Il pomeriggio non è andato, mezz'ora dopo cena». La seconda è rimpicciolire il passo: «Non riesco a scrivere la seconda parte, ma posso rileggere una volta i miei appunti». La terza è rimandare di proposito: «Oggi non lo faccio; domattina è la prima cosa». Tutte e tre sono decisioni. La giornata persa, invece, è quella in cui non si decide niente." },

        { id: "b3-h2", type: "h", text: "Un'opzione più piccola per i giorni difficili" },
        { id: "b3-p4", type: "p", text: "In una giornata che va bene il primo passo è facile. Il piano viene messo alla prova soprattutto nei giorni difficili. Per questo può essere utile stabilire in anticipo un'«opzione più piccola»: un piano di riserva così piccolo da poterlo fare anche in una brutta giornata." },
        { id: "b3-p5", type: "p", text: "Per la consegna può voler dire aprire il file e scrivere una sola frase. Per una camminata, uscire di casa e fare un giro di cinque minuti. Per la lettura, una pagina. L'opzione più piccola non serve a far finta di aver fatto la cosa, ma a non perdere il contatto con essa." },

        {
          id: "b3-gorsel",
          type: "figure",
          art: "flexiblePlan",
          alt: "Un sentiero tratteggiato va da sinistra a destra e prosegue curvando attorno a un ostacolo al centro. In basso ci sono sette piccoli quadrati; quasi tutti pieni, uno vuoto, e accanto all'ultimo un punto arancione.",
          caption: "Il piano può girare attorno all'ostacolo. Se uno dei sette giorni resta vuoto, non vuol dire che la strada sia finita.",
        },

        { id: "b3-h3", type: "h", text: "Saltare un giorno" },
        { id: "b3-p6", type: "p", text: "Quando si prova una nuova abitudine, a molte persone saltare un giorno sembra voler dire dover ricominciare tutto da capo. I contatori di serie alimentano proprio questa sensazione: una catena di trenta giorni si azzera in un giorno solo." },

        {
          id: "b3-arastirma-1",
          type: "research",
          finding: "In uno studio condotto a Londra, 96 volontari hanno scelto un comportamento legato al mangiare, al bere o al movimento da fare ogni giorno nella stessa situazione e, per 12 settimane, hanno valutato ogni giorno da soli quanto quel comportamento fosse diventato automatico. Saltare una singola occasione non ha compromesso in modo marcato il processo di formazione dell'abitudine. Il tempo necessario perché il comportamento diventasse quasi automatico è stato molto diverso da persona a persona: tra 18 e 254 giorni.",
          limits: "Un piccolo gruppo di volontari e comportamenti quotidiani semplici. L'automaticità è stata misurata con la valutazione dei partecipanti stessi, e i dati di alcuni partecipanti non si adattavano bene al modello. Con comportamenti più complessi i risultati potrebbero essere diversi.",
          details: "Nello studio il tempo mediano era di 66 giorni; ma non è una media, e non è nemmeno un traguardo. Il risultato fa pensare che tempi fissi come «un'abitudine in 21 giorni» non vadano bene per tutti e che saltare ogni tanto un giorno non azzeri il processo.",
          refs: ["lally2010"],
        },

        {
          id: "b3-oneri",
          type: "suggestion",
          text: "Quando provi un'abitudine, comincia con una breve prova di sette giorni. Lo scopo non è prendere l'abitudine in sette giorni, ma vedere se il momento, il luogo e il passo che hai scelto fanno per te. Cambiare il piano alla fine dei sette giorni fa parte dell'esperimento.",
        },

        { id: "b3-h5", type: "h", text: "Se il piano non fa per te" },
        { id: "b3-p10", type: "p", text: "A volte il problema non è una singola brutta giornata. Se lo stesso piano non regge per diversi giorni di fila, può essere il segno che sei tu a cercare di adattarti al piano, e non il piano ad adattarsi a te. Per chi ha deciso di correre alle sette del mattino ma ogni mattina spegne la sveglia, la vera domanda forse non è «Perché non ci riesco?», ma «Quest'ora va davvero bene per me?»" },
        { id: "b3-p11", type: "p", text: "Quando cambi il piano puoi guardare tre cose: il momento, il luogo e la grandezza del passo. Spesso basta cambiarne una. La sera invece della mattina, la biblioteca invece di casa, dieci minuti invece di mezz'ora. L'obiettivo può restare lo stesso; cambia solo la strada per arrivarci." },
        { id: "b3-p12", type: "p", text: "Mentre fai questi cambiamenti, può aiutare guardarti come qualcuno che sta conducendo un esperimento. Gli esperimenti a volte non danno il risultato atteso; questo non significa che chi li conduce abbia fallito, ma solo che si capisce cosa cambiare nel tentativo successivo." },

        { id: "b3-h4", type: "h", text: "Due domande la sera" },
        { id: "b3-p7", type: "p", text: "A fine giornata, invece di contare quanta parte del piano si è realizzata, prova a farti due domande: Cosa ha funzionato oggi? Cosa posso rendere più facile domani? La prima ti aiuta a notare quello che ha funzionato. La seconda corregge un po' il piano del giorno dopo in base all'esperienza di oggi." },
        { id: "b3-p8", type: "p", text: "Le risposte possono essere piccole: «Mettere il telefono in un'altra stanza ha funzionato». «Domani preparo lo zaino la sera prima». È così che i piani si adattano alla vita: con piccole correzioni, giorno dopo giorno." },
        { id: "b3-p9", type: "p", text: "Quel giovedì sera Giulia ha aperto il file della consegna e ha scritto una sola frase per la seconda parte. Poi è andata a dormire. La mattina dopo, quando ha aperto il file, invece di una pagina bianca l'aspettava una frase." },

        {
          id: "b3-uygulama",
          type: "exercise",
          title: "Una piccola prova di sette giorni",
          planner: "habit",
          steps: [
            "Scegli una sola abitudine che vuoi provare.",
            "Scrivi il suo inizio più piccolo possibile: abbastanza piccolo da poterlo fare anche in una brutta giornata.",
            "Legalo a un momento che c'è già nella tua giornata e decidi dove lo farai.",
            "Aggiungi un'opzione più piccola per i giorni difficili.",
            "Per sette giorni, ogni sera segna soltanto: l'ho fatto, ho fatto la versione più piccola oppure non l'ho fatto. Poi riguarda il tuo piano.",
          ],
        },

        {
          id: "b3-ozet",
          type: "summary",
          text: "Quando il piano salta, invece di lasciarlo perdere spesso si può spostare il momento o rimpicciolire il passo; e saltare un giorno non vuol dire che la strada sia finita.",
        },
      ],
      sources: ["lally2010"],
    },

    {
      id: "kapanis",
      kind: "outro",
      title: "Per concludere",
      minutes: 2,
      available: true,
      blocks: [
        { id: "k1", type: "p", text: "In questo libro c'erano tre piccole idee: appoggiare da qualche parte quello che hai in testa, scegliere per oggi una sola attività principale e il suo primo passo, e poter cambiare il piano quando cambia la giornata." },
        { id: "k2", type: "p", text: "Nessuna di queste renderà facile ogni giornata. Certi giorni la lista resterà lunga, l'attività principale non andrà avanti, la prova si incepperà. Questo non significa che abbia fallito il metodo, né che abbia fallito tu. Il giorno dopo puoi scegliere di nuovo un'attività principale." },
        { id: "k3", type: "p", text: "L'agenda e la sezione dell'abitudine restano qui anche dopo che avrai finito di leggere il libro. Un giorno puoi aprirla e scrivere solo l'attività principale di oggi, un altro giorno puoi anche non aprirla affatto. I tuoi dati restano solo su questo dispositivo; ricordati di fare ogni tanto un backup." },
        { id: "k4", type: "p", text: "I piccoli passi non risolvono tutto. Ma nella maggior parte dei giorni possono bastare per cominciare." },
      ],
    },
  ],

  lang: "nl",

  chapters: [
    {
      id: "baslarken",
      kind: "intro",
      title: "Om te beginnen",
      minutes: 2,
      available: true,
      blocks: [
        { id: "g1", type: "p", text: "Dit korte boek is geschreven voor iemand die probeert de dag door te komen. Voor iemand die studie, werk, huishouden en de eindeloze meldingen op de telefoon tegelijk draagt, en zich 's avonds afvraagt: “Wat heb ik vandaag eigenlijk gedaan?”" },
        { id: "g2", type: "p", text: "Je vindt hier geen groot systeem. Geen agenda's met kleurcodes, geen ochtendroutines van twintig stappen en geen belofte dat alles van de ene op de andere dag verandert. Er zijn drie kleine ideeën: wat je in je hoofd hebt ergens neerleggen, één hoofdtaak voor vandaag kiezen, en je plan aanpassen als de dag anders loopt." },
        { id: "g3", type: "p", text: "Elk hoofdstuk is kort genoeg om in de trein of de bus te lezen. Aan het eind van elk hoofdstuk staat een oefening van een paar minuten. Die kun je op papier doen, of in de planner in deze app." },
        { id: "g4", type: "p", text: "Hier en daar noem ik onderzoek. Lees dat niet als “de wetenschap heeft bewezen”, maar als “bij sommige mensen, onder bepaalde omstandigheden, zag men dit”. Wat het onderzoek zegt en wat ik zelf voorstel, zie je in aparte kaders. Als je weet wat wat is, kun je makkelijker beslissen wat je meeneemt in je eigen leven." },
      ],
    },

    {
      id: "bolum-1",
      kind: "chapter",
      number: 1,
      title: "Je hoeft niet alles te onthouden",
      minutes: 7,
      available: true,
      blocks: [
        {
          id: "b1-sahne",
          type: "scene",
          paragraphs: [
            "Het is 8.10 uur. Sanne staat in de metro, vlak bij de deur. Met één hand houdt ze zich vast aan de lus, met de andere scrolt ze door haar mail.",
            "Haar gedachten komen niet netjes op volgorde. De opdracht die vrijdag ingeleverd moet worden. Het berichtje aan de verhuurder over de huur. Het retourpakketje dat nog naar het afhaalpunt moet. Haar moeder, die volgende week jarig is. Het half ingevulde formulier van de stage-aanvraag. En gisteravond had ze tegen een vriendin gezegd: “Ik bel je morgen.” Wanneer zou ze bellen?",
            "Als de metro het station nadert, bekruipt haar een bekend gevoel: ik vergeet iets, maar wat? De dag is nog niet begonnen en ze is al moe.",
          ],
        },

        { id: "b1-h1", type: "h", text: "Je hoofd is een goede herinnering, maar een slechte opslag" },
        { id: "b1-p1", type: "p", text: "Sannes probleem is geen luiheid of slordigheid. Het probleem is dat al haar taken tegelijk op één plek staan: in haar hoofd." },
        { id: "b1-p2", type: "p", text: "Een onafgemaakte taak meldt zich af en toe opnieuw, zolang je hem nergens hebt opgeschreven. Tijdens een college schiet het retourpakketje je te binnen, tijdens het eten de opdracht. Soms zijn die herinneringen nuttig. Maar ze kiezen hun moment en volgorde niet. Een belangrijke taak roept even hard als een onbelangrijke." },
        { id: "b1-p3", type: "p", text: "Het resultaat: je hebt twintig halve gedachten en kunt er niet één helemaal afdenken. Dat kan een van de redenen zijn waarom je je de hele dag druk voelt en 's avonds het gevoel hebt dat je niets hebt gedaan." },

        {
          id: "b1-arastirma-1",
          type: "research",
          finding: "In een reeks experimenten dwaalden de gedachten van deelnemers die aan een onafgemaakt doel werden herinnerd, tijdens een leestaak die er niets mee te maken had, vaker af naar dat doel. Toen ze voor datzelfde doel een concreet plan mochten maken, verdween dit effect.",
          limits: "De experimenten werden in een laboratorium gedaan, meestal met universiteitsstudenten. In het dagelijks leven geeft het misschien niet bij iedereen hetzelfde resultaat.",
          details: "Volgens de onderzoekers maakte niet het onthouden van de taak het verschil, maar het maken van een concreet plan ervoor. In dit boek is opschrijven de eerste stap; plannen is het onderwerp van het tweede hoofdstuk.",
          refs: ["masicampo2011"],
        },

        { id: "b1-h2", type: "h", text: "Waarom opschrijven helpt" },
        { id: "b1-p4", type: "p", text: "Opschrijven wat er in je hoofd zit, is geen belofte dat je al die dingen gaat doen. Het lijkt meer op ze ergens parkeren. Als je auto in de parkeergarage staat, hoef je er niet steeds aan te denken; het is genoeg dat je weet waar hij staat." },
        { id: "b1-p5", type: "p", text: "Een lijst op papier doet drie concrete dingen. Ten eerste kun je taken met elkaar vergelijken. In je hoofd lijken ze allemaal even groot; op papier zie je dat sommige twee minuten kosten en andere twee weken. Ten tweede neemt de angst om iets te vergeten af, omdat het papier het onthouden nu voor je doet. Ten derde wordt de volgende stap makkelijker: beslissen wat je vandaag kiest." },

        {
          id: "b1-gorsel",
          type: "figure",
          art: "thoughtsToPaper",
          alt: "Links korte lijntjes en lussen van verschillende grootte die door elkaar lopen; vanuit het midden wijst een pijl naar een vel papier rechts met nette regels. Op het papier staan een paar regels, en naast één regel staat een klein vinkje.",
          caption: "In je hoofd loopt alles door elkaar. Op papier komen dezelfde taken op een rij en kun je ze vergelijken.",
        },

        {
          id: "b1-arastirma-2",
          type: "research",
          finding: "In een onderzoek in een slaaplaboratorium vielen jongvolwassenen die voor het slapengaan vijf minuten opschreven wat ze de komende dagen moesten doen, gemiddeld sneller in slaap dan degenen die opschreven wat ze de afgelopen dagen hadden afgerond.",
          limits: "Eén nacht, een kleine groep van 57 mensen zonder slaapproblemen. Het laat niet zien dat opschrijven voor iedereen goed is voor de slaap.",
          details: "Wie de takenlijst gedetailleerder opschreef, sliep ook sneller in. Lees deze bevinding als een aanwijzing dat het verplaatsen van de lijst van je hoofd naar papier rust kan geven, niet als een vaststaande conclusie.",
          refs: ["scullin2018"],
        },

        { id: "b1-h3", type: "h", text: "Je hoeft niet je hele leven te organiseren" },
        { id: "b1-p6", type: "p", text: "Op dit punt is de eerste ingeving vaak een grote opruimactie: een nieuwe app downloaden, alles in categorieën indelen, kleuren, labels, prioriteitsniveaus. Een week later is het systeem zelf weer een taak die onderhoud nodig heeft." },
        { id: "b1-p7", type: "p", text: "Dat hoeft niet. Het enige wat je in dit hoofdstuk doet, is een paar minuten lang naar buiten halen wat er in je hoofd zit. Geen indeling, geen volgorde, geen plan. Daar komen we in het tweede hoofdstuk op, en ook dan kiezen we één taak, geen twintig." },

        {
          id: "b1-oneri",
          type: "suggestion",
          text: "Houd de lijst op één plek. Schrijf je de ene dag in de notitie-app op je telefoon, de volgende dag op een papiertje en de dag daarna in een concept-bericht, dan probeert je hoofd voortaan te onthouden waar je lijsten liggen. Welke plek het is, maakt niet uit; dat het steeds dezelfde plek is, wel.",
        },

        { id: "b1-p8", type: "p", text: "Het kan ook helpen om dit te weten: je lijst zal er rommelig uitzien. “Mama bellen” staat gewoon onder “Nadenken over wat ik na mijn afstuderen wil”. Dat is normaal. De lijst is er niet om netjes te zijn, maar om zichtbaar te maken wat je met je meedraagt." },
        { id: "b1-h4", type: "h", text: "En als de lijst lang wordt?" },
        { id: "b1-p10", type: "p", text: "Veel mensen die voor het eerst alles opschrijven, schrikken even als ze naar de lijst kijken. Vijftien, twintig regels. “Heb ik zoveel te doen?” Maar al die dingen waren er al; alleen kun je ze nu tellen." },
        { id: "b1-p11", type: "p", text: "Een lange lijst betekent niet dat je alles vandaag moet doen. Sommige regels zijn een kwestie van één berichtje, andere een onderwerp dat maanden duurt, en sommige zijn eigenlijk geen taak maar een zorg: “Zal ik wel een stage vinden?” Om ze te scheiden hoef je nu nog niets te doen. Alleen al zien dat ze niet allemaal van dezelfde soort zijn, kan de last een beetje lichter maken." },
        { id: "b1-p12", type: "p", text: "Er kunnen ook dingen bij je opkomen die je liever niet opschrijft. Je hoeft niet alles op te schrijven. Niemand krijgt deze lijst te zien; hij is er niet om je te testen, maar om wat ruimte in je hoofd te maken." },
        { id: "b1-p13", type: "p", text: "Misschien merk je ook dit: sommige taken worden kleiner zodra ze op papier staan. “Bericht aan de verhuurder” voelt in je hoofd als een groot gesprek, maar op papier wordt het een bericht van twee zinnen. Dat gebeurt niet bij elke taak, maar als het gebeurt, is het fijn." },
        { id: "b1-p9", type: "p", text: "Toen Sanne die ochtend uit de metro stapte, schreef ze drie minuten lang alles wat bij haar opkwam in de notities op haar telefoon. Het werden veertien regels. Ze deed er op dat moment niets mee. Maar toen ze zag dat ze haar vriendin in de lunchpauze zou bellen en het retourpakketje 's avonds op weg naar huis bij het afhaalpunt zou afgeven, werd de rest een beetje stiller." },

        {
          id: "b1-uygulama",
          type: "exercise",
          title: "Drie minuten je hoofd leegmaken",
          planner: "brain",
          timerSeconds: 180,
          steps: [
            "Zet een timer op drie minuten. Je kunt ook de knop hieronder gebruiken.",
            "Schrijf elke taak die bij je opkomt kort op, in willekeurige volgorde. Maak geen onderscheid tussen groot en klein: “Bericht over de huur”, “Opdracht”, “Afspraak tandarts”.",
            "Begin geen zinnen met “Ik moet”; de naam van de taak is genoeg.",
            "Stop als de timer afgaat. De lijst mag onvolledig zijn; wat ontbreekt, kun je later nog toevoegen.",
            "Je hoeft voorlopig niets met de lijst te doen. Weet gewoon dat hij er is.",
          ],
        },

        {
          id: "b1-ozet",
          type: "summary",
          text: "Als je de dingen in je hoofd ergens opschrijft, hoef je ze niet meteen te doen; je hoeft ze alleen niet langer allemaal tegelijk mee te dragen.",
        },
      ],
      sources: ["masicampo2011", "scullin2018"],
    },

    {
      id: "bolum-2",
      kind: "chapter",
      number: 2,
      title: "Geef vandaag één hoofdtaak",
      minutes: 7,
      available: true,
      blocks: [
        {
          id: "b2-sahne",
          type: "scene",
          paragraphs: [
            "Dinsdagochtend, 10.00 uur. Sanne zit in de bibliotheek, aan het tafeltje bij het raam. Voor haar ligt de lijst van gisteren: veertien regels.",
            "Eerst opent ze het bestand van haar opdracht. Na een paar minuten schiet de deadline van het stageformulier haar te binnen, en ze opent het formulier. Terwijl ze zoekt naar het document dat erbij moet, bedenkt ze dat ze moet kijken hoelang ze nog heeft om het pakketje te retourneren. Daarna gaat ze weer terug naar de opdracht.",
            "Tegen de middag staan er zeven tabbladen open op haar scherm. Niets is af. Sanne weet dat ze de hele ochtend heeft gewerkt, maar ze heeft niets om te laten zien.",
          ],
        },

        { id: "b2-h1", type: "h", text: "Een lijst is geen plan" },
        { id: "b2-p1", type: "p", text: "In het eerste hoofdstuk heb je opgeschreven wat er in je hoofd zat. Dat maakt de last lichter, maar het vertelt je niet waarmee je vandaag begint. Een lijst is een inventaris. Wie naar veertien regels tegelijk kijkt, kan gaan denken dat elke regel dringender is dan de andere." },
        { id: "b2-p2", type: "p", text: "Zo verliep Sannes ochtend ook. Elke taak was terecht, elke overstap logisch. Maar elke keer dat ze wisselde, moest ze opnieuw bedenken waar ze gebleven was. De dag raakte gevuld met half begonnen dingen." },
        { id: "b2-p3", type: "p", text: "Wat ik in dit hoofdstuk voorstel, is eenvoudig: kies voor elke dag één hoofdtaak. Het hoeft niet de belangrijkste taak van je leven te zijn. De maatstaf is: als deze taak vanavond af is of verder is gekomen, ben je dan opgelucht? Is het antwoord ja, dan is dat de hoofdtaak van vandaag." },
        { id: "b2-p4", type: "p", text: "De andere taken verdwijnen niet; ze wachten op de lijst. Een hoofdtaak kiezen betekent niet dat je de rest opgeeft, maar dat je de vraag wanneer je ernaar kijkt even uitstelt." },

        { id: "b2-h5", type: "h", text: "Als kiezen moeilijk is" },
        { id: "b2-p12", type: "p", text: "Sommige ochtenden lijken twee of drie taken even dringend. Op zulke dagen zijn er een paar vragen die het kiezen makkelijker kunnen maken. Welke heeft de dichtstbijzijnde deadline? Welke houdt ook andere dingen op als hij niet af komt? Bij welke voel je de meeste druk op je borst als je eraan denkt?" },
        { id: "b2-p13", type: "p", text: "Die vragen hebben niet altijd een duidelijk antwoord. Dan kan zelfs kop of munt beter zijn dan helemaal niet kiezen. De ‘verkeerde’ hoofdtaak kiezen is vaak minder vermoeiend dan de hele dag heen en weer springen tussen drie taken; dan komt er tenminste één verder." },
        { id: "b2-p14", type: "p", text: "En nog iets: de hoofdtaak hoeft niet elke dag groot te zijn. Op een dag dat je moe bent, net een tentamen achter de rug hebt of ziek bent, kan de hoofdtaak “De was doen” zijn. Je kiest de hoofdtaak naar wat de dag aankan, niet naar wat de persoon die je wilt zijn aankan." },

        { id: "b2-h2", type: "h", text: "Van hoofdtaak naar een kleine stap" },
        { id: "b2-p5", type: "p", text: "“De opdracht schrijven” kan een goede hoofdtaak zijn, maar het is een slecht begin. Het is te groot; je weet niet waar je moet beginnen. Wat het beginnen makkelijker maakt, is de eerste kleine stap van de hoofdtaak: een handeling die zo concreet is dat je hem in een paar minuten kunt doen." },
        { id: "b2-p6", type: "p", text: "Een paar voorbeelden: niet “De opdracht schrijven”, maar “Het bestand openen en drie kopjes typen”. Niet “Stage-aanvraag”, maar “Het ontbrekende document voor het formulier opzoeken en in de map zetten”. Niet “Met de verhuurder praten”, maar “De eerste zin van het bericht over de huur schrijven”." },
        { id: "b2-p7", type: "p", text: "Het doel van de eerste stap is niet de taak afmaken, maar erin komen. Soms ga je na die eerste stap door, soms niet. Allebei is prima. Maar er is verschil tussen wachten voor een lege pagina en terugkomen bij een pagina waar al drie kopjes op staan." },

        {
          id: "b2-gorsel",
          type: "figure",
          art: "smallSteps",
          alt: "Links een grote doos met een paar regels erin; een pijl wijst naar vier kleine traptreden die naar rechts omhooglopen. Op de eerste en laagste trede staat een oranje stip.",
          caption: "Een grote taak neem je niet in één sprong. De eerste trede moet laag genoeg zijn om vandaag te nemen.",
        },

        { id: "b2-h3", type: "h", text: "Wanneer en waar?" },
        { id: "b2-p8", type: "p", text: "Als je de eerste stap hebt gekozen, blijft er nog één vraag over: wanneer en waar ga je hem doen? “Vandaag ergens” schuift vaak op naar het eind van de dag. “Na de lunch, op de bovenste verdieping van de bibliotheek” staat in je hoofd als een afspraak." },

        {
          id: "b2-arastirma-1",
          type: "research",
          finding: "Plannen die psycholoog Peter Gollwitzer ‘implementatie-intenties’ noemde, leggen van tevoren vast wanneer, waar en hoe je een doel uitvoert: “Als situatie X zich voordoet, dan doe ik Y.” In een meta-analyse waarin 94 onafhankelijke tests werden samengebracht, bereikten deelnemers die zo’n plan maakten hun doel gemiddeld duidelijk vaker dan deelnemers die alleen een doel stelden.",
          limits: "De grootte van het effect verschilde tussen de onderzoeken, en een deel van het onderzoek werd in het laboratorium of met studenten gedaan. Een gemiddeld effect betekent niet dat het plan voor iedereen en bij elke taak werkt.",
          details: "Volgens de onderzoekers maken zulke plannen het beginnen makkelijker als het moment daar is, omdat de beslissing “wanneer begin ik?” al van tevoren is genomen. In dit boek is het onderdeel “Bepalen wanneer ik begin” in Mijn dag op dit idee gebaseerd.",
          refs: ["gollwitzer1999", "gollwitzer2006"],
        },

        {
          id: "b2-oneri",
          type: "suggestion",
          text: "Probeer de tijd niet als klokuur vast te leggen, maar te koppelen aan een moment dat al in je dag zit: “Na het eerste college”, “Als ik koffie heb gezet”, “Als ik thuiskom en mijn tas neerzet”. Klokuren schuiven op; zulke momenten komen de meeste dagen gewoon weer langs.",
        },

        { id: "b2-h4", type: "h", text: "Extra taken en wat naar morgen gaat" },
        { id: "b2-p9", type: "p", text: "Naast je hoofdtaak zijn er ook kleine dingen die die dag moeten gebeuren. In Mijn dag is daar maar plek voor twee. Dat lijkt misschien een beperking, maar het is eigenlijk een maatstaf. Heb je meer dan twee regels nodig, dan is vandaag waarschijnlijk al een volle dag en is het logisch dat sommige dingen naar morgen gaan." },
        { id: "b2-p10", type: "p", text: "Een taak die naar morgen gaat, is geen mislukking maar een beslissing. Dat hij op de lijst blijft staan, betekent dat hij niet vergeten is." },
        { id: "b2-p11", type: "p", text: "Die dag sloot Sanne na de lunch alle tabbladen. Haar hoofdtaak was de opdracht; haar eerste stap was het bestand openen en drie kopjes typen. Ze ging aan een leeg tafeltje op de bovenste verdieping zitten. De kopjes kostten tien minuten. Daarna schreef ze onder het eerste kopje nog een paar alinea's. Het stageformulier en het pakketje werden de extra taken voor de volgende dag." },

        {
          id: "b2-uygulama",
          type: "exercise",
          title: "De hoofdtaak van vandaag",
          planner: "main",
          steps: [
            "Kijk naar je lijst en vraag jezelf: van welke taak word ik vanavond opgelucht als hij verder is gekomen?",
            "Schrijf die taak op als de hoofdtaak van vandaag.",
            "Schrijf eronder de eerste kleine stap waarmee je in een paar minuten kunt beginnen.",
            "Als je wilt, zet je er ook bij wanneer en waar je begint, bijvoorbeeld: “Na de lunch, aan mijn bureau”.",
            "De rest kan op de lijst wachten. Voor vandaag is dit genoeg.",
          ],
        },

        {
          id: "b2-ozet",
          type: "summary",
          text: "Eén hoofdtaak voor vandaag met een kleine eerste stap is vaak makkelijker dan proberen te beginnen terwijl je naar een lange lijst kijkt.",
        },
      ],
      sources: ["gollwitzer1999", "gollwitzer2006"],
    },

    {
      id: "bolum-3",
      kind: "chapter",
      number: 3,
      title: "Laat je plan passen bij je leven",
      minutes: 7,
      available: true,
      blocks: [
        {
          id: "b3-sahne",
          type: "scene",
          paragraphs: [
            "Donderdag. Sannes plan stond vast: na de lunch in de bibliotheek aan het tweede deel van haar opdracht werken.",
            "Maar het groepsoverleg liep uit. Toen ze naar buiten kwam, begon het te regenen. Toen ze thuiskwam, was het al na zessen; ze was nat, moe en ook een beetje geïrriteerd.",
            "De gedachte die door haar hoofd ging, kende ze wel: “Vandaag is toch al mislukt. Morgen begin ik opnieuw, en dan goed.”",
          ],
        },

        { id: "b3-h1", type: "h", text: "Als je plan in de war raakt" },
        { id: "b3-p1", type: "p", text: "Een plan dat je 's ochtends maakt, is een inschatting van hoe de dag zal lopen. Overleggen lopen uit, bussen hebben vertraging, je energie is eerder op dan verwacht. Dat een plan niet uitkomt, is geen fout van degene die het maakte; zo werken inschattingen nu eenmaal." },
        { id: "b3-p2", type: "p", text: "Het probleem is vaak niet het plan dat in de war raakt, maar de alles-of-niets-gedachte die daarop volgt. Als het plan niet precies zo kan, voelt het alsof het helemaal niet kan. Terwijl je op de meeste dagen drie mogelijkheden hebt." },
        { id: "b3-p3", type: "p", text: "De eerste: de tijd verschuiven. “Vanmiddag lukte het niet, dan na het eten een halfuur.” De tweede: de stap kleiner maken. “Het tweede deel schrijven lukt niet, maar mijn aantekeningen één keer doorlezen wel.” De derde: bewust uitstellen. “Vandaag doe ik het niet; morgenochtend is dit het eerste wat ik doe.” Alle drie zijn een beslissing. Een verloren dag is een dag waarop je niets beslist." },

        { id: "b3-h2", type: "h", text: "Een kleinere optie voor moeilijke dagen" },
        { id: "b3-p4", type: "p", text: "Op een dag die goed loopt, is de eerste stap makkelijk. Een plan wordt pas echt op de proef gesteld op moeilijke dagen. Daarom kan het helpen om van tevoren een ‘kleinere optie’ te bedenken: een reserve die zo klein is dat je hem zelfs op een slechte dag kunt doen." },
        { id: "b3-p5", type: "p", text: "Voor een opdracht kan dat zijn: het bestand openen en één zin schrijven. Voor wandelen: naar buiten gaan en vijf minuten een rondje om het huis lopen. Voor lezen: één bladzijde. De kleine optie is er niet om de taak af te vinken, maar om het contact met de taak niet te verliezen." },

        {
          id: "b3-gorsel",
          type: "figure",
          art: "flexiblePlan",
          alt: "Een gestippeld pad dat van links naar rechts loopt, buigt om een obstakel in het midden heen en loopt dan verder. Onderaan staan zeven kleine vierkantjes; de meeste zijn gevuld, één is leeg, en naast het laatste staat een oranje stip.",
          caption: "Een plan kan om een obstakel heen. Eén lege dag op de zeven betekent niet dat de weg ophoudt.",
        },

        { id: "b3-h3", type: "h", text: "Een dag overslaan" },
        { id: "b3-p6", type: "p", text: "Als je een nieuwe gewoonte probeert, voelt één dag overslaan voor veel mensen alsof ze helemaal opnieuw moeten beginnen. Reeksentellers voeden dat gevoel: een ketting van dertig dagen staat in één dag weer op nul." },

        {
          id: "b3-arastirma-1",
          type: "research",
          finding: "In een onderzoek in Londen kozen 96 vrijwilligers een eet-, drink- of bewegingsgedrag dat ze elke dag in dezelfde situatie zouden doen, en gaven ze 12 weken lang elke dag zelf aan hoe automatisch dat gedrag was geworden. Eén gemiste gelegenheid verstoorde het ontstaan van de gewoonte niet duidelijk. Hoelang het duurde voordat het gedrag bijna automatisch was, verschilde sterk van persoon tot persoon: tussen de 18 en 254 dagen.",
          limits: "Een kleine groep vrijwilligers en eenvoudige dagelijkse handelingen. Automatisme werd gemeten met de eigen beoordeling van de deelnemers, en de gegevens van een deel van de deelnemers pasten niet goed in het model. Bij ingewikkelder gedrag kunnen de resultaten anders zijn.",
          details: "In het onderzoek was de mediaan 66 dagen; maar dat is geen gemiddelde, en ook geen streefdoel. De bevinding doet vermoeden dat vaste termijnen zoals “in 21 dagen een gewoonte” niet voor iedereen gelden, en dat af en toe een dag missen het proces niet op nul zet.",
          refs: ["lally2010"],
        },

        {
          id: "b3-oneri",
          type: "suggestion",
          text: "Als je een gewoonte uitprobeert, begin dan met een korte proef van zeven dagen. Het doel is niet om in zeven dagen een gewoonte op te bouwen, maar om te zien of de tijd, de plek en de stap die je hebt gekozen bij je passen. Na die zeven dagen je plan aanpassen hoort bij het experiment.",
        },

        { id: "b3-h5", type: "h", text: "Als het plan niet bij je past" },
        { id: "b3-p10", type: "p", text: "Soms is het probleem niet één slechte dag. Lukt hetzelfde plan een paar dagen achter elkaar niet, dan kan dat betekenen dat niet het plan zich aan jou aanpast, maar jij je aan het plan probeert aan te passen. Voor iemand die om zeven uur 's ochtends wil hardlopen maar elke ochtend de wekker uitzet, is de echte vraag misschien niet “Waarom lukt het me niet?” maar “Past dit tijdstip eigenlijk wel bij mij?”" },
        { id: "b3-p11", type: "p", text: "Als je je plan aanpast, kun je naar drie dingen kijken: de tijd, de plek en de grootte van de stap. Vaak is het genoeg om er één te veranderen. 's Avonds in plaats van 's ochtends, de bibliotheek in plaats van thuis, tien minuten in plaats van een halfuur. Het doel kan hetzelfde blijven; alleen de weg ernaartoe verandert." },
        { id: "b3-p12", type: "p", text: "Bij het aanpassen kan het helpen om naar jezelf te kijken als iemand die een experiment uitvoert. Experimenten geven niet altijd het verwachte resultaat; dat betekent niet dat degene die ze uitvoert gefaald heeft, alleen dat duidelijk wordt wat je bij de volgende poging verandert." },

        { id: "b3-h4", type: "h", text: "Twee vragen voor de avond" },
        { id: "b3-p7", type: "p", text: "Probeer aan het eind van de dag niet te tellen hoeveel van je plan is gelukt, maar stel jezelf twee vragen: wat werkte er vandaag? Wat kan ik morgen makkelijker maken? De eerste helpt je zien wat werkt. De tweede stelt het plan voor morgen een beetje bij op basis van wat je vandaag hebt meegemaakt." },
        { id: "b3-p8", type: "p", text: "De antwoorden mogen klein zijn: “Mijn telefoon in een andere kamer leggen hielp.” “Morgen pak ik mijn tas de avond ervoor al in.” Zo gaan plannen bij je leven passen: met kleine aanpassingen, van dag tot dag." },
        { id: "b3-p9", type: "p", text: "Die donderdagavond opende Sanne het bestand van haar opdracht en schreef één zin voor het tweede deel. Daarna ging ze slapen. Toen ze het bestand de volgende ochtend opende, wachtte er geen lege pagina op haar, maar een zin." },

        {
          id: "b3-uygulama",
          type: "exercise",
          title: "Een kleine proef van zeven dagen",
          planner: "habit",
          steps: [
            "Kies één gewoonte die je wilt uitproberen.",
            "Schrijf het kleinste begin op dat haalbaar is: zo klein dat je het zelfs op een slechte dag kunt doen.",
            "Koppel het aan een moment dat al in je dag zit, en bepaal waar je het doet.",
            "Voeg een kleinere optie toe voor moeilijke dagen.",
            "Vink zeven dagen lang elke avond alleen dit aan: gedaan, een kleinere versie gedaan, of niet gedaan. Kijk daarna opnieuw naar je plan.",
          ],
        },

        {
          id: "b3-ozet",
          type: "summary",
          text: "Als je plan in de war raakt, kun je het vaak verschuiven of de stap kleiner maken in plaats van het op te geven; en een dag missen betekent niet dat de weg ophoudt.",
        },
      ],
      sources: ["lally2010"],
    },

    {
      id: "kapanis",
      kind: "outro",
      title: "Tot slot",
      minutes: 2,
      available: true,

        { id: "k1", type: "p", text: "Dit boek ging over drie kleine ideeën: wat je in je hoofd hebt ergens neerleggen, één hoofdtaak voor vandaag en de eerste stap daarvan kiezen, en je plan aanpassen als de dag anders loopt." },

<script>
/*
 * Veri katmanı: günlük kayıtlar, alışkanlık planı, tercihler, yedek alma ve geri yükleme.
 *
 * Şema geçmişi
 *   1 – Yalnızca günlük kayıtlar (gx.ssc.days.v1) ve tercihler (gx.ssc.settings.v1).
 *   2 – Günlük kayda isteğe bağlı zaman seçimi (time) eklendi; alışkanlık verisi (gx.ssc.habit.v1) eklendi;
 *       yedek paketi alışkanlık ve tercihleri de içeriyor.
 *   3 – Günlük kayda gün değerlendirmesi eklendi: rating (null ya da 1–5 tam sayı) ve ratingNote (metin).
 *       Tercihlere tema (system | light | dark) eklendi ve yedeğe dahil edildi.
 *
 * Geri yüklemede "alan yok" ile "alan boş" farklıdır: eski bir yedekte hiç bulunmayan alan (ör. v2 yedeğinde rating)
 * mevcut veriyi SİLMEZ; yeni yedekte açıkça boş/null olan alan ise boş olarak geri yüklenir (bkz. absentFields).
 *
 * Geçiş (1 → 2): Günlük kayıtların anahtarı ve biçimi değişmedi. Eski kayıtlar okunurken eksik alanlara
 * varsayılan değer atanır (migrateDay). Eski "start.what" metni silinmez; arayüz bu metni gösterir ve
 * kullanıcıya ilk küçük adımla eşitleme seçeneği sunar. Hiçbir eski veri otomatik olarak silinmez.
 *
 * Kayıtlar tarih anahtarıyla (YYYY-AA-GG, yerel saat) tutulur; gün değişince eski kayıtların üzerine yazılmaz.
 */
(function (root) {
  "use strict";

  var APP_ID = "genix-small-steps-clear-days";
  var SCHEMA_VERSION = 3;
  var SUPPORTED_BACKUP_VERSIONS = [1, 2, 3];

  var DAYS_KEY = "gx.ssc.days.v1"; // şema 2'de de aynı anahtar: eski kayıtlar yerinde okunur
  var SETTINGS_KEY = "gx.ssc.settings.v1";
  var HABIT_KEY = "gx.ssc.habit.v1";
  var META_KEY = "gx.ssc.meta";
  var SNAPSHOT_KEY = "gx.ssc.beforeRestore";

  var MAX_IMPORT_BYTES = 2 * 1024 * 1024;
  var MAX_TEXT = 4000;
  var MAX_BRAIN = 10000;

  var TIME_BUDGETS = ["", "5", "15", "30", "custom"];
  var HABIT_STATUSES = ["done", "smaller", "skipped"];
  var TEXT_SIZES = ["standard", "large", "larger"];
  var THEMES = ["system", "light", "dark"];
  // Eski yedeklerde bulunmayabilen gün alanları: yoksa geri yüklemede mevcut değer korunur
  var OPTIONAL_DAY_FIELDS = ["time", "rating", "ratingNote"];
  var MOTION_MODES = ["system", "on", "off"];

  var DATE_RE = /^(\d{4})-(\d{2})-(\d{2})$/;
  var ID_RE = /^[a-z0-9_-]{1,40}$/i;

  function pad(n) {
    return (n < 10 ? "0" : "") + n;
  }

  /** Yerel saate göre tarih anahtarı. toISOString() UTC kullandığı için gece yarısı yanlış güne yazabilir. */
  function dateKey(d) {
    d = d || new Date();
    return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
  }

  function isValidDateKey(key) {
    var m = DATE_RE.exec(key);
    if (!m) return false;
    var y = +m[1], mo = +m[2], da = +m[3];
    if (y < 2000 || y > 2100) return false;
    var d = new Date(y, mo - 1, da);
    return d.getFullYear() === y && d.getMonth() === mo - 1 && d.getDate() === da;
  }

  function keyToDate(key) {
    var m = DATE_RE.exec(key);
    return new Date(+m[1], +m[2] - 1, +m[3]);
  }

  function addDays(key, n) {
    var d = keyToDate(key);
    d.setDate(d.getDate() + n);
    return dateKey(d);
  }

  function newId() {
    return "p" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  }

  /* ---------------- Günlük kayıt ---------------- */

  function emptyDay() {
    return {
      brain: "",
      main: { text: "", step: "", done: false },
      extras: [
        { text: "", done: false },
        { text: "", done: false },
      ],
      start: { when: "", where: "", what: "" }, // what: şema 1'den kalan alan, yalnızca eski kayıtlarda dolu olabilir
      time: { budget: "", custom: "" },
      evening: { worked: "", easier: "" },
      rating: null, // gün değerlendirmesi: null ya da 1–5; varsayılan seçim yok
      ratingNote: "",
      updatedAt: null,
    };
  }

  function isDayEmpty(day) {
    if (!day) return true;
    var texts = [
      day.brain, day.main.text, day.main.step,
      day.extras[0].text, day.extras[1].text,
      day.start.when, day.start.where, day.start.what,
      day.time.budget, day.time.custom,
      day.evening.worked, day.evening.easier, day.ratingNote,
    ];
    if (day.rating !== null && day.rating !== undefined) return false; // yalnızca puan girilmiş gün de geçerli kayıttır
    for (var i = 0; i < texts.length; i++) if (texts[i] && String(texts[i]).trim()) return false;
    return !(day.main.done || day.extras[0].done || day.extras[1].done);
  }

  /** İçerik karşılaştırması (güncellenme zamanı hariç): geri yüklemede "aynı" ile "değişecek"i ayırmak için. */
  function sameDay(a, b) {
    var x = JSON.parse(JSON.stringify(a)), y = JSON.parse(JSON.stringify(b));
    x.updatedAt = y.updatedAt = null;
    return JSON.stringify(x) === JSON.stringify(y);
  }

  /* ---------------- Doğrulama yardımcıları ---------------- */

  function ValidationError(code, params) {
    this.code = code;
    this.params = params || {};
  }

  function checkObject(v, key, field) {
    if (!v || typeof v !== "object" || Array.isArray(v)) throw new ValidationError("badField", { key: key, field: field });
    return v;
  }
  function optObject(v, key, field) {
    return v === undefined || v === null ? {} : checkObject(v, key, field);
  }
  function checkText(v, key, field, max) {
    if (v === undefined || v === null) return "";
    if (typeof v !== "string" || v.length > (max || MAX_TEXT)) throw new ValidationError("badField", { key: key, field: field });
    return v;
  }
  function checkBool(v, key, field) {
    if (v === undefined || v === null) return false;
    if (typeof v !== "boolean") throw new ValidationError("badField", { key: key, field: field });
    return v;
  }
  function checkEnum(v, list, key, field) {
    if (v === undefined || v === null) return list[0];
    if (list.indexOf(v) < 0) throw new ValidationError("badField", { key: key, field: field });
    return v;
  }
  function checkStamp(v, key, field) {
    if (v === undefined || v === null) return null;
    if (typeof v !== "string" || v.length > 40) throw new ValidationError("badField", { key: key, field: field });
    return v;
  }

  /**
   * Bir günü doğrular ve şema 2 biçimine getirir (geçiş burada yapılır).
   * Bilinmeyen alanlar atılır; tür hatasında ValidationError fırlatır.
   */
  function migrateDay(raw, key) {
    checkObject(raw, key, "gün");
    var main = optObject(raw.main, key, "main");
    var start = optObject(raw.start, key, "start");
    var time = optObject(raw.time, key, "time"); // şema 1'de yok → boş
    var evening = optObject(raw.evening, key, "evening");
    var extras = raw.extras === undefined ? [] : raw.extras;
    if (!Array.isArray(extras) || extras.length > 2) throw new ValidationError("badField", { key: key, field: "extras" });

    var day = emptyDay();
    day.brain = checkText(raw.brain, key, "brain", MAX_BRAIN);
    day.main.text = checkText(main.text, key, "main.text");
    day.main.step = checkText(main.step, key, "main.step");
    day.main.done = checkBool(main.done, key, "main.done");
    for (var i = 0; i < extras.length; i++) {
      var ex = checkObject(extras[i], key, "extras");
      day.extras[i].text = checkText(ex.text, key, "extras.text");
      day.extras[i].done = checkBool(ex.done, key, "extras.done");
    }
    day.start.when = checkText(start.when, key, "start.when");
    day.start.where = checkText(start.where, key, "start.where");
    day.start.what = checkText(start.what, key, "start.what");
    day.time.budget = checkEnum(time.budget === undefined ? "" : time.budget, TIME_BUDGETS, key, "time.budget");
    day.time.custom = checkText(time.custom, key, "time.custom", 40);
    day.evening.worked = checkText(evening.worked, key, "evening.worked");
    day.evening.easier = checkText(evening.easier, key, "evening.easier");
    if (raw.rating !== undefined && raw.rating !== null) {
      if (typeof raw.rating !== "number" || raw.rating % 1 !== 0 || raw.rating < 1 || raw.rating > 5) throw new ValidationError("badField", { key: key, field: "rating" });
      day.rating = raw.rating;
    }
    day.ratingNote = checkText(raw.ratingNote, key, "ratingNote", 2000);
    day.updatedAt = checkStamp(raw.updatedAt, key, "updatedAt");
    return day;
  }

  /** Ham kayıtta hiç bulunmayan isteğe bağlı alanlar (eski şema). Geri yüklemede bunlar mevcut veriyi ezmez. */
  function absentDayFields(raw) {
    var out = [];
    for (var i = 0; i < OPTIONAL_DAY_FIELDS.length; i++) {
      if (!raw || !Object.prototype.hasOwnProperty.call(raw, OPTIONAL_DAY_FIELDS[i])) out.push(OPTIONAL_DAY_FIELDS[i]);
    }
    return out;
  }

  /** Yedekteki günü, yedekte bulunmayan alanlar için mevcut değerle tamamlar. */
  function effectiveIncomingDay(current, incoming, absent) {
    if (!current || !absent || !absent.length) return incoming;
    var d = JSON.parse(JSON.stringify(incoming));
    absent.forEach(function (f) { d[f] = JSON.parse(JSON.stringify(current[f])); });

  }

  /* ---------------- Alışkanlık ---------------- */

  var PLAN_FIELDS = ["goal", "start", "anchor", "place", "ease", "smaller"];

  function emptyHabit() {
    return { activePlanId: null, plans: {}, log: {}, reviews: {}, draft: null };
  }

  function emptyPlanFields() {
    return { goal: "", start: "", anchor: "", place: "", ease: "", smaller: "" };
  }

  function migratePlan(raw, id) {
    checkObject(raw, id, "plan");
    if (!ID_RE.test(id)) throw new ValidationError("badField", { key: id, field: "plan.id" });
    var p = { id: id };
    PLAN_FIELDS.forEach(function (f) { p[f] = checkText(raw[f], id, "plan." + f, 500); });
    if (!p.goal.trim()) throw new ValidationError("badField", { key: id, field: "plan.goal" });
    p.createdAt = checkStamp(raw.createdAt, id, "plan.createdAt");
    p.updatedAt = checkStamp(raw.updatedAt, id, "plan.updatedAt");
    p.archivedAt = checkStamp(raw.archivedAt, id, "plan.archivedAt");
    return p;
  }

  function migrateLogEntry(raw, key, plans) {
    checkObject(raw, key, "alışkanlık kaydı");
    var e = {
      status: checkEnum(raw.status, HABIT_STATUSES, key, "habit.status"),
      note: checkText(raw.note, key, "habit.note", 2000),
      planId: checkText(raw.planId, key, "habit.planId", 40),
      updatedAt: checkStamp(raw.updatedAt, key, "habit.updatedAt"),
    };
    if (raw.status === undefined) throw new ValidationError("badField", { key: key, field: "habit.status" });
    if (!plans[e.planId]) throw new ValidationError("badField", { key: key, field: "habit.planId" });
    return e;
  }

  function migrateHabit(raw) {
    var h = emptyHabit();
    if (raw === undefined || raw === null) return h;
    checkObject(raw, "alışkanlık", "habit");
    var plans = optObject(raw.plans, "alışkanlık", "plans");
    Object.keys(plans).forEach(function (id) { h.plans[id] = migratePlan(plans[id], id); });
    var log = optObject(raw.log, "alışkanlık", "log");
    Object.keys(log).forEach(function (k) {
      if (!isValidDateKey(k)) throw new ValidationError("badDate", { key: k.slice(0, 40) });
      h.log[k] = migrateLogEntry(log[k], k, h.plans);
    });
    var reviews = optObject(raw.reviews, "alışkanlık", "reviews");
    Object.keys(reviews).forEach(function (id) {
      if (!h.plans[id]) throw new ValidationError("badField", { key: id, field: "reviews" });
      var r = checkObject(reviews[id], id, "reviews");
      h.reviews[id] = {
        fit: checkText(r.fit, id, "reviews.fit", 2000),
        context: checkText(r.context, id, "reviews.context", 2000),
        shrink: checkText(r.shrink, id, "reviews.shrink", 2000),
        updatedAt: checkStamp(r.updatedAt, id, "reviews.updatedAt"),
      };
    });
    if (raw.activePlanId !== undefined && raw.activePlanId !== null) {
      if (typeof raw.activePlanId !== "string" || !h.plans[raw.activePlanId]) throw new ValidationError("badField", { key: "alışkanlık", field: "activePlanId" });
      h.activePlanId = raw.activePlanId;
    }
    if (raw.draft !== undefined && raw.draft !== null) {
      var d = checkObject(raw.draft, "taslak", "draft");
      var draft = emptyPlanFields();
      PLAN_FIELDS.forEach(function (f) { draft[f] = checkText(d[f], "taslak", "draft." + f, 500); });
      draft.step = typeof d.step === "number" && d.step >= 0 && d.step < 10 ? Math.floor(d.step) : 0;
      draft.editingId = typeof d.editingId === "string" && h.plans[d.editingId] ? d.editingId : null;
      h.draft = draft;
    }
    return h;
  }

  function norm(s) {
    return String(s || "").trim().replace(/\s+/g, " ").toLocaleLowerCase("tr");
  }

  /**
   * Alışkanlık planını oluşturur ya da düzenler (yan etkisiz; yeni nesne döner).
   * Hedef (goal) değiştiyse ve eski planın kayıtları varsa: eski plan arşivlenir, yeni bir plan açılır.
   * Böylece geçmiş kayıtlar yeni hedefe aitmiş gibi görünmez.
   */
  function applyPlanEdit(habit, fields, editingId, nowIso) {
    var h = JSON.parse(JSON.stringify(habit));
    var now = nowIso || new Date().toISOString();
    var clean = emptyPlanFields();
    PLAN_FIELDS.forEach(function (f) { clean[f] = String(fields[f] || "").trim(); });
    var old = editingId ? h.plans[editingId] : null;

    if (old) {
      var hasLogs = Object.keys(h.log).some(function (k) { return h.log[k].planId === old.id; });
      if (norm(old.goal) !== norm(clean.goal) && hasLogs) {
        old.archivedAt = now;
        var id = newId();
        h.plans[id] = Object.assign({ id: id, createdAt: now, updatedAt: now, archivedAt: null }, clean);
        h.activePlanId = id;
        h.draft = null;
        return { habit: h, versioned: true, planId: id };
      }
      PLAN_FIELDS.forEach(function (f) { old[f] = clean[f]; });
      old.updatedAt = now;
      h.draft = null;
      return { habit: h, versioned: false, planId: old.id };
    }

    if (h.activePlanId && h.plans[h.activePlanId]) h.plans[h.activePlanId].archivedAt = now;
    var nid = newId();
    h.plans[nid] = Object.assign({ id: nid, createdAt: now, updatedAt: now, archivedAt: null }, clean);
    h.activePlanId = nid;
    h.draft = null;
    return { habit: h, versioned: false, planId: nid };
  }

  function isHabitEmpty(h) {
    return !h || (!Object.keys(h.plans).length && !Object.keys(h.log).length);
  }

  /* ---------------- Tercihler ---------------- */

  function migrateSettings(raw) {
    var s = raw && typeof raw === "object" && !Array.isArray(raw) ? raw : {};
    var out = {};
    if (MOTION_MODES.indexOf(s.motion) >= 0) out.motion = s.motion;
    if (TEXT_SIZES.indexOf(s.textSize) >= 0) out.textSize = s.textSize;
    if (THEMES.indexOf(s.theme) >= 0) out.theme = s.theme;
    if (s.calendarOpen === true) out.calendarOpen = true;
    if (s.welcomed === true) out.welcomed = true;
    if (typeof s.lang === "string" && /^[a-z]{2}$/.test(s.lang)) out.lang = s.lang; // arayüz dili: yalnızca bu cihazda, yedeğe girmez

      out.reading = { chapterId: s.reading.chapterId.slice(0, 40), blockId: typeof s.reading.blockId === "string" ? s.reading.blockId.slice(0, 40) : null };
    }
    if (typeof s.lastPlace === "string" && s.lastPlace.length < 60) out.lastPlace = s.lastPlace;
    return out;

  /* ---------------- Yedek: ayrıştırma ve doğrulama (yan etkisiz) ---------------- */

  /**
   * Yedek metnini ayrıştırır. Sürüm 1 (yalnızca günler) ve sürüm 2 (günler + alışkanlık + tercihler) kabul edilir.
   * Başarılıysa { ok: true, version, days, habit|null, settings|null }, değilse { ok: false, code, params }.
   */
  function parseBackup(text) {
    try {
      if (typeof text !== "string") throw new ValidationError("notJson");
      if (text.length > MAX_IMPORT_BYTES) throw new ValidationError("tooLarge");
      var data;
      try {
        data = JSON.parse(text.replace(/^﻿/, ""));
      } catch (e) {
        throw new ValidationError("notJson");
      }
      if (!data || typeof data !== "object" || Array.isArray(data)) throw new ValidationError("notJson");
      if (data.app !== APP_ID) throw new ValidationError("wrongApp");
      if (SUPPORTED_BACKUP_VERSIONS.indexOf(data.version) < 0) throw new ValidationError("wrongVersion");
      if (data.days === undefined && data.version === 2) data.days = {};
      if (!data.days || typeof data.days !== "object" || Array.isArray(data.days)) throw new ValidationError("badDays");

      var days = {};
      var absent = {};
      Object.keys(data.days).forEach(function (k) {
        if (!isValidDateKey(k)) throw new ValidationError("badDate", { key: k.slice(0, 40) });
        var day = migrateDay(data.days[k], k);
        if (!isDayEmpty(day)) {
          days[k] = day;
          var a = absentDayFields(data.days[k]);
          if (a.length) absent[k] = a;
        }
      });

      var habit = null, settings = null;
      if (data.version >= 2) {
        habit = migrateHabit(data.habit);
        habit.draft = null; // yarım kalmış kurulum taslağı geri yüklenmez
        if (isHabitEmpty(habit)) habit = null;
        settings = data.settings ? migrateSettings(data.settings) : null;
        if (settings) {
          // Yalnızca görünüm tercihleri taşınır; okuma konumu cihaza özeldir. Yedekte olmayan tercih değiştirilmez.
          settings = { motion: settings.motion, textSize: settings.textSize, theme: settings.theme };

  function buildBackup(days, habit, settings, now) {
    var h = habit ? JSON.parse(JSON.stringify(habit)) : emptyHabit();
    h.draft = null;
    return JSON.stringify(
      {
        app: APP_ID,
        version: SCHEMA_VERSION,
        exportedAt: (now || new Date()).toISOString(),
        days: days,
        habit: h,
        settings: { motion: settings && settings.motion, textSize: settings && settings.textSize, theme: settings && settings.theme },
      },
      null,
      2
    );
  }

  /**
   * Geri yüklemenin etkisini önceden hesaplar (hiçbir şey yazmaz). Arayüz bunu onaydan önce gösterir.
   */
  function planRestore(current, incoming) {
    var r = {
      version: incoming.version,
      daysAdded: [], daysChanged: [], daysSame: [],
      plansAdded: [], plansChanged: [], reviewsChanged: [], logAdded: [], logChanged: [],

      settings: incoming.settings,

    var absent = incoming.absentFields || {};
    Object.keys(incoming.days).sort().forEach(function (k) {
      var cur = current.days[k];
      var inc = effectiveIncomingDay(cur, incoming.days[k], absent[k]);
      if (!cur) r.daysAdded.push(k);
      else if (sameDay(cur, inc)) r.daysSame.push(k);

      Object.keys(ih.plans).forEach(function (id) {

        PLAN_FIELDS.forEach(function (f) { if ((cp[f] || "") !== (ip[f] || "")) diffs.push({ field: f, before: cp[f] || "", after: ip[f] || "" }); });
        if (!!cp.archivedAt !== !!ip.archivedAt && id !== ch.activePlanId) diffs.push({ field: "archived", before: !!cp.archivedAt, after: !!ip.archivedAt });
        if (diffs.length) r.plansChanged.push({ id: id, goal: cp.goal, diffs: diffs });
      });
      Object.keys(ih.reviews).forEach(function (id) {
        var cr = ch.reviews[id], ir = ih.reviews[id];
        var diffs = [];

          var b = cr ? cr[f] || "" : "", a = ir[f] || "";

        });
        if (diffs.length) r.reviewsChanged.push({ id: id, goal: (ch.plans[id] || ih.plans[id] || {}).goal || "", diffs: diffs });
      });
      Object.keys(ih.log).sort().forEach(function (k) {
        var cur = ch.log[k], inc = ih.log[k];
        if (!cur) r.logAdded.push(k);
        else if (cur.status !== inc.status || cur.note !== inc.note || cur.planId !== inc.planId) r.logChanged.push({ key: k, before: cur, after: inc });
      });
      if (ch.activePlanId) r.keepsActivePlan = true;
      else if (ih.activePlanId) r.adoptsActivePlan = true;
    }
    return r;
  }

  /** Geri yükleme birleştirmesi: yedekteki aynı tarihli kayıtlar kullanılır, diğerleri korunur. */
  function mergeRestore(current, incoming) {
    var days = JSON.parse(JSON.stringify(current.days));
    var absent = incoming.absentFields || {};
    Object.keys(incoming.days).forEach(function (k) { days[k] = effectiveIncomingDay(current.days[k], incoming.days[k], absent[k]); });
    var habit = JSON.parse(JSON.stringify(current.habit));
    if (incoming.habit) {
      var ih = incoming.habit;
      Object.keys(ih.plans).forEach(function (id) {
        var p = JSON.parse(JSON.stringify(ih.plans[id]));
        // Bu cihazda aktif olan plan geri yüklemeyle arşive düşmesin
        if (id === habit.activePlanId) p.archivedAt = null;
        habit.plans[id] = p;

      Object.keys(ih.log).forEach(function (k) { habit.log[k] = ih.log[k]; });
      Object.keys(ih.reviews).forEach(function (id) { habit.reviews[id] = ih.reviews[id]; });
      if (!habit.activePlanId && ih.activePlanId) habit.activePlanId = ih.activePlanId;

  }

    }

      var ok = writeJSON(DAYS_KEY, days);
      unsavedDays = ok ? null : JSON.parse(JSON.stringify(days));
      return ok;
    }

    function loadHabit() {
      if (unsavedHabit) return JSON.parse(JSON.stringify(unsavedHabit));

        return migrateHabit(readJSON(HABIT_KEY, null));
      } catch (e) {
        return emptyHabit();
      }
    }

    function writeHabit(h) {
      var ok = writeJSON(HABIT_KEY, h);

    }

      HABIT_KEY: HABIT_KEY,

      getDays: loadDays,
      getDay: function (key) {

      },

      /** Yalnızca verilen tarihin kaydını yazar; diğer günlere dokunmaz. Boş gün kaydedilmez. */
      saveDay: function (key, day) {

        var days = loadDays();
        if (isDayEmpty(day)) {
          delete days[key];
        } else {
          day.updatedAt = new Date().toISOString();

            days[key] = migrateDay(day, key);
          } catch (e) {

          }

      },
      deleteDay: function (key) {

      },

      getHabit: loadHabit,
      saveHabit: function (h) {

      },

      deleteAll: function () {
        var a = writeDays({});

      },

      planRestore: function (incoming) {
        return planRestore({ days: loadDays(), habit: loadHabit() }, incoming);
      },

      /** Geri yükleme: önce mevcut verinin kopyası saklanır, sonra birleştirilir. */
      applyRestore: function (incoming) {
        var current = { days: loadDays(), habit: loadHabit() };
        writeJSON(SNAPSHOT_KEY, { at: new Date().toISOString(), days: current.days, habit: current.habit });
        var merged = mergeRestore(current, incoming);
        var ok = writeDays(merged.days) && writeHabit(merged.habit);
        if (ok && incoming.settings) {
          var patch = {};
          if (incoming.settings.motion) patch.motion = incoming.settings.motion;
          if (incoming.settings.textSize) patch.textSize = incoming.settings.textSize;
          if (incoming.settings.theme) patch.theme = incoming.settings.theme;
          api.setSettings(patch);
        }
        return ok;
      },

      exportText: function () {
        return buildBackup(loadDays(), loadHabit(), api.getSettings());
      },
      hasAnyData: function () {
        return Object.keys(loadDays()).length > 0 || !isHabitEmpty(loadHabit());
      },

      getSettings: function () {
        return migrateSettings(readJSON(SETTINGS_KEY, {}));
      },
      setSettings: function (patch) {
        var s = readJSON(SETTINGS_KEY, {});
        if (!s || typeof s !== "object") s = {};
        Object.keys(patch).forEach(function (k) { s[k] = patch[k]; });
        return writeJSON(SETTINGS_KEY, s);
      },
    };
    return api;
  }

  /**
   * Ay takvimi: haftalar pazartesi başlar. Dönen dizi 7'nin katıdır; ay dışındaki hücreler null.
   * month: 0–11
   */
  function monthGrid(year, month) {
    var first = new Date(year, month, 1);
    var lead = (first.getDay() + 6) % 7; // pazartesi = 0
    var count = new Date(year, month + 1, 0).getDate();
    var cells = [];
    for (var i = 0; i < lead; i++) cells.push(null);
    for (var d = 1; d <= count; d++) cells.push(dateKey(new Date(year, month, d)));

    return cells;
  }

  var api = {
    APP_ID: APP_ID,
    THEMES: THEMES,
    monthGrid: monthGrid,
    SCHEMA_VERSION: SCHEMA_VERSION,
    TIME_BUDGETS: TIME_BUDGETS,
    HABIT_STATUSES: HABIT_STATUSES,
    PLAN_FIELDS: PLAN_FIELDS,
    dateKey: dateKey,
    keyToDate: keyToDate,
    addDays: addDays,
    isValidDateKey: isValidDateKey,
    newId: newId,
    emptyDay: emptyDay,
    isDayEmpty: isDayEmpty,
    migrateDay: migrateDay,
    emptyHabit: emptyHabit,
    emptyPlanFields: emptyPlanFields,
    migrateHabit: migrateHabit,
    applyPlanEdit: applyPlanEdit,

  /** Cümle ortasına giren alanın ilk harfi Türkçe kurallarıyla küçültülür ("Masamda" → "masamda"); kısaltmalara dokunulmaz ("AVM'de"). */
  function midSentence(s) {
    s = String(s || "").trim();
    if (s.length > 1 && s[1] === s[1].toLocaleUpperCase("tr") && s[1] !== s[1].toLocaleLowerCase("tr")) return s;

  var reduceMQ = window.matchMedia ? window.matchMedia("(prefers-reduced-motion: reduce)") : { matches: false };

  function themeMode() {

  function applyTheme() {
    var m = themeMode();

    else document.documentElement.setAttribute("data-theme", m);

        if (meta.getAttribute("data-media")) meta.setAttribute("media", meta.getAttribute("data-media"));

  function openDialog(dlg) {

    if (typeof dlg.showModal === "function") {

        dlg.showModal();
        return;

    dlg.classList.add("is-fallback");

  function closeDialog(dlg) {
    if (typeof dlg.close === "function" && !dlg.classList.contains("is-fallback")) {

    } else {
      dlg.removeAttribute("open");

  function navigate(hash) {

  function parseHash() {
    var hsh = decodeURIComponent((location.hash || "").replace(/^#/, ""));
    if (!hsh || hsh === "hosgeldin") return { view: "home" };
    if (hsh === "oku") return { view: "contents" };
    if (hsh.indexOf("oku-") === 0) return { view: "chapter", id: hsh.slice(4) };
    if (hsh === "gunum" || hsh === "planla") return { view: "day", date: STORE.dateKey(), today: true };
    if (hsh.indexOf("gun-") === 0 && STORE.isValidDateKey(hsh.slice(4))) return { view: "day", date: hsh.slice(4), today: hsh.slice(4) === STORE.dateKey() };
    if (hsh === "gecmis") return { view: "history" };
    if (hsh === "aliskanlik") return { view: "habit" };
    if (hsh === "aliskanlik-kur") return { view: "wizard" };
    return { view: "home" };
  }

  var TAB_OF = { contents: "oku", chapter: "oku", day: "gunum", history: "gunum", habit: "aliskanlik", wizard: "aliskanlik" };

  function route() {
    var r = parseHash();
    flushSave();
    cleanupFns.forEach(function (fn) { fn(); });
    cleanupFns = [];

    state.view = r.view;
    viewEl.textContent = "";
    viewEl.className = "view";

    var tab = TAB_OF[r.view];
    document.querySelectorAll("[data-nav]").forEach(function (b) {
      if (b.getAttribute("data-nav") === tab) b.setAttribute("aria-current", "page");
      else b.removeAttribute("aria-current");
    });

    try {
      if (r.view === "home") renderHome();
      else if (r.view === "contents") renderContents();
      else if (r.view === "chapter") renderChapter(r.id);
      else if (r.view === "day") renderDay(r.date, r.today);
      else if (r.view === "history") renderHistory();
      else if (r.view === "habit") renderHabit();
      else if (r.view === "wizard") renderWizard();
    } catch (err) {
      if (!BOOT.isStarted || !BOOT.isStarted()) throw err; // ilk açılışta init yakalar
      renderViewError(err, r.view);
    }

    // Açılıştaki "Kaldığın yerden devam et" için son bölüm
    var place = { chapter: "oku-" + (r.id || ""), day: r.today ? "gunum" : null, habit: "aliskanlik" }[r.view];
    if (place) store.setSettings({ lastPlace: place });
